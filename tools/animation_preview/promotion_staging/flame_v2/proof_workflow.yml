name: CH MapForge Coaster Video Proof

on:
  push:
    branches:
      - main
    paths:
      - "tools/animation_preview/coaster_jobs/*.json"
      - "tools/animation_preview/examples/coaster_flame_train_4car_mapforge.json"
      - "C++/MapForge2/projects/coaster_flame_01.mapforge.json"
      - "C++/MapForge2/src/coaster_video_proof_main.cpp"
      - "C++/MapForge2/src/coaster_project_video_main.cpp"
      - "src/coaster_car_pose.h"
      - "assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png"
      - "assets/vehicles/coaster_flame_01/car_pose_atlas_runtime_v2.json"
      - "assets/vehicles/coaster_flame_01/coaster_flame_01_runtime.json"
  workflow_dispatch:
    inputs:
      job_path:
        description: "CH_COASTER_VIDEO_PROOF_V1 JSON path"
        required: false
        default: "tools/animation_preview/examples/coaster_flame_train_4car_mapforge.json"
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve proof job
        shell: pwsh
        run: |
          $defaultJob = "tools/animation_preview/examples/coaster_flame_train_4car_mapforge.json"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $jobPath = "${{ inputs.job_path }}"
            if ([string]::IsNullOrWhiteSpace($jobPath)) { $jobPath = $defaultJob }
          } else {
            $jobPath = git diff --name-only HEAD^ HEAD |
              Where-Object { $_ -like "tools/animation_preview/coaster_jobs/*.json" } |
              Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($jobPath)) { $jobPath = $defaultJob }
          }
          if (-not (Test-Path $jobPath)) { throw "Coaster video job does not exist: $jobPath" }
          $job = Get-Content $jobPath -Raw | ConvertFrom-Json
          if ($job.contract -ne "CH_COASTER_VIDEO_PROOF_V1") { throw "Unsupported coaster video proof contract" }
          if ($job.carPoseContract -ne "CH_COASTER_CAR_ATLAS_RUNTIME_V2") { throw "Coaster video must use promoted V2 car poses" }
          if ($job.carCount -ne 4) { throw "Runtime contract requires exactly four articulated cars" }
          if ($job.fps -ne 30 -or $job.durationSeconds -ne 12 -or $job.frameCount -ne 360) { throw "Proof timing contract mismatch" }
          foreach ($path in @($job.project, $job.atlas, $job.atlasManifest)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path $path)) { throw "Coaster proof input missing: $path" }
          }
          "CH_COASTER_VIDEO_JOB=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt and FFmpeg
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          "C:/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: Configure MapForge coaster renderer
        shell: pwsh
        run: cmake -S tools/animation_preview/coaster_video_proof -B build/ch-coaster-video -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build MapForge coaster renderer
        shell: pwsh
        run: cmake --build build/ch-coaster-video --config Release --target MapForge2CoasterVideoProof --parallel

      - name: Hard-invalidate stale render state
        shell: pwsh
        run: |
          $job = Get-Content $env:CH_COASTER_VIDEO_JOB -Raw | ConvertFrom-Json
          foreach ($path in @($env:CH_COASTER_VIDEO_JOB, $job.project, $job.atlas, $job.atlasManifest)) {
            if (-not (Test-Path $path)) { throw "Fingerprint input missing: $path" }
          }
          $parts = @(
            (Get-FileHash $env:CH_COASTER_VIDEO_JOB -Algorithm SHA256).Hash,
            (Get-FileHash $job.project -Algorithm SHA256).Hash,
            (Get-FileHash $job.atlas -Algorithm SHA256).Hash,
            (Get-FileHash $job.atlasManifest -Algorithm SHA256).Hash,
            "CH_COASTER_CENTERLINE_ROUTE_V2",
            "CH_COASTER_TRAIN_RUNTIME_V2",
            $job.carPoseContract
          )
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($parts -join "|"))
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $fingerprint = ([System.BitConverter]::ToString($sha.ComputeHash($bytes))).Replace("-", "").ToLowerInvariant()
          if (Test-Path "out/ch-coaster-video") { Remove-Item "out/ch-coaster-video" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path out/ch-coaster-video/frames | Out-Null
          $fingerprint | Set-Content -Path out/ch-coaster-video/render_fingerprint.txt -Encoding ascii
          "CH_COASTER_RENDER_FINGERPRINT=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render articulated train frames
        shell: pwsh
        env:
          QT_PLUGIN_PATH: C:/Qt/6.8.3/msvc2022_64/plugins
        run: |
          $job = Get-Content $env:CH_COASTER_VIDEO_JOB -Raw | ConvertFrom-Json
          build/ch-coaster-video/Release/MapForge2CoasterVideoProof.exe out/ch-coaster-video/frames $job.atlas $job.project
          $frames = Get-ChildItem out/ch-coaster-video/frames -Filter "frame_*.png" -File
          if ($frames.Count -ne 360) { throw "Expected 360 proof frames, got $($frames.Count)" }

      - name: Encode MP4 and contact sheet
        shell: pwsh
        run: |
          ffmpeg -y -framerate 30 -i "out/ch-coaster-video/frames/frame_%04d.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "out/ch-coaster-video/coaster_flame_train_4car_mapforge.mp4"
          ffmpeg -y -i "out/ch-coaster-video/coaster_flame_train_4car_mapforge.mp4" -vf "fps=1,scale=640:-1,tile=4x3" -frames:v 1 "out/ch-coaster-video/contact_sheet.png"
          if (-not (Test-Path "out/ch-coaster-video/coaster_flame_train_4car_mapforge.mp4")) { throw "MP4 was not produced" }
          $probe = ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of json "out/ch-coaster-video/coaster_flame_train_4car_mapforge.mp4"
          $probe | Set-Content -Path out/ch-coaster-video/ffprobe.json -Encoding utf8

      - name: Write proof report
        shell: pwsh
        run: |
          $job = Get-Content $env:CH_COASTER_VIDEO_JOB -Raw | ConvertFrom-Json
          $report = [ordered]@{
            contract = "CH_COASTER_VIDEO_PROOF_V3"
            status = "ok"
            renderer = "MapForge2CoasterVideoProof"
            mapForgeProject = $job.project
            routeContract = "CH_COASTER_CENTERLINE_ROUTE_V2"
            trainRuntimeContract = "CH_COASTER_TRAIN_RUNTIME_V2"
            carPoseContract = $job.carPoseContract
            trackContract = "CH_COASTER_TRACK_V1"
            renderFingerprint = $env:CH_COASTER_RENDER_FINGERPRINT
            staleFrameReuseAllowed = $false
            carCount = 4
            frameCount = 360
            fps = 30
            durationSeconds = 12
            atlas = $job.atlas
            atlasManifest = $job.atlasManifest
            video = "coaster_flame_train_4car_mapforge.mp4"
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content -Path out/ch-coaster-video/proof_report.json -Encoding utf8

      - name: Upload coaster video proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-MapForge-Coaster-Video-Proof-V3-${{ github.run_id }}
          path: |
            out/ch-coaster-video/coaster_flame_train_4car_mapforge.mp4
            out/ch-coaster-video/contact_sheet.png
            out/ch-coaster-video/ffprobe.json
            out/ch-coaster-video/proof_report.json
            out/ch-coaster-video/render_fingerprint.txt
          if-no-files-found: error
          retention-days: 14

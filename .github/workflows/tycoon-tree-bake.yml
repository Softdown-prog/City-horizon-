name: Tycoon Tree Bake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/assets/park_tree_broadleaf_01.fractal.json"
      - "tools/tycoon_photo_studio/build_classic_tree.py"
      - "tools/tycoon_photo_studio/run_classic_tree_compat.py"
      - "tools/tycoon_photo_studio/stylize_foliage_2d.py"
      - "tools/tycoon_photo_studio/build_scene.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - "tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json"
      - ".github/workflows/tycoon-tree-bake.yml"

permissions:
  contents: read

jobs:
  bake-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET_ID: park_tree_broadleaf_01
      TREE_SOURCE: tools/tycoon_photo_studio/assets/park_tree_broadleaf_01.fractal.json
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      CH_TYCOON_SHADOW_SAMPLES: "4"
      CH_TYCOON_SHADOW_DENOISING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Validate classic tree source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('tools/tycoon_photo_studio/assets/park_tree_broadleaf_01.fractal.json').read_text())
          assert data['contract'] == 'TYCOON_FRACTAL_TREE_SOURCE_V1'
          assert data['fractalTree']['levels'] == 4
          assert data['fractalTree']['primaryBranches'] == 5
          assert data['leafCards']['count'] == 720
          assert data['leafCards']['interiorFraction'] >= 0.35
          assert len(data['leafCards']['materials']) >= 5
          assert 'canopyParts' not in data
          print('classicTreeSourceGate: PASS')
          print('requestedLeafCards:', data['leafCards']['count'])
          PY

      - name: Download pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          test -n "$blender_exe"
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"

      - name: Bake dense leaf-card tree source renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tree/source
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup \
            --python tools/tycoon_photo_studio/run_classic_tree_compat.py -- \
            --asset-config "$TREE_SOURCE" \
            --studio-preset "$STUDIO_PRESET" \
            --output "$PWD/out/tree/source"

          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('out/tree/source/studio_metadata.json').read_text())
          s = m['sourceSummary']
          assert s['sourceMode'] == 'procedural_leaf_card_tree_v1', s
          assert s['branchCount'] == 75, s
          assert s['leafCardCount'] == 720, s
          print('leafCardGeometryGate: PASS')
          print('branches:', s['branchCount'], 'leafCards:', s['leafCardCount'])
          PY

      - name: Build final PNG package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tree/final
          python tools/tycoon_photo_studio/postprocess.py \
            --input out/tree/source \
            --output out/tree/final \
            --studio-preset "$STUDIO_PRESET"

      - name: Apply classic pre-rendered foliage profile
        shell: bash
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/stylize_foliage_2d.py \
            --package out/tree/final \
            --asset-id "$ASSET_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('out/tree/final/park_tree_broadleaf_01_manifest.json').read_text())
          pp = m['candidatePostProcess']
          assert pp['mode'] == 'classic_prerendered_foliage_v2'
          assert pp['paletteColors'] == 64
          assert pp['dither'] == 'floyd_steinberg'
          assert pp['expectsLeafMicrogeometry'] is True
          assert pp['shadowAlphaMax'] == 54
          print('classicPrerenderedFoliageGate: PASS')
          PY

      - name: Verify final tree package
        shell: bash
        run: |
          set -euo pipefail
          for direction in south east west north; do
            test -f "out/tree/final/${ASSET_ID}_${direction}.png"
          done
          test -f "out/tree/final/${ASSET_ID}_4view.png"
          test -f "out/tree/final/${ASSET_ID}_review.png"
          test -f "out/tree/final/${ASSET_ID}_4dir_context.png"

      - name: Upload tree PNGs
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Park-Tree-PNGs
          path: |
            out/tree/final
            out/tree/source/studio_metadata.json
          if-no-files-found: error
          retention-days: 14

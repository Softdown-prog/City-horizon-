name: Tycoon Tree Bake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/assets/park_tree_broadleaf_01.json"
      - "tools/tycoon_photo_studio/assets/park_tree_broadleaf_01.fractal.json"
      - "tools/tycoon_photo_studio/generate_fractal_tree_asset.py"
      - "tools/tycoon_photo_studio/build_scene.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - "tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json"
      - ".github/workflows/tycoon-tree-bake.yml"

permissions:
  contents: read

jobs:
  bake-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET_ID: park_tree_broadleaf_01
      FRACTAL_SOURCE: tools/tycoon_photo_studio/assets/park_tree_broadleaf_01.fractal.json
      GENERATED_ASSET_CONFIG: out/tree/generated/park_tree_broadleaf_01.json
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Expand deterministic fractal tree source
        shell: bash
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/generate_fractal_tree_asset.py \
            --input "$FRACTAL_SOURCE" \
            --output "$GENERATED_ASSET_CONFIG"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/tree/generated/park_tree_broadleaf_01.json')
          data = json.loads(p.read_text())
          assert data['contract'] == 'TYCOON_ASSET_SOURCE_V1'
          branch_count = sum(1 for part in data['parts'] if part['name'].startswith('CrownSkeleton_Branch_'))
          assert branch_count == 28, branch_count
          print('fractalTreeGate: PASS')
          print('generatedBranches:', branch_count)
          PY

      - name: Download pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          test -n "$blender_exe"
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"

      - name: Bake tree source renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tree/source
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup \
            --python tools/tycoon_photo_studio/build_scene.py -- \
            --asset-config "$GENERATED_ASSET_CONFIG" \
            --studio-preset "$STUDIO_PRESET" \
            --output "$PWD/out/tree/source"

      - name: Build final PNG package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tree/final
          python tools/tycoon_photo_studio/postprocess.py \
            --input out/tree/source \
            --output out/tree/final \
            --studio-preset "$STUDIO_PRESET"
          for direction in south east west north; do
            test -f "out/tree/final/${ASSET_ID}_${direction}.png"
          done
          test -f "out/tree/final/${ASSET_ID}_4view.png"
          test -f "out/tree/final/${ASSET_ID}_review.png"

      - name: Upload tree PNGs
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Park-Tree-PNGs
          path: |
            out/tree/final
            out/tree/generated
          if-no-files-found: error
          retention-days: 14

name: Finalize Building Activity Overlay Once

on:
  push:
    paths:
      - '.github/workflows/finalize-building-activity-overlay-once.yml'

permissions:
  contents: write

jobs:
  finalize-building-activity-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply canonical activity overlay patch
        run: python3 tools/apply_building_activity_overlay.py

      - name: Validate focused change
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          h = Path('src/building_system.h').read_text(encoding='utf-8')
          cpp = Path('src/building_system.cpp').read_text(encoding='utf-8')
          render = Path('src/ch_render/map_renderer.cpp').read_text(encoding='utf-8')
          doc = Path('docs/BUILDING_ACTIVITY_OVERLAY_V1.md').read_text(encoding='utf-8')
          for token in ['BuildingActivityOverlayDefinition', 'activity_overlay', 'activity_count', 'activity_active()', 'begin_activity', 'end_activity']:
              assert token in h, token
          for token in ['activityOverlay', 'CH_BUILDING_ACTIVITY_OVERLAY_V1', 'instance.activity_count = 0;', 'BuildingManager::begin_activity', 'BuildingManager::end_activity']:
              assert token in cpp, token
          for token in ['instance->activity_active()', 'activity.sprite_paths', 'SDL_RenderTexture(renderer, overlay']:
              assert token in render, token
          assert 'CH_BUILDING_ACTIVITY_OVERLAY_V1' in doc
          PY

      - name: Remove temporary helpers
        run: |
          rm -f tools/apply_building_activity_overlay.py
          rm -f .github/workflows/add-building-activity-overlay-once.yml
          rm -f .github/workflows/add-building-activity-overlay-retry-once.yml
          rm -f .github/workflows/finalize-building-activity-overlay-once.yml

      - name: Commit activity overlay pipeline
        run: |
          git config user.name 'OpenAI'
          git config user.email 'openai@users.noreply.github.com'
          git add -A src/building_system.h src/building_system.cpp src/ch_render/map_renderer.cpp docs/BUILDING_ACTIVITY_OVERLAY_V1.md tools/apply_building_activity_overlay.py .github/workflows/add-building-activity-overlay-once.yml .github/workflows/add-building-activity-overlay-retry-once.yml .github/workflows/finalize-building-activity-overlay-once.yml
          git commit -m 'Add building activity overlay pipeline'
          git pull --rebase origin main
          git push origin main

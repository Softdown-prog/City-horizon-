name: Visitor Forge 2D Tree Single View Test

on:
  push:
    branches:
      - feature/ch-character-studio-art-v0
    paths:
      - '.github/workflows/visitor-forge-tree-single-view-test.yml'

permissions:
  contents: read

jobs:
  render-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Visitor Forge 2D
        run: |
          python -m pip install -e tools/visitor_forge_2d
          python -m pip install pytest

      - name: Validate organic scenery pipeline
        run: python -m pytest -q tools/visitor_forge_2d/tests/test_organic_scenery.py

      - name: Render broadleaf through Forge 2D
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/forge2d_tree_test/full out/forge2d_tree_test/single
          recipe='tools/visitor_forge_2d/examples/park_tree_broadleaf_organic_02.json'
          test -f "$recipe"
          python -m visitor_forge_2d.core.organic_scenery \
            --recipe "$recipe" \
            --output out/forge2d_tree_test/full
          src='out/forge2d_tree_test/full/park_tree_broadleaf_organic_02_south.png'
          test -s "$src"
          cp "$src" 'out/forge2d_tree_test/single/forge2d_tree_test_south.png'
          python - <<'PY'
          from PIL import Image
          p='out/forge2d_tree_test/single/forge2d_tree_test_south.png'
          im=Image.open(p)
          assert im.mode == 'RGBA', im.mode
          assert im.width >= 128 and im.height >= 128, im.size
          print('FORGE2D_TREE_TEST_PASS', im.size, im.mode)
          PY

      - name: Upload single-view tree PNG
        uses: actions/upload-artifact@v4
        with:
          name: Forge2D-Tree-Single-View-${{ github.run_number }}
          path: out/forge2d_tree_test/single/forge2d_tree_test_south.png
          retention-days: 14
          if-no-files-found: error

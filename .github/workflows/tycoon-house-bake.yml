name: Tycoon Residential House Bake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/assets/residential_house_2x2_01.json"
      - "tools/tycoon_photo_studio/build_scene.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - "tools/tycoon_photo_studio/validate_package.py"
      - "tools/blender_bake_runner.py"
      - "tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json"
      - "C++/MapForge2/presets/tycoon_asset_bake_contract.json"
      - ".github/workflows/tycoon-house-bake.yml"

permissions:
  contents: read

jobs:
  bake-house:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASSET_ID: residential_house_2x2_01
      ASSET_SOURCE: tools/tycoon_photo_studio/assets/residential_house_2x2_01.json
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      BAKE_CONTRACT: C++/MapForge2/presets/tycoon_asset_bake_contract.json
      OUTPUT_DIR: out/bake/residential_house_2x2_01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Validate house source
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,pathlib; s=json.loads(pathlib.Path('$ASSET_SOURCE').read_text()); assert s['contract']=='TYCOON_ASSET_SOURCE_V1'; assert s['assetId']=='residential_house_2x2_01'; assert s['footprint']['widthTiles']==2 and s['footprint']['depthTiles']==2; print('residentialHouseSourceGate: PASS')"

      - name: Download pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          test -n "$blender_exe"
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"

      - name: Bake four canonical directions
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender_bake_runner.py \
            --contract "$BAKE_CONTRACT" \
            --asset-config "$ASSET_SOURCE" \
            --studio-preset "$STUDIO_PRESET" \
            --blender "$BLENDER_EXE" \
            --output-dir "$OUTPUT_DIR" \
            --xvfb

      - name: Verify PNG package
        shell: bash
        run: |
          set -euo pipefail
          for direction in south east west north; do
            test -f "$OUTPUT_DIR/${ASSET_ID}_${direction}.png"
          done
          test -f "$OUTPUT_DIR/${ASSET_ID}_4view.png"
          test -f "$OUTPUT_DIR/${ASSET_ID}_manifest.json"
          test -f "$OUTPUT_DIR/${ASSET_ID}_review.png"
          test -f "$OUTPUT_DIR/${ASSET_ID}_4dir_context.png"
          test -f "$OUTPUT_DIR/bake_run_report.json"

      - name: Upload house PNGs
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Residential-House-2x2-01
          path: out/bake/residential_house_2x2_01
          if-no-files-found: error
          retention-days: 14

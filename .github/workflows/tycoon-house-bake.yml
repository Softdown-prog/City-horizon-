name: Tycoon House Bake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/tycoon_photo_studio/assets/residential_house_2x2_01.json"
      - "tools/tycoon_photo_studio/build_scene.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - "tools/tycoon_photo_studio/stylize_building_2d.py"
      - "tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json"
      - ".github/workflows/tycoon-house-bake.yml"
permissions:
  contents: read
jobs:
  bake-house:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET_ID: residential_house_2x2_01
      ASSET_SOURCE: tools/tycoon_photo_studio/assets/residential_house_2x2_01.json
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bake dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0
      - name: Validate house source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('tools/tycoon_photo_studio/assets/residential_house_2x2_01.json').read_text(encoding='utf-8'))
          assert data['contract'] == 'TYCOON_ASSET_SOURCE_V1'
          assert data['assetType'] == 'building'
          assert data['studioPreset'] == 'CH_TYCOON_STUDIO_V1'
          assert data['footprint']['widthTiles'] == 2
          assert data['footprint']['depthTiles'] == 2
          print('houseSourceGate: PASS')
          PY
      - name: Download pinned Blender
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 --retry-delay 2 "https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          test -n "$blender_exe"
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"
      - name: Bake canonical four directions
        run: |
          set -euo pipefail
          mkdir -p out/house/source
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup \
            --python tools/tycoon_photo_studio/build_scene.py -- \
            --asset-config "$ASSET_SOURCE" \
            --studio-preset "$STUDIO_PRESET" \
            --output "$PWD/out/house/source"
      - name: Build final PNG package
        run: |
          set -euo pipefail
          mkdir -p out/house/final
          python tools/tycoon_photo_studio/postprocess.py \
            --input out/house/source \
            --output out/house/final \
            --studio-preset "$STUDIO_PRESET"
      - name: Apply classic pre-rendered building profile
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/stylize_building_2d.py \
            --package out/house/final \
            --asset-id "$ASSET_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('out/house/final/residential_house_2x2_01_manifest.json').read_text(encoding='utf-8'))
          pp = manifest['candidatePostProcess']
          assert pp['mode'] == 'classic_prerendered_building_v1'
          assert pp['paletteColors'] == 48
          assert pp['dither'] == 'floyd_steinberg'
          assert pp['posterizeBitsPerChannel'] == 4
          assert pp['roofStructuralRows'] is True
          assert pp['stylizedDiagonalGlassReflection'] is True
          assert pp['internalTechnicalEdges'] is True
          print('classicPrerenderedBuildingGate: PASS')
          PY
      - name: Verify four directions
        run: |
          set -euo pipefail
          for direction in south east west north; do
            test -f "out/house/final/${ASSET_ID}_${direction}.png"
          done
          test -f "out/house/final/${ASSET_ID}_4view.png"
          test -f "out/house/final/${ASSET_ID}_review.png"
      - uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Residential-House-PNGs
          path: |
            out/house/final
            out/house/source/studio_metadata.json
          if-no-files-found: error
          retention-days: 14

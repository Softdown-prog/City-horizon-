name: Apply startup main menu migration once

on:
  push:
    paths:
      - '.github/ui-startup-main-menu-trigger'

jobs:
  patch-startup-main-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/apply_startup_main_menu_patch.py
      - name: Validate focused changes
        run: |
          grep -q 'start_new_city' src/ui_manager.h
          grep -q 'continue_saved_city' src/ui_manager.h
          grep -q 'startup_main_menu' src/ui_manager.cpp
          grep -q 'UiOverlay active_overlay = UiOverlay::main_menu' src/main.cpp
          grep -q 'model.startup_main_menu = startup_main_menu' src/main.cpp
          git diff --check
      - name: Commit focused migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui_manager.h src/ui_manager.cpp src/main.cpp
          git commit -m 'Open game on procedural main menu'
          git push origin main

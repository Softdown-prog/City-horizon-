name: CH Terrain Path Heightfield Repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ch-terrain-path-heightfield-repair.yml"

permissions:
  contents: write

jobs:
  repair-test-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: pwsh
        run: git pull --rebase origin main

      - name: Validate and apply guarded patch
        shell: pwsh
        run: |
          python -m py_compile tools/terrain_path_heightfield_patch.py
          python tools/terrain_path_heightfield_patch.py
          git diff --check

      - name: Configure focused validation
        shell: pwsh
        run: cmake -S . -B build/terrain-path-validation -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON -DCH_VISITOR_FORGE_PREVIEW=OFF

      - name: Build terrain heightfield test
        shell: pwsh
        run: cmake --build build/terrain-path-validation --config Debug --target terrain_heightfield_test --parallel

      - name: Run terrain heightfield test
        shell: pwsh
        run: ctest --test-dir build/terrain-path-validation -C Debug -R "^terrain_heightfield_test$" --output-on-failure

      - name: Build real City Builder
        shell: pwsh
        run: cmake --build build/terrain-path-validation --config Release --target city_builder --parallel

      - name: Commit validated terrain repair
        shell: pwsh
        run: |
          git config user.name "City Horizon CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ch_core/terrain_projection.h src/ch_core/terrain_heightfield_test.cpp src/ch_render/map_renderer.h src/ch_render/map_renderer.cpp src/runtime_map_renderer.h
          git rm .github/workflows/ch-terrain-path-heightfield-repair.yml tools/terrain_path_heightfield_patch.py
          git diff --cached --check
          git commit -m "terrain: keep dirt paths attached to sculpted ground"
          git pull --rebase origin main
          git push origin HEAD:main

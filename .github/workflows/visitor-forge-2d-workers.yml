name: Visitor Forge 2D Workers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visitor-forge-2d-workers.yml'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/workers.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/art_author.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/prop_author.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/prop_grammar.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/prop_cli.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/cli.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/fence_connectivity.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/organic_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/brushes.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/red_mapple_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/flower_bed_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/flower_bed_scenery_v2.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/flower_brushes.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/flowering_brushes.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/flowering_tree_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/fence_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/shape_recipe.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/scene_composer.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/scene_composer_v2.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/scene_composer_v3.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/scene_composer_v4.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/smooth_geometry.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/localized_finish.py'
      - 'tools/visitor_forge_2d/examples/pine_*.json'
      - 'tools/visitor_forge_2d/examples/flower_bed_*.json'
      - 'tools/visitor_forge_2d/examples/park_*fence_*.json'
      - 'tools/visitor_forge_2d/examples/park_wayfinding_sign.json'
      - 'tools/visitor_forge_2d/examples/prop_*_scene_*.json'
      - 'tools/visitor_forge_2d/examples/prop_briefs/*.json'
      - 'tools/visitor_forge_2d/examples/park_tree_red_mapple_*.json'
      - 'tools/visitor_forge_2d/examples/park_tree_flowering_*.json'
      - 'tools/visitor_forge_2d/examples/reference_profiles/tree_visual_profiles_v1.json'
      - 'tools/visitor_forge_2d/tests/test_workers.py'
      - 'tools/visitor_forge_2d/tests/test_art_author.py'
      - 'tools/visitor_forge_2d/tests/test_prop_author.py'
      - 'tools/visitor_forge_2d/tests/test_prop_grammar.py'
      - 'tools/visitor_forge_2d/tests/test_brushes.py'
      - 'tools/visitor_forge_2d/tests/test_flowering_tree.py'
      - 'tools/visitor_forge_2d/tests/test_scene_composer.py'
      - 'tools/visitor_forge_2d/tests/test_scene_composer_v2.py'
      - 'tools/visitor_forge_2d/tests/test_scene_composer_v3.py'
      - 'tools/visitor_forge_2d/tests/test_scene_composer_v4.py'
      - 'tools/visitor_forge_2d/tests/test_fence_connectivity.py'
      - 'tools/visitor_forge_2d/examples/park_tree_broadleaf_early_autumn_v1.json'
      - 'tools/visitor_forge_2d/examples/park_tree_angico_*.json'
      - 'tools/visitor_forge_2d/examples/briefs/*.json'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e tools/visitor_forge_2d
          python -m pip install pytest
      - run: python -m pytest -q tools/visitor_forge_2d/tests/test_workers.py tools/visitor_forge_2d/tests/test_art_author.py tools/visitor_forge_2d/tests/test_prop_author.py tools/visitor_forge_2d/tests/test_prop_grammar.py tools/visitor_forge_2d/tests/test_brushes.py tools/visitor_forge_2d/tests/test_flowering_tree.py tools/visitor_forge_2d/tests/test_scene_composer.py tools/visitor_forge_2d/tests/test_scene_composer_v2.py tools/visitor_forge_2d/tests/test_scene_composer_v3.py tools/visitor_forge_2d/tests/test_scene_composer_v4.py tools/visitor_forge_2d/tests/test_fence_connectivity.py

  render-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name:
          - pine_tree_organic_v1
          - pine_small_v1
          - pine_tall_v1
          - pine_robust_v1
          - flower_bed_01
          - park_tree_flowering_open_v1
          - park_wayfinding_sign
          - prop_rowboat_scene_v4
          - prop_pier_scene_v4
          - park_iron_fence_01
          - park_chainlink_fence_01
          - park_wood_fence_01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e tools/visitor_forge_2d
      - name: Recipe, render, alpha, camera and provenance workers
        run: |
          python -m visitor_forge_2d run-workers \
            --recipe "tools/visitor_forge_2d/examples/${{ matrix.name }}.json" \
            --output out/visitor_forge_2d/workers
      - uses: actions/upload-artifact@v4
        with:
          name: Visitor-Forge-2D-${{ matrix.name }}-${{ github.run_number }}
          path: out/visitor_forge_2d/workers/
          retention-days: 14
          if-no-files-found: error

  author-briefs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e tools/visitor_forge_2d
      - name: Author and render versioned art briefs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/visitor_forge_2d/author
          for brief in tools/visitor_forge_2d/examples/briefs/*.json; do
            python -m visitor_forge_2d author-art \
              --brief "$brief" \
              --output out/visitor_forge_2d/author
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Visitor-Forge-2D-Art-Author-${{ github.run_number }}
          path: out/visitor_forge_2d/author/
          retention-days: 14
          if-no-files-found: error

  author-props:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e tools/visitor_forge_2d
      - name: Author and render parametric prop briefs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/visitor_forge_2d/props
          for brief in tools/visitor_forge_2d/examples/prop_briefs/*.json; do
            python -m visitor_forge_2d.prop_cli \
              --brief "$brief" \
              --output out/visitor_forge_2d/props
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Visitor-Forge-2D-Prop-Author-${{ github.run_number }}
          path: out/visitor_forge_2d/props/
          retention-days: 14
          if-no-files-found: error

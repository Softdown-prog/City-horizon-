name: Apply interactive settings migration once

on:
  push:
    paths:
      - '.github/ui-settings-interactive-trigger'

permissions:
  contents: write

jobs:
  patch-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_interactive_settings_patch.py

      - name: Validate focused changes
        run: |
          set -euo pipefail
          grep -q 'SettingsDragTarget' src/ui_manager.h
          grep -q 'settings_draft_master_percent_' src/ui_manager.cpp
          grep -q 'CLIQUE OU ARRASTE PARA AJUSTAR' src/ui_manager.cpp
          grep -q 'audio.set_volume_settings(volumes)' src/main.cpp
          git diff --check

      - name: Commit focused migration
        run: |
          set -euo pipefail
          git config user.name 'City Horizon UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui_manager.h src/ui_manager.cpp src/main.cpp
          git commit -m 'Make audio settings controls interactive'
          git push origin HEAD:main

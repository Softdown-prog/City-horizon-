name: CH Runtime Compile Fix 2

on:
  push:
    branches:
      - terrain-construction-gameplay
    paths:
      - ".github/workflows/ch-runtime-compile-fix2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair current runtime compile blockers
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("src/main_runtime_impl.cpp")
          text = runtime.read_text(encoding="utf-8")
          text = text.replace("set_wall_color_customization", "set_wall_color")
          text = text.replace("set_roof_color_customization", "set_roof_color")
          text = text.replace(
              "buildings.clear_color_customization(*selected_instance_id)",
              "(buildings.clear_wall_color(*selected_instance_id) && buildings.clear_roof_color(*selected_instance_id))",
          )
          runtime.write_text(text, encoding="utf-8")

          wrapper = Path("src/main.cpp")
          text = wrapper.read_text(encoding="utf-8")
          start = text.find("#define update_layout(viewport_width, viewport_height, model)")
          end = text.find("\n#include \"main_runtime_impl.cpp\"", start)
          if start < 0 or end < 0:
              raise SystemExit("update_layout wrapper block not found")
          macro = (
              "#define update_layout(viewport_width, viewport_height, model) \\\n"
              "    update_layout((viewport_width), (viewport_height), ([&]() { \\\n"
              "        auto ch_ui_model = (model); \\\n"
              "        ch_fill_citizen_status(ch_ui_model, pedestrians, selected_pedestrian_id); \\\n"
              "        const auto ch_has_build_item = [&](const char* definition_id) { \\\n"
              "            return std::any_of(ch_ui_model.build_items.begin(), ch_ui_model.build_items.end(), \\\n"
              "                               [&](const UiBuildItem& item) { return item.definition_id == definition_id; }); \\\n"
              "        }; \\\n"
              "        if (!ch_has_build_item(\"terrain_raise_tool\")) { \\\n"
              "            const std::string ch_terrain_thumbnail = \\\n"
              "                (asset_root / \"assets/terrain/grass_isometric_01.png\").string(); \\\n"
              "            ch_ui_model.build_items.insert(ch_ui_model.build_items.begin(), { \\\n"
              "                {\"terrain_raise_tool\", \"Elevar Terreno\", \"TERRENO\", \"SEM CUSTO\", true, \\\n"
              "                 ch_terrain_thumbnail, \"PINCEL R2.5\", \\\n"
              "                 \"TERRENO PROPRIO | SOLO VAZIO | CLIQUE E ARRASTE\", 1}, \\\n"
              "                {\"terrain_lower_tool\", \"Rebaixar Terreno\", \"TERRENO\", \"SEM CUSTO\", true, \\\n"
              "                 ch_terrain_thumbnail, \"PINCEL R2.5\", \\\n"
              "                 \"TERRENO PROPRIO | SOLO VAZIO | CLIQUE E ARRASTE\", 1}, \\\n"
              "                {\"terrain_smooth_tool\", \"Suavizar Terreno\", \"TERRENO\", \"SEM CUSTO\", true, \\\n"
              "                 ch_terrain_thumbnail, \"PINCEL R2.5\", \\\n"
              "                 \"SUAVIZA TRANSICOES | SOLO VAZIO | CLIQUE E ARRASTE\", 1}, \\\n"
              "            }); \\\n"
              "        } \\\n"
              "        if (terrain_relief_mode) { \\\n"
              "            ch_ui_model.active_tool = UiTool::buildings; \\\n"
              "            ch_ui_model.selected_building_id = \\\n"
              "                *terrain_relief_mode == ch::TerrainBrushMode::raise ? \"terrain_raise_tool\" : \\\n"
              "                (*terrain_relief_mode == ch::TerrainBrushMode::lower ? \"terrain_lower_tool\" : \"terrain_smooth_tool\"); \\\n"
              "            ch_ui_model.placement_preview_path = \\\n"
              "                (asset_root / \"assets/terrain/grass_isometric_01.png\").string(); \\\n"
              "            ch_ui_model.placement_preview_frame_count = 1; \\\n"
              "            ch_ui_model.placement_rotatable = false; \\\n"
              "            ch_ui_model.placement_rotation_label = \"PINCEL R2.5\"; \\\n"
              "        } \\\n"
              "        gameplay_ui.bind_selection_context( \\\n"
              "            &pedestrians, (viewport_width), (viewport_height), &selected_pedestrian_id, \\\n"
              "            placement_definition_id.empty() && !road_mode && !sidewalk_mode && !land_mode && \\\n"
              "            !terrain_relief_mode && !agriculture_mode && !decoration_mode && active_overlay == UiOverlay::none); \\\n"
              "        return ch_ui_model; \\\n"
              "    }()))"
          )
          text = text[:start] + macro + text[end:]
          wrapper.write_text(text, encoding="utf-8")

      - name: Commit repaired sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/main_runtime_impl.cpp
          git commit -m "Fix remaining runtime compile integration blockers"
          git push origin HEAD:terrain-construction-gameplay

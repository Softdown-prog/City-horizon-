name: CH Procedural Road Screenshot Proof

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  road-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Configure focused MapForge build
        run: cmake -S "C++/MapForge2" -B build/ch-procedural-road -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build procedural road preview
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadPreview --parallel 2

      - name: Render procedural road screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p out/ch-procedural-road
          build/ch-procedural-road/MapForge2ProceduralRoadPreview out/ch-procedural-road/procedural_road_preview.png
          test -s out/ch-procedural-road/procedural_road_preview.png

      - name: Upload procedural road screenshot
        uses: actions/upload-artifact@v4
        with:
          name: CH-Procedural-Road-Screenshot
          path: out/ch-procedural-road/procedural_road_preview.png
          if-no-files-found: error
          retention-days: 14

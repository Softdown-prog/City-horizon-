name: CH Procedural Road Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  proof-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Validate CH Math Worker
        run: |
          python tools/ch_math_worker/worker.py --self-test
          mkdir -p out/ch-procedural-road
          python tools/ch_math_worker/worker.py tools/ch_math_worker/jobs/procedural_road_probe.job.json --output out/ch-procedural-road/math_report.json

      - name: Assert procedural road path is native 2D
        run: |
          grep -q "CH_PROCEDURAL_ROAD_2D_RENDER_V1" src/procedural_road_ground_render_plan.h
          grep -q "ProceduralRoad2DMesh" src/ch_render/procedural_road_network_renderer.h
          grep -q "CH_PROCEDURAL_ROAD_2D_RUNTIME_V1" src/runtime_procedural_road_renderer.h
          grep -q "CH_PROCEDURAL_ROAD_2D_CULLING_V1" src/runtime_procedural_road_culling.h
          grep -q "try_render_procedural_roads_runtime" src/runtime_map_renderer.h
          grep -q "#define MapRenderer RuntimeMapRenderer" main.cpp
          grep -q "LEGACY 3D DIAGNOSTIC ONLY" "C++/MapForge2/CMakeLists.txt"
          if grep -q "RoadMeshBuilder::build_cubic" src/procedural_road_ground_render_plan.h; then
            echo "3D RoadMeshBuilder leaked back into the canonical procedural road plan"
            exit 1
          fi
          if grep -q "source.position.z" src/ch_render/procedural_road_network_renderer.h; then
            echo "Road Z projection leaked back into the canonical procedural 2D renderer"
            exit 1
          fi

      - name: Configure focused MapForge build
        run: >-
          cmake -S "C++/MapForge2" -B build/ch-procedural-road -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSDL_UNIX_CONSOLE_BUILD=ON

      - name: Compile game road runtime integration
        run: |
          cat > out/ch-procedural-road/runtime_road_compile_gate.cpp <<'CPP'
          #include "src/runtime_map_renderer.h"

          int main() {
              RoadManager roads(0, 64);
              ch::CameraState camera{};
              return ch::try_render_procedural_roads_runtime(
                  nullptr, roads, camera, 1280.0F, 720.0F) ? 1 : 0;
          }
          CPP
          c++ -std=c++20 -fsyntax-only \
            -I. \
            -Ibuild/ch-procedural-road/_deps/sdl3-src/include \
            -Ibuild/ch-procedural-road/_deps/sdl3-build/include-revision \
            out/ch-procedural-road/runtime_road_compile_gate.cpp

      - name: Build MapForge editor integration
        run: cmake --build build/ch-procedural-road --target mapforge2_editor --parallel 2

      - name: Build procedural 2D road gate
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadGroundRenderPlanTest --parallel 2

      - name: Run procedural 2D road gate
        run: build/ch-procedural-road/MapForge2ProceduralRoadGroundRenderPlanTest

      - name: Build runtime road review gate
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadRuntimeReviewTest --parallel 2

      - name: Run runtime road review gate
        run: build/ch-procedural-road/MapForge2ProceduralRoadRuntimeReviewTest

      - name: Build procedural 2D PNG proof
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadPngProof --parallel 2

      - name: Render procedural 2D road proof
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/ch-procedural-road/MapForge2ProceduralRoadPngProof out/ch-procedural-road/procedural_road_preview.png
          test -f out/ch-procedural-road/procedural_road_preview.png

      - name: Validate proof outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          png = Path('out/ch-procedural-road/procedural_road_preview.png')
          report = Path('out/ch-procedural-road/math_report.json')
          assert png.is_file() and png.stat().st_size > 1024, png
          assert png.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          data = json.loads(report.read_text(encoding='utf-8'))
          assert data['contract'] == 'CH_MATH_REPORT_V1'
          assert data['workerContract'] == 'CH_MATH_WORKER_V1'
          assert isinstance(data.get('result'), dict) and data['result']
          print('Procedural road 2D renderer + culling + mirror sync + MapForge PNG proof: OK')
          PY

      - name: Upload procedural road proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-Procedural-Road-2D-Proof
          path: out/ch-procedural-road/**
          if-no-files-found: error
          retention-days: 14

name: CH Procedural Road Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  proof-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Validate CH Math Worker
        run: |
          python tools/ch_math_worker/worker.py --self-test
          mkdir -p out/ch-procedural-road
          python tools/ch_math_worker/worker.py tools/ch_math_worker/jobs/procedural_road_probe.job.json --output out/ch-procedural-road/math_report.json

      - name: Configure focused MapForge build
        run: >-
          cmake -S "C++/MapForge2" -B build/ch-procedural-road -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSDL_UNIX_CONSOLE_BUILD=ON

      - name: Build MapForge editor integration
        run: cmake --build build/ch-procedural-road --target mapforge2_editor --parallel 2

      - name: Build ground-only road gate
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadGroundRenderPlanTest --parallel 2

      - name: Run ground-only road gate
        run: build/ch-procedural-road/MapForge2ProceduralRoadGroundRenderPlanTest

      - name: Build procedural road preview
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadPreview --parallel 2

      - name: Build headless PNG proof wrapper
        run: cmake --build build/ch-procedural-road --target MapForge2ProceduralRoadPngProof --parallel 2

      - name: Render procedural road proof
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/ch-procedural-road/MapForge2ProceduralRoadPngProof out/ch-procedural-road/procedural_road_preview.png
          test -f out/ch-procedural-road/procedural_road_preview.png

      - name: Validate proof outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          png = Path('out/ch-procedural-road/procedural_road_preview.png')
          report = Path('out/ch-procedural-road/math_report.json')
          assert png.is_file() and png.stat().st_size > 1024, png
          assert png.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          data = json.loads(report.read_text(encoding='utf-8'))
          assert data['contract'] == 'CH_MATH_REPORT_V1'
          assert data['workerContract'] == 'CH_MATH_WORKER_V1'
          assert isinstance(data.get('result'), dict) and data['result']
          print('Procedural road editor + ground gate + PNG proof: OK')
          PY

      - name: Upload procedural road proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-Procedural-Road-Proof
          path: out/ch-procedural-road/**
          if-no-files-found: error
          retention-days: 14

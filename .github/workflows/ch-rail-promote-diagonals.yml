name: CH Rail Promote Approved Diagonals

on:
  push:
    branches: [main]
    paths:
      - "tools/ch_blender/promote_steam_train_diagonals_v2.py"
      - ".github/workflows/ch-rail-promote-diagonals.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ch-rail-promote-approved-v2
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow for validation
        run: python -m pip install pillow
      - name: Download previously-reviewed V2 render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ch-rail-v2
          gh run download 38054190025 --repo "${{ github.repository }}" --name CH-Blender-Agent-38054190025-1 --dir /tmp/ch-rail-v2
      - name: Verify hashes and promote only new diagonal sprites
        run: python tools/ch_blender/promote_steam_train_diagonals_v2.py /tmp/ch-rail-v2
      - name: Commit promoted assets to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vehicles/steam_train_locomotive_01 assets/vehicles/steam_train_coach_01
          if git diff --cached --quiet; then
            echo "Already promoted; nothing to commit."
            exit 0
          fi
          git commit -m "feat(rail): promote eight approved CH Blender V2 diagonal train sprites"
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply Raspadinha Ambient Animation Runtime

on:
  push:
    branches: [main]
    paths:
      - tools/runtime_migrations/apply_raspadinha_ambient_animation.py

permissions:
  contents: write

jobs:
  apply-runtime-animation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source migration
        run: python tools/runtime_migrations/apply_raspadinha_ambient_animation.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit runtime support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/building_system.h src/building_system.cpp src/ch_render/map_renderer.cpp
          git rm --ignore-unmatch tools/runtime_migrations/apply_raspadinha_ambient_animation.py
          git rm --ignore-unmatch .github/workflows/apply-raspadinha-ambient-animation-runtime.yml
          git commit -m "runtime: support idle-then-greet sprite playback"
          git pull --rebase origin main
          git push origin main

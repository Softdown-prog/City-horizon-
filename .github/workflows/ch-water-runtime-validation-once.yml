name: CH Water Runtime Validation Once

on:
  push:
    paths:
      - '.github/workflows/ch-water-runtime-validation-once.yml'

permissions:
  contents: read

jobs:
  build-water-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=OFF
      - name: Build water runtime pilot
        run: cmake --build build --target water_surface_pilot_runtime --parallel 2
      - name: Verify renderer contract wiring
        run: |
          grep -q 'water_runtime.frame_at_seconds(render_time)' src/ch_render/map_renderer.cpp
          grep -q 'water_runtime_texture(water_runtime, shallow_definition->base_asset_id' src/ch_render/map_renderer.cpp
          grep -q 'water_runtime_color(water_runtime, shallow_definition)' src/ch_render/map_renderer.cpp

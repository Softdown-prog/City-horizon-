name: Crosswalk Runtime Integration

on:
  push:
    paths:
      - '.github/workflows/crosswalk-runtime-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 tools/crosswalk_runtime_integration.py
      - name: Validate diff
        run: git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/building_system.h src/economy_system.h src/economy_system.cpp
          git commit -m "fix(build): complete upgrade and ticket unlink contracts"
          git pull --rebase origin main
          git push origin HEAD:main

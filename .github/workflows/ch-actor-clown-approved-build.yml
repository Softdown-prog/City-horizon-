name: CH Actor Clown Approved Build

on:
  push:
    branches:
      - feature/ch-character-studio-art-v0
    paths:
      - 'tools/ch_actor_lab/build_clown_costume.py'
      - 'tools/ch_actor_lab/validate_clown_costume.py'
      - 'tools/ch_actor_lab/compose_clown_validated_actor.py'
      - 'tools/ch_actor_lab/validated/**'
      - 'tools/ch_actor_lab/skins/**'
      - 'tools/ch_character_studio/specs/clown_01.character.json'
      - 'assets/characters/ch_actor_green_01/frames/**'
      - 'assets/characters/ch_actor_green_01/masks/**'
      - '.github/workflows/ch-actor-clown-approved-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate locked actor authority
        run: python tools/ch_actor_lab/validated/validate_ch_actor_skin.py
      - name: Build clown visual-only overlays
        run: python tools/ch_actor_lab/build_clown_costume.py --root out/clown_overlay --review out/clown_overlay_review.png
      - name: Validate clown overlays
        run: python tools/ch_actor_lab/validate_clown_costume.py --root out/clown_overlay
      - name: Compose over approved actor PNG frames
        run: python tools/ch_actor_lab/compose_clown_validated_actor.py --overlay-root out/clown_overlay --output out/clown_approved
      - name: Upload approved-base clown package
        uses: actions/upload-artifact@v4
        with:
          name: CH-Actor-Clown-Approved-${{ github.run_id }}
          path: |
            out/clown_approved/**
            out/clown_overlay_review.png
          if-no-files-found: error

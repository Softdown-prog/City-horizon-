name: Promote Carousel 512 Runtime

on:
  push:
    paths:
      - 'tools/runtime_packaging/package_carousel_512_runtime.py'
      - '.github/workflows/promote-carousel-512-runtime.yml'

permissions:
  contents: write
  actions: read

jobs:
  package-and-promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download approved 1280 beauty master
        uses: actions/download-artifact@v4
        with:
          name: CH-Blender-Agent-37495772742-1
          path: out/carousel512_source/beauty
          github-token: ${{ github.token }}
          run-id: 37495772742

      - name: Download animated mask master
        uses: actions/download-artifact@v4
        with:
          name: CH-Blender-Agent-37517771764-1
          path: out/carousel512_source/mask
          github-token: ${{ github.token }}
          run-id: 37517771764

      - name: Package 512 runtime atlases
        run: python tools/runtime_packaging/package_carousel_512_runtime.py

      - name: Verify runtime package
        run: |
          test "$(find assets/city_park/carousel/runtime512 -name '*.png' | wc -l)" -eq 8
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/definitions/park_carousel_01.json').read_text())
          assert d['animation']=={'layout':'grid','columns':8,'rows':6,'frameCount':48,'frameDurationMs':125,'playback':'loop'}
          assert d['renderClass']=='large_asset_512_animated_grid'
          print('carousel runtime package verified')
          PY

      - name: Commit runtime package
        run: |
          git config user.name "city-horizon-worker"
          git config user.email "actions@users.noreply.github.com"
          git add assets/city_park/carousel/runtime512 assets/city_park/carousel/park_carousel_01_runtime_manifest.json assets/definitions/park_carousel_01.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote carousel 512 runtime atlases [skip ci]"
          git push origin HEAD:main

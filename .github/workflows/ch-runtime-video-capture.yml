name: CH Runtime Video Capture

# Heavy workflow by design: it compiles the real game, records renderer frames,
# then encodes review media. Keep the push trigger restricted to explicit video
# jobs so ordinary source/assets commits do not spend Windows build minutes.
on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "CH_RUNTIME_VIDEO_JOB_V1 JSON path"
        required: true
        default: "tools/animation_preview/examples/runtime_weather_capture.json"
        type: string
  push:
    branches:
      - main
    paths:
      - "tools/animation_preview/runtime_jobs/*.json"

jobs:
  capture-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve capture job
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $jobPath = "${{ inputs.job_path }}"
          } else {
            $jobPath = git diff-tree --no-commit-id --name-only -r HEAD |
              Where-Object { $_ -like "tools/animation_preview/runtime_jobs/*.json" } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($jobPath)) { throw "No runtime video job found in this commit" }
          if (-not (Test-Path $jobPath)) { throw "Runtime video job does not exist: $jobPath" }
          "CH_VIDEO_JOB=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install media dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Configure City Horizon runtime
        shell: pwsh
        run: cmake -S . -B build/ch-video-runtime -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF -DCH_VISITOR_FORGE_PREVIEW=OFF

      - name: Build City Horizon runtime
        shell: pwsh
        run: cmake --build build/ch-video-runtime --config Release --target city_builder --parallel

      - name: Resolve executable and output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/ch-video-runtime | Out-Null
          $job = Get-Content $env:CH_VIDEO_JOB -Raw | ConvertFrom-Json
          if ($job.contract -ne "CH_RUNTIME_VIDEO_JOB_V1") { throw "Unsupported runtime video job contract" }
          $job.executable = (Resolve-Path "build/ch-video-runtime/Release/city_builder.exe").Path
          $job.cwd = (Resolve-Path ".").Path
          $job.outputDir = (Resolve-Path "out/ch-video-runtime").Path
          $resolved = "out/ch-video-runtime-job-resolved.json"
          $job | ConvertTo-Json -Depth 32 | Set-Content -Path $resolved -Encoding utf8
          "CH_VIDEO_RESOLVED_JOB=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Capture real runtime and encode review video
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          python tools/animation_preview/capture_runtime_video.py --job $env:CH_VIDEO_RESOLVED_JOB

      - name: Validate capture artifact
        shell: pwsh
        run: |
          $report = Get-Content "out/ch-video-runtime/runtime_video_job_report.json" -Raw | ConvertFrom-Json
          if ($report.contract -ne "CH_RUNTIME_VIDEO_JOB_V1" -or $report.status -ne "ok") {
            throw "Runtime video job report failed"
          }
          if (-not (Test-Path "out/ch-video-runtime/runtime_validation.mp4") -and
              -not (Get-ChildItem "out/ch-video-runtime" -Filter *.mp4 -File -ErrorAction SilentlyContinue)) {
            throw "No MP4 validation video was produced"
          }

      - name: Upload CH Video Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: CH-Runtime-Video-Validation
          path: |
            out/ch-video-runtime/**
            out/ch-video-runtime-job-resolved.json
          if-no-files-found: error
          retention-days: 14

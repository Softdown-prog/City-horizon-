name: CH Promote Pirate Ship Runtime

on:
  workflow_run:
    workflows:
      - CH Blender Agent Worker
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  promote-pirate-ship-runtime:
    if: ${{ github.event.workflow_run.id == 37176004189 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sprite tooling
        run: python -m pip install --upgrade pillow

      - name: Download approved V16 pirate ship bake
        uses: actions/download-artifact@v4
        with:
          name: CH-Blender-Agent-37176004189-1
          path: out/pirate-source
          repository: Softdown-prog/City-horizon-
          run-id: 37176004189
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build V16 runtime spritesheets and color masks
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import json

          source = Path("out/pirate-source")
          target = Path("assets/city_park/pirate_ship")
          target.mkdir(parents=True, exist_ok=True)
          directions = ("south", "west", "north", "east")
          frame_count = 28
          frame_duration_ms = 125

          for direction in directions:
              folder = source / f"pirate_ship_swing_passengers_{direction}_003"
              if not folder.is_dir():
                  raise SystemExit(f"missing V16 pirate source folder: {folder}")

              frames = [Image.open(folder / f"swing_{direction}_{index:02d}.png").convert("RGBA")
                        for index in range(frame_count)]
              secondary = [Image.open(folder / f"mask_secondary_{direction}_{index:02d}.png").convert("RGBA")
                           for index in range(frame_count)]
              primary = Image.open(folder / f"mask_primary_{direction}.png").convert("RGBA")

              width, height = frames[0].size
              if (width, height) != (1280, 1280):
                  raise SystemExit(f"unexpected V16 pirate frame size for {direction}: {(width, height)}")
              if any(frame.size != (width, height) for frame in frames + secondary):
                  raise SystemExit(f"inconsistent V16 pirate frames for {direction}")

              sheet = Image.new("RGBA", (width * frame_count, height), (0, 0, 0, 0))
              mask_sheet = Image.new("RGBA", (width * frame_count, height), (0, 0, 0, 0))
              primary_alpha = primary.getchannel("A")
              zero = Image.new("L", (width, height), 0)

              for index, frame in enumerate(frames):
                  sheet.paste(frame, (index * width, 0))
                  secondary_alpha = secondary[index].getchannel("A")
                  secondary_only = ImageChops.subtract(secondary_alpha, primary_alpha)
                  coverage = ImageChops.lighter(primary_alpha, secondary_only)
                  # CH_COLOR_MASK_V1: R=Primary, G=Secondary, B=unused, A=coverage.
                  combined = Image.merge("RGBA", (primary_alpha, secondary_only, zero, coverage))
                  mask_sheet.paste(combined, (index * width, 0))

              sheet_path = target / f"pirate_ship_{direction}_animation.png"
              mask_path = target / f"pirate_ship_{direction}_mask_animation.png"
              sheet.save(sheet_path, optimize=True)
              mask_sheet.save(mask_path, optimize=True)
              expected_size = (width * frame_count, height)
              if Image.open(sheet_path).size != expected_size or Image.open(mask_path).size != expected_size:
                  raise SystemExit(f"invalid V16 runtime strip for {direction}")

          definition_path = Path("assets/definitions/pirate_ship_01.json")
          definition = json.loads(definition_path.read_text(encoding="utf-8"))
          definition["animation"] = {
              "layout": "horizontal",
              "frameCount": frame_count,
              "frameDurationMs": frame_duration_ms,
              "playback": "activity_loop"
          }
          definition["amusementRide"]["capacity"] = 24
          definition["amusementRide"]["cycle"]["durationMs"] = frame_count * frame_duration_ms
          definition["amusementRide"]["passengers"]["seatCount"] = 24
          definition["productionStatus"] = "runtime_animated_four_direction_v16"
          definition["sourceWorkflowRun"] = 37176004189
          definition_path.write_text(json.dumps(definition, indent=2) + "\n", encoding="utf-8")

          manifest_path = target / "pirate_ship_runtime_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "status": "runtime_promoted_v16",
              "sourceWorkflowRun": 37176004189,
              "sourceArtifact": "CH-Blender-Agent-37176004189-1",
              "frameCount": frame_count,
              "fps": 8,
              "frameDurationMs": frame_duration_ms,
              "cycleDurationMs": frame_count * frame_duration_ms,
              "motionProfile": "slow_ascent_peak_dwell_fast_descent_v1",
              "swingApproval": "Viking V16 / human-approved slower pendulum timing"
          })
          manifest["runtimeAssets"] = {
              direction: {
                  "sprite": f"pirate_ship_{direction}_animation.png",
                  "colorMask": f"pirate_ship_{direction}_mask_animation.png"
              }
              for direction in directions
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate V16 runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          definition = json.loads(Path("assets/definitions/pirate_ship_01.json").read_text(encoding="utf-8"))
          assert definition["id"] == "pirate_ship_01"
          assert definition["footprint"] == {"width": 7, "height": 6}
          assert definition["amusementRide"]["capacity"] == 24
          assert definition["amusementRide"]["cycle"]["durationMs"] == 3500
          assert definition["animation"]["frameCount"] == 28
          assert definition["animation"]["frameDurationMs"] == 125
          assert definition["colorMask"]["channels"] == {"R": "primary", "G": "secondary"}
          for path in list(definition["sprites"].values()) + list(definition["colorMask"]["sprites"].values()):
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"runtime asset missing: {p}")
              if Image.open(p).size != (35840, 1280):
                  raise SystemExit(f"runtime strip has wrong dimensions: {p}")
          print("Pirate ship V16 runtime promotion validated")
          PY

      - name: Commit promoted V16 runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city_park/pirate_ship assets/definitions/pirate_ship_01.json
          if git diff --cached --quiet; then
            echo "Pirate V16 runtime assets already promoted."
            exit 0
          fi
          git commit -m "assets: promote pirate ship V16 runtime sprites [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

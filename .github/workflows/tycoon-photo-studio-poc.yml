name: Tycoon Asset Bake 4-Direction POC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/**"
      - "C++/MapForge2/presets/tycoon_asset_bake_contract.json"
      - "C++/MapForge2/CH_TYCOON_ASSET_PIPELINE_V1.md"
      - ".github/workflows/tycoon-photo-studio-poc.yml"

permissions:
  contents: read

jobs:
  render-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install post-processing and headless rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Download pinned Blender portable build
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"

          echo "Downloading Blender $version from $url"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"

          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          if [[ -z "$blender_exe" ]]; then
            echo "blender executable was not found after extraction" >&2
            exit 1
          fi
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"
          echo "Blender executable: $blender_exe"

      - name: Bake four directional source passes headlessly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tycoon_photo_studio/source
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup --python tools/tycoon_photo_studio/build_scene.py -- --output "$PWD/out/tycoon_photo_studio/source"

          for direction in south east west north; do
            test -f "out/tycoon_photo_studio/source/park_kiosk_1x1_${direction}_color_source.png"
            test -f "out/tycoon_photo_studio/source/park_kiosk_1x1_${direction}_shadow_source.png"
          done
          test -f out/tycoon_photo_studio/source/studio_metadata.json

      - name: Generate four-direction game asset package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tycoon_photo_studio/final
          python tools/tycoon_photo_studio/postprocess.py --input out/tycoon_photo_studio/source --output out/tycoon_photo_studio/final

          required=(
            park_kiosk_1x1_south.png
            park_kiosk_1x1_east.png
            park_kiosk_1x1_west.png
            park_kiosk_1x1_north.png
            park_kiosk_1x1_4view.png
            park_kiosk_1x1_atlas.png
            park_kiosk_1x1_review.png
            park_kiosk_1x1_style_matrix.png
            park_kiosk_1x1_4dir_context.png
            park_kiosk_1x1_manifest.json
            tycoon_photo_studio_comparison_board.png
            tycoon_photo_studio_in_game_context.png
            tycoon_photo_studio_manifest.json
          )

          for file in "${required[@]}"; do
            test -f "out/tycoon_photo_studio/final/$file"
          done

      - name: Validate four-direction contract and pivots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("out/tycoon_photo_studio/final/park_kiosk_1x1_manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          assert manifest["contract"] == "TYCOON_ASSET_BAKE_V1"
          assert manifest["cameraContract"] == "CH_CAMERA_V1"
          assert manifest["gridContract"] == "CH_GRID_V1"
          assert manifest["directionCount"] == 4
          assert manifest["directionOrder"] == ["south", "east", "west", "north"]
          assert manifest["footprint"]["widthTiles"] == 1
          assert manifest["footprint"]["depthTiles"] == 1
          assert manifest["candidatePostProcess"]["variantId"] == 3
          pivots = {(view["pivot"]["x"], view["pivot"]["y"]) for view in manifest["views"]}
          assert len(pivots) == 1, pivots
          turns = {view["direction"]: view["quarterTurns"] for view in manifest["views"]}
          assert turns == {"south": 0, "east": 1, "west": 3, "north": 2}, turns
          atlas_dirs = [frame["direction"] for frame in manifest["atlas"]["frames"]]
          assert atlas_dirs == ["south", "east", "west", "north"], atlas_dirs
          print("TYCOON_ASSET_BAKE_V1 validation passed; shared pivot:", next(iter(pivots)))
          PY

      - name: Upload four-direction visual proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tycoon-Asset-Bake-4Dir-POC
          path: out/tycoon_photo_studio
          if-no-files-found: error
          retention-days: 14

name: Tycoon Photo Studio POC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/**"
      - ".github/workflows/tycoon-photo-studio-poc.yml"

permissions:
  contents: read

jobs:
  render-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install post-processing and headless rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Download pinned Blender portable build
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"

          echo "Downloading Blender $version from $url"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"

          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          if [[ -z "$blender_exe" ]]; then
            echo "blender executable was not found after extraction" >&2
            exit 1
          fi
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"
          echo "Blender executable: $blender_exe"

      - name: Bake kiosk source passes headlessly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tycoon_photo_studio/source
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup --python tools/tycoon_photo_studio/build_scene.py -- --output "$PWD/out/tycoon_photo_studio/source"

          test -f out/tycoon_photo_studio/source/tycoon_photo_studio_color_source.png
          test -f out/tycoon_photo_studio/source/tycoon_photo_studio_shadow_reference.png
          test -f out/tycoon_photo_studio/source/studio_metadata.json

      - name: Generate four post-process variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tycoon_photo_studio/final
          python tools/tycoon_photo_studio/postprocess.py --input out/tycoon_photo_studio/source --output out/tycoon_photo_studio/final

          required=(
            tycoon_photo_studio_variant_01.png
            tycoon_photo_studio_variant_02.png
            tycoon_photo_studio_variant_03.png
            tycoon_photo_studio_variant_04.png
            tycoon_photo_studio_color_pass.png
            tycoon_photo_studio_shadow_pass.png
            tycoon_photo_studio_comparison_board.png
            tycoon_photo_studio_in_game_context.png
            tycoon_photo_studio_manifest.json
          )

          for file in "${required[@]}"; do
            test -f "out/tycoon_photo_studio/final/$file"
          done

      - name: Preserve raw source passes beside review outputs
        shell: bash
        run: |
          set -euo pipefail
          cp out/tycoon_photo_studio/source/tycoon_photo_studio_color_source.png out/tycoon_photo_studio/final/tycoon_photo_studio_color_source_1024.png
          cp out/tycoon_photo_studio/source/tycoon_photo_studio_shadow_reference.png out/tycoon_photo_studio/final/tycoon_photo_studio_shadow_reference_1024.png
          cp out/tycoon_photo_studio/source/studio_metadata.json out/tycoon_photo_studio/final/studio_metadata.json

      - name: Upload visual proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tycoon-Photo-Studio-POC
          path: out/tycoon_photo_studio/final
          if-no-files-found: error
          retention-days: 14

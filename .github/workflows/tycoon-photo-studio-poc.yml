name: Tycoon Asset Baker V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/**"
      - ".github/workflows/tycoon-photo-studio-poc.yml"

permissions:
  contents: read

jobs:
  bake-golden-kiosk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET_CONFIG: tools/tycoon_photo_studio/assets/park_kiosk_1x1.json
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      GOLDEN_FINGERPRINT: tools/tycoon_photo_studio/golden/park_kiosk_1x1_golden.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install post-processing and headless rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Download pinned Blender portable build
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"
          echo "Downloading Blender $version from $url"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          if [[ -z "$blender_exe" ]]; then
            echo "blender executable was not found after extraction" >&2
            exit 1
          fi
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"

      - name: Bake golden asset from generic source config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tycoon_asset_baker/source
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup \
            --python tools/tycoon_photo_studio/build_scene.py -- \
            --asset-config "$ASSET_CONFIG" \
            --studio-preset "$STUDIO_PRESET" \
            --output "$PWD/out/tycoon_asset_baker/source"

          for direction in south east west north; do
            test -f "out/tycoon_asset_baker/source/park_kiosk_1x1_${direction}_color_source.png"
            test -f "out/tycoon_asset_baker/source/park_kiosk_1x1_${direction}_shadow_source.png"
          done
          test -f out/tycoon_asset_baker/source/studio_metadata.json

      - name: Build four-direction game asset package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tycoon_asset_baker/final
          python tools/tycoon_photo_studio/postprocess.py \
            --input out/tycoon_asset_baker/source \
            --output out/tycoon_asset_baker/final \
            --studio-preset "$STUDIO_PRESET"

          required=(
            park_kiosk_1x1_south.png
            park_kiosk_1x1_east.png
            park_kiosk_1x1_west.png
            park_kiosk_1x1_north.png
            park_kiosk_1x1_4view.png
            park_kiosk_1x1_atlas.png
            park_kiosk_1x1_review.png
            park_kiosk_1x1_style_matrix.png
            park_kiosk_1x1_4dir_context.png
            park_kiosk_1x1_manifest.json
          )
          for file in "${required[@]}"; do
            test -f "out/tycoon_asset_baker/final/$file"
          done

      - name: Validate contracts, pivot and golden visual regression
        shell: bash
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/validate_package.py \
            --manifest out/tycoon_asset_baker/final/park_kiosk_1x1_manifest.json \
            --asset-config "$ASSET_CONFIG" \
            --studio-preset "$STUDIO_PRESET" \
            --golden-fingerprint "$GOLDEN_FINGERPRINT" \
            --golden-mean-abs-tolerance 6.0

      - name: Upload baker artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tycoon-Asset-Baker-V1-Golden-Kiosk
          path: out/tycoon_asset_baker
          if-no-files-found: error
          retention-days: 14

name: Apply pause main menu migration once

on:
  push:
    paths:
      - '.github/ui-pause-main-menu-trigger'

permissions:
  contents: write

jobs:
  patch-pause-main-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_pause_main_menu_patch.py

      - name: Validate focused changes
        run: |
          set -euo pipefail
          grep -q 'open_main_menu' src/ui_manager.h
          grep -q 'quit_confirm' src/ui_manager.h
          grep -q 'CONFIGURACOES", UiAction::open_settings, true' src/ui_manager.cpp
          grep -q 'MENU PRINCIPAL", UiAction::open_main_menu, true' src/ui_manager.cpp
          grep -q 'SAIR DO JOGO", UiAction::open_quit_confirm, true' src/ui_manager.cpp
          grep -q 'settings_return_overlay' src/main.cpp
          grep -q 'case UiAction::quit_game' src/main.cpp
          grep -q 'case UiAction::back_from_save_load' src/main.cpp
          git diff --check

      - name: Commit focused migration
        run: |
          set -euo pipefail
          git config user.name 'City Horizon UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui_manager.h src/ui_manager.cpp src/main.cpp
          git commit -m 'Complete pause menu navigation and exit flow'
          git push origin HEAD:main

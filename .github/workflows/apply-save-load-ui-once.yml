name: Apply save load UI migration once

on:
  push:
    paths:
      - '.github/ui-save-load-trigger'

permissions:
  contents: write

jobs:
  patch-save-load-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_save_load_ui_patch.py

      - name: Validate focused changes
        run: |
          set -euo pipefail
          grep -q 'save_load' src/ui_manager.h
          grep -q 'SALVAR / CARREGAR' src/ui_manager.cpp
          grep -q 'UiAction::save_game' src/ui_manager.cpp
          grep -q 'save_current_city' src/main.cpp
          grep -q 'load_current_city' src/main.cpp
          grep -q 'model.save_available = std::filesystem::exists(save_path)' src/main.cpp
          git diff --check

      - name: Commit focused migration
        run: |
          set -euo pipefail
          git config user.name 'City Horizon UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui_manager.h src/ui_manager.cpp src/main.cpp
          git commit -m 'Add procedural save load menu'
          git push origin HEAD:main

name: Render Flower Bed Visitor Forge

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/visitor_forge_2d/examples/flower_bed_01.json"
      - "tools/visitor_forge_2d/src/visitor_forge_2d/core/flower_bed_scenery.py"
      - "tools/visitor_forge_2d/tests/test_flower_bed_scenery.py"
      - "tools/visitor_forge_2d/pyproject.toml"
      - ".github/workflows/render-flower-bed-visitor-forge.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Visitor Forge 2D
        run: python -m pip install pytest -e tools/visitor_forge_2d

      - name: Test flower bed renderer
        run: python -m pytest tools/visitor_forge_2d/tests/test_flower_bed_scenery.py -q

      - name: Render procedural raster flower bed
        run: |
          python -m visitor_forge_2d.core.flower_bed_scenery \
            --recipe tools/visitor_forge_2d/examples/flower_bed_01.json \
            --output out/flower_bed

      - name: Validate outputs
        run: |
          test -s out/flower_bed/flower_bed_01.png
          test -s out/flower_bed/flower_bed_01.json
          test -s out/flower_bed/flower_bed_01_review.png
          test -s out/flower_bed/flower_bed_01_isometric_review.png

      - name: Upload flower bed review
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Flower-Bed-Visitor-Forge
          path: out/flower_bed/*
          if-no-files-found: error
          retention-days: 14

name: CH Apply Baked Path Slope Runtime

on:
  push:
    branches:
      - terrain-construction-gameplay
    paths:
      - "tools/integrate_baked_path_slope_runtime.py"
      - ".github/workflows/ch-apply-path-slope-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ch-apply-baked-path-slope-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply runtime sprite-selection integration
        run: python tools/integrate_baked_path_slope_runtime.py

      - name: Verify free-form path renderer is no longer called
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/runtime_terrain_renderer.h').read_text(encoding='utf-8')
          block = text[text.index('constexpr SDL_FColor kDirtUnderlay'):text.index('constexpr SDL_FColor kDeepBase')]
          forbidden = ('render_network_stroke(', 'render_network_material(', 'render_vertical_profile_details(')
          for token in forbidden:
              if token in block:
                  raise SystemExit(f'forbidden runtime free-form path call remains: {token}')
          required = ('select_path_slope_sprite(', 'render_baked_path_slope_sprite(', 'ground_path_flat_filename(')
          for token in required:
              if token not in block:
                  raise SystemExit(f'missing baked sprite integration: {token}')
          print('PASS runtime presentation is sprite_select_only')
          PY

      - name: Commit runtime integration
        run: |
          git add src/runtime_terrain_renderer.h
          if git diff --cached --quiet; then
            echo "Runtime integration already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use baked sprites for terrain path slopes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# One-shot migration workflow; removed after the runtime commit is verified.

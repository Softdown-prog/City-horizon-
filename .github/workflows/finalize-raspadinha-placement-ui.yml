name: Finalize Raspadinha Placement UI

on:
  push:
    branches: [main]
    paths:
      - tools/runtime_migrations/finalize_raspadinha_placement_ui.py
      - .github/workflows/finalize-raspadinha-placement-ui.yml

permissions:
  contents: write

jobs:
  finalize-placement-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded UI and manifest alignment
        run: python tools/runtime_migrations/finalize_raspadinha_placement_ui.py

      - name: Validate JSON and patch whitespace
        shell: bash
        run: |
          python -m json.tool assets/definitions/raspadinha_vendor_01.json >/dev/null
          python -m json.tool assets/props/raspadinha_vendor/raspadinha_vendor.json >/dev/null
          git diff --check

      - name: Commit alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp assets/props/raspadinha_vendor/raspadinha_vendor.json
          git rm --ignore-unmatch tools/runtime_migrations/finalize_raspadinha_placement_ui.py
          git rm --ignore-unmatch .github/workflows/finalize-raspadinha-placement-ui.yml
          git commit -m "ui: describe raspadinha placement requirements"
          git pull --rebase origin main
          git push origin main

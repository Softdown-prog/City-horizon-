name: CH Rail SDL Actual Render Validation

on:
  pull_request:
    paths:
      - "src/rail_sdl_render_capture.cpp"
      - "src/rail_train_sprite_render_adapter.h"
      - "src/rail_turntable_sprite_runtime.h"
      - "tools/rail_visual_proof/audit_steam_train_alpha.py"
      - "CMakeLists.txt"
      - ".github/workflows/ch-rail-sdl-render-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/rail_sdl_render_capture.cpp"
      - "src/rail_train_sprite_render_adapter.h"
      - "src/rail_turntable_sprite_runtime.h"
      - "tools/rail_visual_proof/audit_steam_train_alpha.py"
      - "CMakeLists.txt"
      - ".github/workflows/ch-rail-sdl-render-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-sdl-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-rendered-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, xvfb, SDL desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libxtst-dev
      - name: Configure and compile real SDL visual harness
        run: |
          cmake -S . -B build/rail-sdl-review -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/rail-sdl-review --target rail_sdl_render_capture --parallel 2
      - name: Validate 104 Blender PNGs and runtime integration
        run: |
          python3 tools/rail_visual_proof/check_turntable_runtime_assets.py
          python3 tools/rail_visual_proof/check_runtime_consist_integration.py
      - name: Inspect alpha in approved source sprites
        run: |
          python3 -m pip install pillow
          python3 tools/rail_visual_proof/audit_steam_train_alpha.py
      - name: Record 96 SDL frames of locomotive, seven wagons and rotating turntable
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p out/rail-sdl-capture
          build/rail-sdl-review/rail_sdl_render_capture out/rail-sdl-capture
          test "$(find out/rail-sdl-capture -name 'frame_*.png' | wc -l)" -eq 96
      - name: Encode short MP4 from SDL pixels
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 12 \
            -i out/rail-sdl-capture/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 21 \
            out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
          test -s out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
          cp out/rail-sdl-capture/frame_0050.png out/rail-sdl-capture/rail_sdl_review_preview.png
          cp out/rail-sdl-capture/frame_0012.png out/rail-sdl-capture/rail_sdl_matte_source_frame_12.png
          cp out/rail-sdl-capture/frame_0036.png out/rail-sdl-capture/rail_sdl_matte_source_frame_36.png
      - name: Upload MP4, SDL screenshot and production review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CH-Rail-SDL-Render-${{ github.run_id }}
          path: |
            out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
            out/rail-sdl-capture/rail_sdl_review_preview.png
            out/rail-sdl-capture/sprite_alpha_audit.json
            out/rail-sdl-capture/rail_sdl_matte_source_frame_12.png
            out/rail-sdl-capture/rail_sdl_matte_source_frame_36.png
            assets/vehicles/steam_train_coach_01/steam_train_coach_north.png
          if-no-files-found: warn
          retention-days: 30

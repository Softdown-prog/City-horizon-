name: CH Rail SDL Actual Render Validation

on:
  pull_request:
    paths:
      - "src/rail_sdl_render_capture.cpp"
      - "src/rail_train_sprite_render_adapter.h"
      - "src/rail_turntable_sprite_runtime.h"
      - "tools/rail_visual_proof/audit_steam_train_alpha.py"
      - "CMakeLists.txt"
      - ".github/workflows/ch-rail-sdl-render-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/rail_sdl_render_capture.cpp"
      - "src/rail_train_sprite_render_adapter.h"
      - "src/rail_turntable_sprite_runtime.h"
      - "tools/rail_visual_proof/audit_steam_train_alpha.py"
      - "CMakeLists.txt"
      - ".github/workflows/ch-rail-sdl-render-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-sdl-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-rendered-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, xvfb, SDL desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libxtst-dev
      - name: Configure and compile real SDL visual harness
        run: |
          cmake -S . -B build/rail-sdl-review -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/rail-sdl-review --target rail_sdl_render_capture --parallel 2
      - name: Validate 104 Blender PNGs and runtime integration
        run: |
          python3 tools/rail_visual_proof/check_turntable_runtime_assets.py
          python3 tools/rail_visual_proof/check_runtime_consist_integration.py
      - name: Inspect alpha in approved source sprites
        run: |
          python3 -m pip install pillow
          python3 tools/rail_visual_proof/audit_steam_train_alpha.py
      - name: Record uninterrupted SDL locomotive and seven-coach operational timeline
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p out/rail-sdl-capture
          build/rail-sdl-review/rail_sdl_render_capture out/rail-sdl-capture
          test "$(find out/rail-sdl-capture -name 'frame_*.png' | wc -l)" -ge 60
          test -s out/rail-sdl-capture/chronology.csv
      - name: Validate continuous chronology and all six phases
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, math
          from pathlib import Path
          rows=list(csv.DictReader(Path("out/rail-sdl-capture/chronology.csv").open()))
          files=sorted(Path("out/rail-sdl-capture").glob("frame_*.png"))
          assert len(rows)==len(files) and len(rows)>=60
          assert [int(r["frame"]) for r in rows]==list(range(len(rows)))
          assert {int(r["phase"]) for r in rows}==set(range(6))
          for a,b in zip(rows,rows[1:]):
              assert abs(float(b["simulation_seconds"])-float(a["simulation_seconds"])-.5)<1e-7
              assert math.hypot(float(b["locomotive_x"])-float(a["locomotive_x"]),
                                float(b["locomotive_y"])-float(a["locomotive_y"]))<=4.3
          turn=[r for r in rows if int(r["phase"])==3]
          assert len(turn)>2
          assert float(turn[0]["turn_radians"]) <= float(turn[-1]["turn_radians"])
          assert int(rows[-1]["phase"])==5 and rows[-1]["coupled"] in ("1","true")
          print("CONTINUOUS RAIL SDL V2: PASS no frame jumps, all phase transitions")
          PY

      - name: Encode full physically continuous rail SDL MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 12 \
            -i out/rail-sdl-capture/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 21 \
            out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
          test -s out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
          cp out/rail-sdl-capture/frame_0050.png out/rail-sdl-capture/rail_sdl_review_preview.png
      - name: Detect opaque black texture mattes in SDL recording
        shell: bash
        run: |
          set -euo pipefail
          for second in 2 26; do
            ffmpeg -hide_banner -loglevel error -y -ss "$second" \
              -i out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4 \
              -frames:v 1 "out/rail-sdl-capture/matte_check_${second}.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path("out/rail-sdl-capture").glob("matte_check_*.png")):
              image=Image.open(path).convert("RGB")
              # A legitimate wheel/rail shadow is not an opaque 24x24 square.
              # Ignore the dark 52px text header; examine image content only.
              for y in range(65,image.height-25,12):
                  for x in range(0,image.width-25,12):
                      patch=image.crop((x,y,x+24,y+24))
                      opaque=sum(1 for r,g,b in patch.getdata()
                                 if max(r,g,b)<22)
                      if opaque>=540:
                          raise AssertionError(
                              f"SDL_OPAQUE_MATTE at {path.name} ({x},{y})")
              print("NO_OPAQUE_MATTE:",path.name)
          PY

      - name: Upload MP4, SDL screenshot and production review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CH-Rail-SDL-Render-${{ github.run_id }}
          path: |
            out/rail-sdl-capture/rail_sdl_actual_renderer_review.mp4
            out/rail-sdl-capture/rail_sdl_review_preview.png
            out/rail-sdl-capture/sprite_alpha_audit.json
            out/rail-sdl-capture/chronology.csv
            out/rail-sdl-capture/matte_check_*.png
            assets/vehicles/steam_train_coach_01/steam_train_coach_north.png
          if-no-files-found: warn
          retention-days: 30

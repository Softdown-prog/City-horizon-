name: Weather audio focused tests (one shot)

on:
  push:
    paths:
      - .github/workflows/weather-audio-focused-test-once.yml

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev
      - name: Configure focused test build
        run: cmake -S . -B build-weather-audio -DBUILD_TESTING=ON -DCH_VISITOR_FORGE_PREVIEW=OFF
      - name: Build weather and audio tests only
        run: cmake --build build-weather-audio --target weather_system_test audio_manager_test -j2
      - name: Run weather test
        run: ./build-weather-audio/weather_system_test
      - name: Run audio test with dummy driver
        # This intentionally leaves the eight ordinary effect tracks saturated;
        # thunder must succeed through its dedicated priority track.
        env:
          SDL_AUDIO_DRIVER: dummy
        run: ./build-weather-audio/audio_manager_test assets/audio

name: CH Carousel City Horizon Promote

on:
  push:
    paths:
      - 'tools/runtime_promotion_requests/carousel_city_horizon_v1.request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout City Horizon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image promotion dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download validated CH Blender carousel batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out/carousel_city_horizon_promotion
          mkdir -p out/carousel_city_horizon_promotion
          gh run download 37226554691 \
            --repo Softdown-prog/Ch_blender \
            --name CH-Blender-Windows-37226554691-1 \
            --dir out/carousel_city_horizon_promotion
          test -n "$(find out/carousel_city_horizon_promotion -name animation_manifest.json -print -quit)"
          test -n "$(find out/carousel_city_horizon_promotion -name primary_mask_manifest.json -print -quit)"

      - name: Promote animation and primary masks
        run: python tools/runtime_promotion_requests/promote_carousel_city_horizon_v1.py

      - name: Validate promoted runtime assets
        run: |
          set -euo pipefail
          base='assets/city_park/carousel/attraction.park_carousel_city_horizon.01'
          for d in south east west north; do
            test -s "${base}_${d}_animation.png"
            test -s "${base}_${d}_primary_mask.png"
          done
          test -s "${base}_runtime_manifest.json"
          test -s assets/definitions/carousel_city_horizon_01.json
          python -m json.tool "${base}_runtime_manifest.json" >/dev/null
          python -m json.tool assets/definitions/carousel_city_horizon_01.json >/dev/null

      - name: Commit carousel runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/city_park/carousel assets/definitions/carousel_city_horizon_01.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Carousel runtime assets already up to date.'
            exit 0
          fi
          git commit -m 'assets(carousel): promote animation and primary color masks'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

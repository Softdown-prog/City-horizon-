name: MapForge Capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "C++/MapForge2/examples/map_capture/**"
      - "C++/MapForge2/src/**"
      - "C++/MapForge2/CMakeLists.txt"
      - "tools/map_forge/**"
      - ".github/workflows/mapforge-capture.yml"

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read capture request
        shell: pwsh
        run: |
          $request = Get-Content "C++/MapForge2/examples/map_capture/capture_request.json" -Raw | ConvertFrom-Json
          if ($request.contract -ne "MAPFORGE_CAPTURE_REQUEST_V1") { throw "Unsupported capture request contract" }
          "SOURCE_WORKFLOW=$($request.source.workflow)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_ARTIFACT=$($request.source.artifact)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_FILE=$($request.source.file)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_REPO_FILE=$($request.source.repositoryFile)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_FRAME_INDEX=$($request.source.frameIndex)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_FRAME_WIDTH=$($request.source.frameWidth)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_FRAME_HEIGHT=$($request.source.frameHeight)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall pillow
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          "C:/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve requested asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path out/source_artifact | Out-Null

          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_REPO_FILE)) {
            if (-not (Test-Path $env:SOURCE_REPO_FILE)) { throw "Requested repository PNG was not found: $env:SOURCE_REPO_FILE" }
            $candidate = (Resolve-Path $env:SOURCE_REPO_FILE).Path
          } else {
            $runs = gh run list --workflow $env:SOURCE_WORKFLOW --branch main --status success --limit 1 --json databaseId | ConvertFrom-Json
            if ($null -eq $runs -or $runs.Count -lt 1) { throw "No successful source workflow run found" }
            $runId = $runs[0].databaseId
            gh run download $runId --name $env:SOURCE_ARTIFACT --dir out/source_artifact
            $found = Get-ChildItem out/source_artifact -Recurse -File | Where-Object { $_.Name -eq $env:SOURCE_FILE } | Select-Object -First 1
            if ($null -eq $found) { throw "Requested candidate PNG was not found" }
            $candidate = $found.FullName
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_FRAME_WIDTH) -and -not [string]::IsNullOrWhiteSpace($env:SOURCE_FRAME_HEIGHT)) {
            $frameIndex = 0
            if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_FRAME_INDEX)) { $frameIndex = [int]$env:SOURCE_FRAME_INDEX }
            $frameWidth = [int]$env:SOURCE_FRAME_WIDTH
            $frameHeight = [int]$env:SOURCE_FRAME_HEIGHT
            $cropped = (Resolve-Path out/source_artifact).Path + "\candidate_frame.png"
            python -c "from PIL import Image; import sys; src,dst,idx,fw,fh=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]),int(sys.argv[5]); im=Image.open(src).convert('RGBA'); cols=im.width//fw; x=(idx%cols)*fw; y=(idx//cols)*fh; im.crop((x,y,x+fw,y+fh)).save(dst)" $candidate $cropped $frameIndex $frameWidth $frameHeight
            $candidate = $cropped
          }

          "CANDIDATE_PNG=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure capture worker
        shell: pwsh
        run: cmake -S "C++/MapForge2" -B build/mapforge-capture -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build capture worker
        shell: pwsh
        run: cmake --build build/mapforge-capture --config Release --target MapForge2MapCapture --parallel

      - name: Render capture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/mapforge_capture | Out-Null
          & "build/mapforge-capture/Release/MapForge2MapCapture.exe" "out/mapforge_capture/mapforge_asset_capture.png" "$env:CANDIDATE_PNG" "C++/MapForge2/examples/map_capture/capture_request.json"
          if ($LASTEXITCODE -ne 0) { throw "MapForge2MapCapture failed" }
          if (-not (Test-Path "out/mapforge_capture/mapforge_asset_capture.png")) { throw "Capture PNG missing" }

      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: MapForge2-Deterministic-Asset-Capture
          path: out/mapforge_capture/mapforge_asset_capture.png
          if-no-files-found: error
          retention-days: 14

name: CH Procedural Road Priority Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ch-procedural-road-priority-check.yml"
      - "src/procedural_road_priority_control_test.cpp"
      - "src/procedural_road_class_test.cpp"
      - "src/procedural_road_construction_test.cpp"
      - "src/procedural_road_placement_bridge_test.cpp"
      - "src/procedural_road_class.h"
      - "src/procedural_road_class_policy.h"
      - "src/procedural_road_classified_route.h"
      - "src/procedural_road_construction.h"
      - "src/procedural_road_placement_bridge.h"
      - "src/procedural_road_traffic.h"
      - "src/procedural_road_vehicle_follower.h"
      - "src/procedural_road_vehicle_render_adapter.h"
      - "src/procedural_road_route_sampler.h"
      - "src/procedural_road_lane_connector.h"
      - "src/procedural_road_navigation.h"
      - "src/road_system.h"
      - "src/mobile_entity.h"
      - "docs/CH_PROCEDURAL_ROAD_PRIORITY_CONTROL_V1.md"
      - "docs/CH_PROCEDURAL_ROAD_CLASS_V1.md"
      - "docs/CH_PROCEDURAL_ROAD_CONSTRUCTION_V1.md"
      - "docs/CH_PROCEDURAL_ROAD_PLACEMENT_BRIDGE_V1.md"

jobs:
  priority-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile focused priority traffic gate
        run: >-
          g++ -std=c++20 -O0 -g -Isrc
          src/procedural_road_priority_control_test.cpp
          -o procedural_road_priority_control_test

      - name: Run focused priority traffic gate
        run: ./procedural_road_priority_control_test

      - name: Compile focused road class gate
        run: >-
          g++ -std=c++20 -O0 -g -Isrc
          src/procedural_road_class_test.cpp
          -o procedural_road_class_test

      - name: Run focused road class gate
        run: ./procedural_road_class_test

      - name: Compile focused road construction gate
        run: >-
          g++ -std=c++20 -O0 -g -Isrc
          src/procedural_road_construction_test.cpp
          -o procedural_road_construction_test

      - name: Run focused road construction gate
        run: ./procedural_road_construction_test

      - name: Compile focused placement bridge gate
        run: >-
          g++ -std=c++20 -O0 -g -Isrc
          src/procedural_road_placement_bridge_test.cpp
          -o procedural_road_placement_bridge_test

      - name: Run focused placement bridge gate
        run: ./procedural_road_placement_bridge_test

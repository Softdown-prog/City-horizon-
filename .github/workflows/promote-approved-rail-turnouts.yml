name: Promote Approved Rail Turnouts

on:
  push:
    paths:
      - '.github/workflows/promote-approved-rail-turnouts.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --upgrade pillow

      - name: Download approved bake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rail-turnouts
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11288884463/zip" \
            --output /tmp/rail-turnouts.zip
          unzip -q /tmp/rail-turnouts.zip -d /tmp/rail-turnouts

      - name: Promote approved turnouts into runtime
        run: |
          python tools/ch_blender/promote_approved_rail_turnouts_runtime.py \
            --artifact-dir /tmp/rail-turnouts \
            --repo .

      - name: Validate promoted assets
        run: |
          set -euo pipefail
          test "$(find assets/rail/classic/turnouts -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          python -m json.tool assets/rail/classic/turnouts/manifest.json >/dev/null

      - name: Compile City Horizon runtime
        run: |
          set -euo pipefail
          cmake -S . -B build/rail-turnout-promote -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/rail-turnout-promote --target city_builder --parallel 2

      - name: Publish promoted runtime assets
        run: |
          set -euo pipefail
          git config user.name "city-horizon-rail-promoter"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/promote-approved-rail-turnouts.yml
          git rm tools/ch_blender/promote_approved_rail_turnouts_runtime.py
          git add assets/rail/classic/turnouts \
                  src/rail_path_builder.h \
                  src/rail_placement_graph.h \
                  src/rail_placement_controller.h \
                  src/rail_runtime_bridge.h
          git commit -m "rail: promote approved turnout sprites to runtime"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

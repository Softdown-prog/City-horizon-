name: Apply procedural loading migration once

on:
  push:
    paths:
      - '.github/ui-procedural-loading-trigger'

permissions:
  contents: write

jobs:
  patch-procedural-loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_procedural_loading_patch.py
      - name: Validate focused changes
        run: |
          git diff --check
          grep -q 'void render_loading_screen(SDL_Renderer\* renderer, const int viewport_width' src/main.cpp
          grep -q 'show_loading(0.30F, "CARREGANDO TERRENO, RUAS E CAMINHOS")' src/main.cpp
          grep -q 'show_loading(1.0F, "PRONTO")' src/main.cpp
          ! grep -q 'city_horizon_loading.png' src/main.cpp
          ! grep -q 'kLoadingScreenMinimumMs' src/main.cpp
          ! grep -q 'loading_ui_sheet' src/main.cpp
      - name: Commit focused migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'Replace loading artwork with procedural progress UI'
          git push origin HEAD:main

name: Map Forge 2 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - map-forge-2-cpp
    paths:
      - 'C++/**'
      - 'src/ch_core/projection.*'
      - 'src/ch_core/map_document.*'
      - '.github/workflows/mapforge2-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure Map Forge 2
        shell: pwsh
        run: cmake -S "C++/MapForge2" -B build/mapforge2 -G "Visual Studio 17 2022" -A x64

      - name: Build Map Forge 2
        shell: pwsh
        run: cmake --build build/mapforge2 --config Release --target MapForge2 --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MapForge2 | Out-Null
          Copy-Item build/mapforge2/Release/MapForge2.exe dist/MapForge2/MapForge2.exe
          windeployqt --release --no-translations --dir dist/MapForge2 dist/MapForge2/MapForge2.exe
          Copy-Item C++/README.md dist/MapForge2/README.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapForge2-Windows-x64
          path: dist/MapForge2
          if-no-files-found: error

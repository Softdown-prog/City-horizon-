name: Map Forge 2 Windows

on:
  push:
    branches:
      - map-forge-2-cpp
      - studio-foundation-v1
      - studio-canonical-viewport-v1
      - studio-production-workbench-v1
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          "C:/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Map Forge 2
        shell: pwsh
        run: cmake -S "C++/MapForge2" -B build/mapforge2 -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build Map Forge 2
        shell: pwsh
        run: cmake --build build/mapforge2 --config Release --target MapForge2 --parallel

      - name: Deploy Studio runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MapForge2 | Out-Null
          Copy-Item build/mapforge2/Release/MapForge2.exe dist/MapForge2/MapForge2.exe

          $sdl = Get-ChildItem build/mapforge2 -Filter SDL3.dll -Recurse | Select-Object -First 1
          if ($null -eq $sdl) { throw "SDL3.dll was not produced by the Studio build." }
          Copy-Item $sdl.FullName dist/MapForge2/SDL3.dll

          C:/Qt/6.8.3/msvc2022_64/bin/windeployqt.exe --release --no-translations --dir dist/MapForge2 dist/MapForge2/MapForge2.exe

          Copy-Item "assets" -Destination "dist/MapForge2/assets" -Recurse
          Copy-Item "C++/README.md" dist/MapForge2/README.md
          Copy-Item "C++/MapForge2/CH_STUDIO_ARCHITECTURE_V1.md" dist/MapForge2/CH_STUDIO_ARCHITECTURE_V1.md
          Copy-Item "C++/MapForge2/CH_STUDIO_CANONICAL_VIEWPORT_V1.md" dist/MapForge2/CH_STUDIO_CANONICAL_VIEWPORT_V1.md
          Copy-Item "C++/MapForge2/CH_STUDIO_PRODUCTION_WORKBENCH_V1.md" dist/MapForge2/CH_STUDIO_PRODUCTION_WORKBENCH_V1.md
          New-Item -ItemType Directory -Force -Path dist/MapForge2/examples | Out-Null
          Copy-Item "C++/MapForge2/examples/content_packs/circus_validation_pack.json" dist/MapForge2/examples/circus_validation_pack.json
          Copy-Item "C++/MapForge2/examples/studio_project/city_horizon_production_profile.json" dist/MapForge2/examples/city_horizon_production_profile.json

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapForge2-Windows-x64
          path: dist/MapForge2
          if-no-files-found: error

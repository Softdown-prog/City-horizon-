name: Map Forge 2 Windows

on:
  push:
    branches:
      - main
    paths:
      - "C++/MapForge2/**"
      - "tools/map_forge/**"
      - "tools/visual_reference_gate.py"
      - "tools/carousel_production_gate.py"
      - "assets/**"
      - ".github/workflows/mapforge2-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m pip install pillow numpy pytest
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          "C:/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Map Forge 2
        shell: pwsh
        run: cmake -S "C++/MapForge2" -B build/mapforge2 -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build Map Forge 2
        shell: pwsh
        run: cmake --build build/mapforge2 --config Release --target MapForge2 MapForge2ComposerPreview MapForge2AnimationPreview MapForge2AssetDocumentGate --parallel

      - name: Deploy Studio runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MapForge2 | Out-Null
          Copy-Item build/mapforge2/Release/MapForge2.exe dist/MapForge2/MapForge2.exe

          $sdl = Get-ChildItem build/mapforge2 -Filter SDL3.dll -Recurse | Select-Object -First 1
          if ($null -eq $sdl) { throw "SDL3.dll was not produced by the Studio build." }
          Copy-Item $sdl.FullName dist/MapForge2/SDL3.dll

          C:/Qt/6.8.3/msvc2022_64/bin/windeployqt.exe --release --no-translations --dir dist/MapForge2 dist/MapForge2/MapForge2.exe

          Copy-Item "assets" -Destination "dist/MapForge2/assets" -Recurse
          Copy-Item "C++/README.md" dist/MapForge2/README.md
          Copy-Item "C++/MapForge2/CH_STUDIO_ARCHITECTURE_V1.md" dist/MapForge2/CH_STUDIO_ARCHITECTURE_V1.md
          Copy-Item "C++/MapForge2/CH_STUDIO_CANONICAL_VIEWPORT_V1.md" dist/MapForge2/CH_STUDIO_CANONICAL_VIEWPORT_V1.md
          Copy-Item "C++/MapForge2/CH_STUDIO_PRODUCTION_WORKBENCH_V1.md" dist/MapForge2/CH_STUDIO_PRODUCTION_WORKBENCH_V1.md
          Copy-Item "C++/MapForge2/CH_BUILDING_COMPOSER_V0.md" dist/MapForge2/CH_BUILDING_COMPOSER_V0.md
          Copy-Item "C++/MapForge2/CH_CLASSIC_TYCOON_STYLE_V1.md" dist/MapForge2/CH_CLASSIC_TYCOON_STYLE_V1.md
          Copy-Item "C++/MapForge2/CH_ASSET_EDITOR_FOUNDATION_V1.md" dist/MapForge2/CH_ASSET_EDITOR_FOUNDATION_V1.md
          New-Item -ItemType Directory -Force -Path dist/MapForge2/examples | Out-Null
          Copy-Item "C++/MapForge2/examples/content_packs/circus_validation_pack.json" dist/MapForge2/examples/circus_validation_pack.json
          Copy-Item "C++/MapForge2/examples/studio_project/city_horizon_production_profile.json" dist/MapForge2/examples/city_horizon_production_profile.json

      - name: Validate deterministic AssetDocument foundation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MapForge2/asset_document_tests | Out-Null
          build/mapforge2/Release/MapForge2AssetDocumentGate.exe dist/MapForge2/asset_document_tests
          if (-not (Test-Path dist/MapForge2/asset_document_tests/foundation_sample.chasset)) { throw "Deterministic .chasset round-trip fixture was not generated." }
          if (-not (Test-Path dist/MapForge2/asset_document_tests/asset_document_gate.json)) { throw "AssetDocument foundation gate report was not generated." }
          $report = Get-Content dist/MapForge2/asset_document_tests/asset_document_gate.json -Raw | ConvertFrom-Json
          if (-not $report.pass) { throw "AssetDocument deterministic persistence/history gate failed." }

      - name: Generate Building Composer visual gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MapForge2/visual_tests | Out-Null
          $env:QT_QPA_PLATFORM="offscreen"
          build/mapforge2/Release/MapForge2ComposerPreview.exe dist/MapForge2/visual_tests
          if (-not (Test-Path dist/MapForge2/visual_tests/building_composer_pilot_review.png)) { throw "Building Composer review image was not generated." }
          if (-not (Test-Path dist/MapForge2/visual_tests/building_composer_pilot_4view.png)) { throw "Building Composer sprite sheet was not generated." }
          if (-not (Test-Path dist/MapForge2/visual_tests/building_composer_pilot_manifest.json)) { throw "Building Composer manifest was not generated." }

      - name: Visual reference gate (Building Composer MAE)
        shell: pwsh
        run: |
          python tools/visual_reference_gate.py `
            --candidate dist/MapForge2/visual_tests/building_composer_pilot_review.png `
            --golden    C++/MapForge2/examples/golden_building_composer_pilot_review.png `
            --diff-out  dist/MapForge2/visual_tests/visual_reference_diff.png `
            --report    dist/MapForge2/visual_tests/visual_reference_gate.json `
            --threshold 2.0

      - name: Generate Carousel Composer animation gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MapForge2/animation_tests | Out-Null
          $env:QT_QPA_PLATFORM="offscreen"
          build/mapforge2/Release/MapForge2AnimationPreview.exe dist/MapForge2/animation_tests

          $sheet = Get-ChildItem dist/MapForge2/animation_tests -Filter "*_spritesheet.png" | Select-Object -First 1
          $preview = Get-ChildItem dist/MapForge2/animation_tests -Filter "*_preview.png" | Select-Object -First 1
          $manifest = Get-ChildItem dist/MapForge2/animation_tests -Filter "*_manifest.json" | Select-Object -First 1
          $authoring = Get-ChildItem dist/MapForge2/animation_tests -Filter "*_authoring.json" | Select-Object -First 1

          if ($null -eq $sheet) { throw "Carousel Composer spritesheet was not generated." }
          if ($null -eq $preview) { throw "Carousel Composer preview image was not generated." }
          if ($null -eq $manifest) { throw "Carousel Composer runtime manifest was not generated." }
          if ($null -eq $authoring) { throw "Carousel Composer authoring manifest was not generated." }

      - name: Carousel gameplay-scale visual production gate
        shell: pwsh
        run: |
          python tools/carousel_production_gate.py --directory dist/MapForge2/animation_tests --bakery assets/buildings/bakery_01_lvl1.png
          if (-not (Test-Path dist/MapForge2/animation_tests/carousel_lod_gate.png)) { throw "Carousel LOD gate was not generated." }
          if (-not (Test-Path dist/MapForge2/animation_tests/carousel_frame_coherence_gate.png)) { throw "Carousel frame coherence gate was not generated." }
          if (-not (Test-Path dist/MapForge2/animation_tests/carousel_game_context_gate.png)) { throw "Carousel game context gate was not generated." }
          if (-not (Test-Path dist/MapForge2/animation_tests/carousel_production_gate.json)) { throw "Carousel production report was not generated." }
          if (-not (Test-Path dist/MapForge2/assets/amusement/carousel/classic/carousel_classic_01.png)) { throw "Carousel runtime fixture was not promoted into the distributable asset tree." }

      - name: DPI smoke gate (CH_STUDIO_CANONICAL_VIEWPORT_V1)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pip install --quiet PySide6
          python -m pytest tools/map_forge/tests/test_viewport_dpi_smoke.py -v --tb=short
        continue-on-error: false

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapForge2-Windows-x64
          path: dist/MapForge2
          if-no-files-found: error

      - name: Upload visual reference diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MapForge2-Visual-Reference-Diff
          path: dist/MapForge2/visual_tests/visual_reference_diff.png
          if-no-files-found: ignore
          retention-days: 7

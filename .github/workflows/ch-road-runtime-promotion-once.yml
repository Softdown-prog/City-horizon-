name: CH Road Runtime Promotion Once

on:
  push:
    branches:
      - main
    paths:
      - tools/promote_procedural_road_runtime.py

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production runtime road path
        run: python tools/promote_procedural_road_runtime.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'runtime_procedural_road_renderer.h' src/runtime_map_renderer.h
          grep -q 'try_render_procedural_roads_runtime' src/runtime_map_renderer.h
          grep -q 'Build City Horizon runtime with procedural 2D roads' .github/workflows/ch-procedural-road-proof.yml

      - name: Commit promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime_map_renderer.h .github/workflows/ch-procedural-road-proof.yml
          if git diff --cached --quiet; then
            echo 'Runtime promotion already applied.'
            exit 0
          fi
          git commit -m 'Roads: promote procedural 2D renderer to game runtime'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Implement Building Color Mask Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-building-color-mask-runtime.yml"

permissions:
  contents: write

env:
  CH_COLOR_MASK_MIGRATION_REVISION: "2"

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: git pull --ff-only origin main

      - name: Patch canonical runtime
        shell: bash
        run: python tools/migrations/implement_building_color_mask_runtime.py

      - name: Commit runtime foundation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/implement-building-color-mask-runtime.yml
          rm tools/migrations/implement_building_color_mask_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/building_system.h src/building_system.cpp src/main.cpp src/save_manager.cpp assets/buildings/bakery/bakery.json .github/workflows/implement-building-color-mask-runtime.yml tools/migrations/implement_building_color_mask_runtime.py
          git commit -m "runtime: add CH color mask tinting foundation"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

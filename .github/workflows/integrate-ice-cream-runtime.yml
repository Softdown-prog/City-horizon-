name: Integrate Ice Cream Shop Runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-ice-cream-runtime.yml
      - tools/ch_blender/runtime_integrations/building.ice_cream_shop.01.json
      - tools/ch_blender/integrate_ice_cream_runtime.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Download approved final bakes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out/ice_runtime/static out/ice_runtime/activity
          gh run download 35938008873 -n CH-Blender-Agent-35938008873-1 -D out/ice_runtime/static
          gh run download 35938018823 -n CH-Blender-Agent-35938018823-1 -D out/ice_runtime/activity

      - name: Canonical post-process static building
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/postprocess.py \
            --input out/ice_runtime/static/building.ice_cream_shop.01.final \
            --output out/ice_runtime/static_final \
            --studio-preset tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json

      - name: Package assets and wire runtime
        run: python tools/ch_blender/integrate_ice_cream_runtime.py

      - name: Commit integration directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/buildings/ice_cream_shop assets/definitions/ice_cream_shop_01.json src/main.cpp
          if git diff --cached --quiet; then
            echo 'Ice cream shop runtime integration already present.'
            exit 0
          fi
          git commit -m 'runtime: integrate ice cream shop and activity overlay'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

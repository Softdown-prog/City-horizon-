name: Promote Viking Ship Runtime

on:
  push:
    branches:
      - main
    paths:
      - "tools/ch_blender/runtime_promotions/viking_ship_01.json"
      - "tools/ch_blender/runtime_promotions/park_carousel_01.json"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ','), 'tools/ch_blender/runtime_promotions/viking_ship_01.json') || contains(join(github.event.commits.*.added, ','), 'tools/ch_blender/runtime_promotions/viking_ship_01.json')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download approved static rotation artifact
        uses: actions/download-artifact@v4
        with:
          name: CH-Blender-Agent-36347551550-1
          path: ${{ runner.temp }}/viking_ship_runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36347551550

      - name: Promote four static rotations into City Park runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/viking_ship_runtime/attraction.park_viking_ship.rebuild.v13_four_rotations_1k"
          dst="assets/city_park/viking_ship"
          mkdir -p "$dst"

          cp "$src/proxy_south.png" "$dst/attraction.park_viking_ship.01_south.png"
          cp "$src/proxy_east.png"  "$dst/attraction.park_viking_ship.01_east.png"
          cp "$src/proxy_west.png"  "$dst/attraction.park_viking_ship.01_west.png"
          cp "$src/proxy_north.png" "$dst/attraction.park_viking_ship.01_north.png"

          echo "a7ed11db4d928119de739fb09d8d2b6e30c66025a373a4b8bb74004989a72de2  $dst/attraction.park_viking_ship.01_south.png" | sha256sum -c -
          echo "231298f03293ac63bf492d3a66b309d71fb0b37089716b8ea731fb45853177a1  $dst/attraction.park_viking_ship.01_east.png"  | sha256sum -c -
          echo "0957d50220fd990590f5e51595a0dde396f72d99386b373f81f219e667ef00e4  $dst/attraction.park_viking_ship.01_west.png"  | sha256sum -c -
          echo "41df15c7e69fb8d16768a5d7ffd720d4434ec5318868e99e38fa9a43742f1aaf  $dst/attraction.park_viking_ship.01_north.png" | sha256sum -c -

      - name: Commit runtime sprites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city_park/viking_ship/*.png
          if git diff --cached --quiet; then
            echo "Runtime Viking sprites already promoted."
            exit 0
          fi
          git commit -m "assets: promote Viking ship four static runtime rotations"
          git push


  promote-carousel-idle:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ','), 'tools/ch_blender/runtime_promotions/park_carousel_01.json') || contains(join(github.event.commits.*.added, ','), 'tools/ch_blender/runtime_promotions/park_carousel_01.json')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Read carousel promotion request
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("tools/ch_blender/runtime_promotions/park_carousel_01.json").read_text(encoding="utf-8"))
          assert d["contract"]=="CH_RUNTIME_ASSET_PROMOTION_V1"
          assert d["assetId"]=="park_carousel_01"
          assert d["approved"] is True
          assert d["approvalScope"]=="idle_static_four_direction_runtime"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f'run_id={d["sourceWorkflowRun"]}\n')
              f.write(f'artifact_id={d["sourceArtifactId"]}\n')
              f.write(f'source_dir={d["sourceDir"]}\n')
          PY

      - name: Download approved carousel idle artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.promotion.outputs.run_id }}
          artifact-ids: ${{ steps.promotion.outputs.artifact_id }}
          path: ${{ runner.temp }}/carousel_runtime

      - name: Promote carousel static four-direction runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, shutil, os

          req=json.loads(Path("tools/ch_blender/runtime_promotions/park_carousel_01.json").read_text(encoding="utf-8"))
          root=Path(os.environ["RUNNER_TEMP"])/"carousel_runtime"
          candidates=list(root.rglob(req["sourceDir"]))
          if len(candidates)!=1:
              raise SystemExit(f"Expected one source dir {req['sourceDir']}, found {len(candidates)}")
          src=candidates[0]
          dst=Path("assets/city_park/carousel")
          dst.mkdir(parents=True,exist_ok=True)

          directions=("south","east","west","north")
          views={}
          widths=[]
          for direction in directions:
              source=src/f"idle_{direction}.png"
              target=dst/f"park_carousel_01_{direction}.png"
              if not source.is_file():
                  raise SystemExit(f"Missing {source}")
              digest=hashlib.sha256(source.read_bytes()).hexdigest()
              if digest!=req["sha256"][direction]:
                  raise SystemExit(f"{direction}: SHA mismatch {digest}")
              im=Image.open(source).convert("RGBA")
              if im.size!=(1280,1280):
                  raise SystemExit(f"{direction}: expected 1280x1280, got {im.size}")
              alpha=im.getchannel("A")
              bbox=alpha.getbbox()
              if not bbox:
                  raise SystemExit(f"{direction}: empty alpha")
              for xy in ((0,0),(1279,0),(0,1279),(1279,1279)):
                  if alpha.getpixel(xy)!=0:
                      raise SystemExit(f"{direction}: non-transparent corner")
              widths.append(bbox[2]-bbox[0])
              shutil.copy2(source,target)
              views[direction]={"file":target.name,"sha256":digest,"alphaBounds":list(bbox)}

          art_scale=round((((7+7)*64)*0.975)/max(widths),4)
          if not 0.75 <= art_scale <= 1.25:
              raise SystemExit(f"Unexpected artScale {art_scale}")

          manifest={
            "contract":"CH_CITY_PARK_STATIC_ASSET_V1",
            "assetId":"park_carousel_01",
            "displayName":"Carrossel",
            "category":"city_park",
            "subtype":"amusement_ride_idle",
            "format":"PNG_RGBA",
            "frameSize":[1280,1280],
            "transparentBackground":True,
            "directionOrder":list(directions),
            "footprint":{"widthTiles":7,"depthTiles":7},
            "runtimeRepresentation":"2D_RGBA_static_four_direction_sprite",
            "views":views,
            "sourceAuthoringAssetId":req["sourceAuthoringAssetId"],
            "sourceWorkflowRun":req["sourceWorkflowRun"],
            "sourceArtifactId":req["sourceArtifactId"],
            "sourceCommit":req["sourceCommit"],
            "approvedForRuntime":True,
            "approvalScope":req["approvalScope"],
            "status":"runtime_idle_four_direction",
            "note":"Static idle runtime promotion only; procedural V5 recipe remains draft/not-approved-exemplar."
          }
          (dst/"park_carousel_01_runtime_manifest.json").write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          definition={
            "id":"park_carousel_01",
            "name":"Carrossel",
            "category":"city_park",
            "texture":"assets/city_park/carousel/park_carousel_01_south.png",
            "sprites":{
              "0":"assets/city_park/carousel/park_carousel_01_south.png",
              "1":"assets/city_park/carousel/park_carousel_01_west.png",
              "2":"assets/city_park/carousel/park_carousel_01_north.png",
              "3":"assets/city_park/carousel/park_carousel_01_east.png"
            },
            "rotatable":True,
            "requiresRoadAccess":False,
            "requiresRoadOrPathAccess":False,
            "requiresTicketBooth":False,
            "grassOnly":True,
            "roadAccessMode":"any_perimeter",
            "accessPoints":[{"x":3,"y":6,"facing":"south"}],
            "footprint":{"width":7,"height":7},
            "occupancyFootprint":{"width":7,"height":7,"offsetX":0,"offsetY":0},
            "buildCost":18000,
            "maintenancePerMonth":0,
            "taxRevenuePerMonth":0,
            "powerConsumption":0,
            "needsEffect":{"fun":60},
            "artScale":art_scale,
            "playerBuildable":True,
            "productionStatus":"runtime_idle_four_direction_approved",
            "renderClass":"large_asset_1280",
            "runtimeManifest":"assets/city_park/carousel/park_carousel_01_runtime_manifest.json",
            "sourceWorkflowRun":req["sourceWorkflowRun"],
            "sourceAuthoringAssetId":req["sourceAuthoringAssetId"]
          }
          Path("assets/definitions/park_carousel_01.json").write_text(json.dumps(definition,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          refs=[definition["texture"],*definition["sprites"].values(),definition["runtimeManifest"]]
          missing=[p for p in refs if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"Missing runtime references: {missing}")
          print(f"Carousel runtime staged: artScale={art_scale}")
          PY

      - name: Commit carousel runtime sprites and definition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city_park/carousel assets/definitions/park_carousel_01.json
          if git diff --cached --quiet; then
            echo "Carousel runtime already promoted."
            exit 0
          fi
          git commit -m "assets: promote carousel V5 idle four-direction runtime"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Apply CH Color Mask V1

on:
  push:
    branches: [main]
    paths:
      - tools/ch_blender/migrations/apply_color_mask_v1.py
      - .github/workflows/apply-color-mask-v1.yml

permissions:
  contents: write

jobs:
  apply-color-mask-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded migration
        run: python tools/ch_blender/migrations/apply_color_mask_v1.py

      - name: Syntax and whitespace validation
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path('tools/tycoon_photo_studio/ch_color_mask.py'),
              Path('tools/tycoon_photo_studio/build_scene.py'),
              Path('tools/tycoon_photo_studio/postprocess.py'),
          ]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('CH_COLOR_MASK_V1_AST_OK')
          PY
          python -m json.tool tools/tycoon_photo_studio/contracts/ch_color_mask_v1.json >/dev/null
          git diff --check

      - name: Commit canonical pipeline integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tycoon_photo_studio/build_scene.py tools/tycoon_photo_studio/postprocess.py
          git rm --ignore-unmatch tools/ch_blender/migrations/apply_color_mask_v1.py
          git rm --ignore-unmatch .github/workflows/apply-color-mask-v1.yml
          git commit -m "blender: integrate CH_COLOR_MASK_V1 into canonical bake"
          git pull --rebase origin main
          git push origin main

# Focused visual gate for the procedural pine study.
name: Render Pine Tree Visitor Forge

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/visitor_forge_2d/examples/pine_tree_organic_v1.json'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/organic_scenery.py'
      - 'tools/visitor_forge_2d/tests/test_organic_scenery.py'
      - 'tools/visitor_forge_2d/docs/ORGANIC_SCENERY.md'
      - 'tools/visitor_forge_2d/pyproject.toml'
      - '.github/workflows/render-pine-tree-visitor-forge.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Visitor Forge 2D
        run: |
          python -m pip install -e tools/visitor_forge_2d
          python -m pip install pytest

      - name: Test organic scenery renderer
        run: python -m pytest -q tools/visitor_forge_2d/tests/test_organic_scenery.py

      - name: Render camera-aware organic pine
        run: |
          python -m visitor_forge_2d.core.organic_scenery \
            --recipe tools/visitor_forge_2d/examples/pine_tree_organic_v1.json \
            --output out/visitor_forge_2d/pine_tree_v1

      - name: Upload pine tree review
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Pine-Tree-Visitor-Forge-${{ github.run_number }}
          path: out/visitor_forge_2d/pine_tree_v1
          retention-days: 14
          if-no-files-found: error

name: CH MapForge Video Capture

# Deterministic CH Video Lab proof using the first-party MapForge renderer.
# The feature-branch terrain job is a focused visual proof for the shared
# CH_TERRAIN_HEIGHTFIELD_V1 gameplay/editor contract.
on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "CH_VIDEO_SCENARIO_V1 JSON path"
        required: true
        default: "tools/animation_preview/examples/mapforge_candidate_motion.json"
        type: string
  push:
    branches:
      - main
      - terrain-construction-gameplay
    paths:
      - "tools/animation_preview/mapforge_jobs/*.json"
      - ".github/workflows/ch-mapforge-video-capture.yml"
      - "C++/MapForge2/src/terrain_sculpt_gif_proof_main.cpp"
      - "src/ch_core/terrain_heightfield.cpp"
      - "src/ch_core/terrain_heightfield.h"
      - "src/ch_core/projection.cpp"
      - "src/ch_core/projection.h"

jobs:
  capture-windows:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve video job
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $jobPath = "${{ inputs.job_path }}"
          } else {
            $jobPath = git diff --name-only HEAD^ HEAD |
              Where-Object { $_ -like "tools/animation_preview/mapforge_jobs/*.json" } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($jobPath)) { throw "No MapForge video job found" }
          if (-not (Test-Path $jobPath)) { throw "MapForge video job does not exist: $jobPath" }
          "CH_VIDEO_JOB=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install media and Qt dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          "C:/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Configure MapForge capture renderer
        shell: pwsh
        run: cmake -S "C++/MapForge2" -B build/ch-mapforge-video -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build MapForge2CLI
        shell: pwsh
        run: cmake --build build/ch-mapforge-video --config Release --target MapForge2CLI --parallel

      - name: Validate Qt runtime for CLI
        shell: pwsh
        run: |
          $qtRoot = "C:/Qt/6.8.3/msvc2022_64"
          $release = "build/ch-mapforge-video/Release"
          if (-not (Test-Path "$qtRoot/bin/Qt6Core.dll")) { throw "Qt6Core.dll missing" }
          if (-not (Test-Path "$qtRoot/bin/Qt6Gui.dll")) { throw "Qt6Gui.dll missing" }
          if (-not (Test-Path "$qtRoot/plugins")) { throw "Qt plugins directory missing" }
          if (-not (Test-Path "$release/MapForge2CLI.exe")) { throw "MapForge2CLI.exe missing" }

      - name: Resolve deterministic scenario
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/ch-mapforge-video | Out-Null
          $job = Get-Content $env:CH_VIDEO_JOB -Raw | ConvertFrom-Json
          if ($job.contract -ne "CH_VIDEO_SCENARIO_V1") { throw "Unsupported video scenario contract" }

          $candidate = $job.mapforgeCandidateFile
          if ([string]::IsNullOrWhiteSpace($candidate)) { throw "MapForge scenario requires mapforgeCandidateFile" }
          if (-not (Test-Path $candidate)) { throw "Candidate PNG does not exist: $candidate" }

          $baseRequest = $job.mapforgeBaseRequestFile
          if ([string]::IsNullOrWhiteSpace($baseRequest)) {
            $baseRequest = "C++/MapForge2/examples/map_capture/capture_request.json"
          }
          if (-not (Test-Path $baseRequest)) { throw "Base capture request does not exist: $baseRequest" }

          $cli = (Resolve-Path "build/ch-mapforge-video/Release/MapForge2CLI.exe").Path
          $candidateRaw = (Resolve-Path $candidate).Path
          $normalizedCandidate = Join-Path (Resolve-Path "out/ch-mapforge-video").Path "candidate_normalized.png"
          $env:CH_VIDEO_RAW_CANDIDATE = $candidateRaw
          $env:CH_VIDEO_NORMALIZED_CANDIDATE = $normalizedCandidate
          python -c "import os; from PIL import Image; src=os.environ['CH_VIDEO_RAW_CANDIDATE']; dst=os.environ['CH_VIDEO_NORMALIZED_CANDIDATE']; im=Image.open(src).convert('RGBA'); im.save(dst, format='PNG', optimize=False)"
          if (-not (Test-Path $normalizedCandidate)) { throw "Normalized candidate PNG missing" }
          $candidate = (Resolve-Path $normalizedCandidate).Path
          $baseRequest = (Resolve-Path $baseRequest).Path
          $repoRoot = (Resolve-Path ".").Path
          $output = (Resolve-Path "out/ch-mapforge-video").Path

          $job | Add-Member -NotePropertyName baseRequestFile -NotePropertyValue $baseRequest -Force
          $job | Add-Member -NotePropertyName outputDir -NotePropertyValue $output -Force
          $job | Add-Member -NotePropertyName renderer -NotePropertyValue ([pscustomobject]@{
            cwd = $repoRoot
            command = @($cli, "capture", "{output}", $candidate, "{request}")
          }) -Force

          $resolved = "out/ch-mapforge-video-job-resolved.json"
          $job | ConvertTo-Json -Depth 32 | Set-Content -Path $resolved -Encoding utf8
          "CH_VIDEO_RESOLVED_JOB=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render frames and encode review media
        shell: pwsh
        env:
          QT_PLUGIN_PATH: C:/Qt/6.8.3/msvc2022_64/plugins
        run: python tools/animation_preview/run_video_scenario.py --scenario $env:CH_VIDEO_RESOLVED_JOB

      - name: Validate video proof
        shell: pwsh
        run: |
          $reportPath = "out/ch-mapforge-video/scenario_report.json"
          if (-not (Test-Path $reportPath)) { throw "Scenario report missing" }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if ($report.contract -ne "CH_VIDEO_SCENARIO_V1" -or $report.status -ne "ok") {
            throw "MapForge video scenario failed"
          }
          $videos = Get-ChildItem "out/ch-mapforge-video" -Filter *.mp4 -File -ErrorAction SilentlyContinue
          if ($null -eq $videos -or $videos.Count -lt 1) { throw "No MP4 proof was produced" }
          if ($report.frameCount -lt 2) { throw "Scenario produced too few frames" }

      - name: Upload CH Video Lab proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-MapForge-Video-Validation
          path: |
            out/ch-mapforge-video/**
            out/ch-mapforge-video-job-resolved.json
          if-no-files-found: error
          retention-days: 14

  terrain-gif-proof:
    if: github.ref == 'refs/heads/terrain-construction-gameplay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          cache: true

      - name: Install GIF dependency
        run: python3 -m pip install --upgrade pillow

      - name: Compile focused MapForge terrain proof
        shell: bash
        run: |
          mkdir -p build/terrain-gif-proof out/terrain-gif-proof/frames
          c++ -std=c++20 -O2 -fPIC \
            -I. \
            $(pkg-config --cflags Qt6Core Qt6Gui) \
            C++/MapForge2/src/terrain_sculpt_gif_proof_main.cpp \
            src/ch_core/terrain_heightfield.cpp \
            src/ch_core/projection.cpp \
            -o build/terrain-gif-proof/MapForge2TerrainSculptGifProof \
            $(pkg-config --libs Qt6Core Qt6Gui)

      - name: Render heightfield sculpt frames
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/terrain-gif-proof/MapForge2TerrainSculptGifProof out/terrain-gif-proof/frames

      - name: Encode animated GIF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('out/terrain-gif-proof')
          paths = sorted((root / 'frames').glob('frame_*.png'))
          if len(paths) != 36:
              raise SystemExit(f'Expected 36 frames, got {len(paths)}')
          frames = [Image.open(p).convert('RGBA') for p in paths]
          frames[0].save(root / 'mapforge_terrain_sculpt_test.gif', save_all=True,
                         append_images=frames[1:], duration=95, loop=0,
                         disposal=2, optimize=True)

          picks = [0, 11, 23, 35]
          sheet = Image.new('RGB', (960, 640), (24, 30, 27))
          for slot, idx in enumerate(picks):
              thumb = frames[idx].convert('RGB').resize((480, 320), Image.Resampling.LANCZOS)
              sheet.paste(thumb, ((slot % 2) * 480, (slot // 2) * 320))
          sheet.save(root / 'mapforge_terrain_sculpt_contact_sheet.png')
          frames[0].save(root / 'mapforge_terrain_sculpt_start.png')
          frames[-1].save(root / 'mapforge_terrain_sculpt_end.png')
          PY

      - name: Validate terrain proof
        run: |
          test -s out/terrain-gif-proof/mapforge_terrain_sculpt_test.gif
          test -s out/terrain-gif-proof/mapforge_terrain_sculpt_contact_sheet.png

      - name: Upload terrain GIF proof
        uses: actions/upload-artifact@v4
        with:
          name: MapForge2-Terrain-Sculpt-GIF-Proof
          path: |
            out/terrain-gif-proof/mapforge_terrain_sculpt_test.gif
            out/terrain-gif-proof/mapforge_terrain_sculpt_contact_sheet.png
            out/terrain-gif-proof/mapforge_terrain_sculpt_start.png
            out/terrain-gif-proof/mapforge_terrain_sculpt_end.png
          if-no-files-found: error
          retention-days: 14

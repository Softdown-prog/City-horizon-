name: Visitor Forge 2D Component Gallery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visitor-forge-2d-component-gallery.yml'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/component_gallery.py'
      - 'tools/visitor_forge_2d/examples/component_gallery/reusable_components_v1.json'
      - 'tools/visitor_forge_2d/tests/test_component_gallery.py'

permissions:
  contents: read

jobs:
  gallery-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e tools/visitor_forge_2d
          python -m pip install pytest
      - run: python -m pytest -q tools/visitor_forge_2d/tests/test_component_gallery.py

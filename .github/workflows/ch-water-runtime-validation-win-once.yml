name: CH Water Runtime Validation Windows Once

on:
  push:
    paths:
      - '.github/workflows/ch-water-runtime-validation-win-once.yml'

permissions:
  contents: read

jobs:
  build-water-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=OFF
      - name: Build water runtime pilot
        run: cmake --build build --target water_surface_pilot_runtime --config Release --parallel 2
      - name: Verify renderer contract wiring
        shell: pwsh
        run: |
          Select-String -Path src/ch_render/map_renderer.cpp -SimpleMatch 'water_runtime.frame_at_seconds(render_time)' -Quiet | ForEach-Object { if (-not $_) { exit 1 } }
          Select-String -Path src/ch_render/map_renderer.cpp -SimpleMatch 'water_runtime_texture(water_runtime, shallow_definition->base_asset_id' -Quiet | ForEach-Object { if (-not $_) { exit 1 } }
          Select-String -Path src/ch_render/map_renderer.cpp -SimpleMatch 'water_runtime_color(water_runtime, shallow_definition)' -Quiet | ForEach-Object { if (-not $_) { exit 1 } }

name: Promote Ferris Wheel Runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-ferris-wheel-runtime.yml"

permissions:
  actions: read
  contents: write

jobs:
  promote-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved CH Blender artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferris-artifact"
          gh run download 35722495875 \
            --repo "${{ github.repository }}" \
            --name "CH-Blender-Agent-35722495875-1" \
            --dir "$RUNNER_TEMP/ferris-artifact"

      - name: Promote runtime-only park asset
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ferris-artifact/attraction.park_ferris_wheel.final.v2/runtime"
          dst="assets/city_park/ferris_wheel"
          test -f "$src/attraction.park_ferris_wheel.01_runtime_manifest.json"
          test -f "$src/attraction.park_ferris_wheel.01_4dir_animation.png"
          mkdir -p "$dst"

          # Promote only the runtime package. Intermediate source renders,
          # review boards, shadow/color passes and the .blend stay out of assets/.
          cp "$src/attraction.park_ferris_wheel.01_4dir_animation.png" "$dst/"
          cp "$src/attraction.park_ferris_wheel.01_south_animation.png" "$dst/"
          cp "$src/attraction.park_ferris_wheel.01_east_animation.png" "$dst/"
          cp "$src/attraction.park_ferris_wheel.01_west_animation.png" "$dst/"
          cp "$src/attraction.park_ferris_wheel.01_north_animation.png" "$dst/"
          cp "$src/attraction.park_ferris_wheel.01_runtime_manifest.json" "$dst/"

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/city_park/ferris_wheel/attraction.park_ferris_wheel.01_runtime_manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["contract"] == "CH_ANIMATED_SPRITE_BAKE_V1"
          assert data["transparentCanvas"] is True
          assert data["backgroundIncluded"] is False
          assert data["directionOrder"] == ["south", "east", "west", "north"]
          assert data["frameCount"] == 12
          assert data["fps"] == 8
          assert data["frameResolution"] == [256, 256]
          assert data["approvedProxySha256"] == "ef53a3a04b7877c42e64c82d2d022ab7ece0f67af31db709528f020ca3e56a6b"
          PY

      - name: Commit promoted runtime to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city_park/ferris_wheel
          if git diff --cached --quiet; then
            echo "Ferris wheel runtime already promoted; nothing to commit."
            exit 0
          fi
          git commit -m "assets: add approved Ferris wheel runtime"

          # Keep the direct-main workflow fast-forward safe if another agent
          # advanced main while this short promotion job was running.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

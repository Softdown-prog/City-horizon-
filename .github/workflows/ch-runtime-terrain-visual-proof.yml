name: CH Runtime Terrain Visual Proof

on:
  workflow_dispatch:
  push:
    branches:
      - terrain-construction-gameplay
    paths:
      - ".github/workflows/ch-runtime-terrain-visual-proof.yml"
      - "tools/runtime_terrain_capture/**"
      - "tools/generate_dirt_slope_sprites.py"
      - "tools/render_dirt_slope_continuity_proof.py"
      - "src/runtime_terrain_renderer.h"
      - "src/ch_core/terrain_heightfield.*"
      - "src/ch_core/map_document.*"
      - "src/ch_render/map_renderer.*"

jobs:
  capture-runtime-terrain:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate pre-rendered dirt slope sprite pilot
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_dirt_slope_sprites.py --output-dir out/dirt-slope-pilot --contact-sheet out/dirt-slope-pilot-sheet.png --manifest out/dirt-slope-pilot-manifest.json
          python tools/render_dirt_slope_continuity_proof.py --generated-dir out/dirt-slope-pilot --output out/dirt-slope-continuity-proof.png

      - name: Upload pre-rendered dirt slope sprite pilot
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Dirt-Slope-Sprite-Pilot
          path: |
            out/dirt-slope-pilot/*.png
            out/dirt-slope-pilot-sheet.png
            out/dirt-slope-pilot-manifest.json
            out/dirt-slope-continuity-proof.png
          if-no-files-found: error
          retention-days: 14

      - name: Configure runtime terrain capture
        shell: pwsh
        run: cmake -S tools/runtime_terrain_capture -B build/runtime-terrain-capture -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF

      - name: Build runtime terrain capture
        shell: pwsh
        run: cmake --build build/runtime-terrain-capture --config Release --target ch_runtime_terrain_visual_capture --parallel

      - name: Stage SDL runtime dependency
        shell: pwsh
        run: |
          $exeDir = Resolve-Path "build/runtime-terrain-capture/Release"
          $sdl = Get-ChildItem -Path "build/runtime-terrain-capture" -Filter "SDL3.dll" -File -Recurse | Select-Object -First 1
          if ($null -eq $sdl) { throw "SDL3.dll was not produced by the capture build" }
          Copy-Item -Force $sdl.FullName (Join-Path $exeDir "SDL3.dll")
          Write-Host "Staged SDL3.dll from $($sdl.FullName)"

      - name: Render production runtime terrain path
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          New-Item -ItemType Directory -Force -Path out/runtime-terrain | Out-Null
          & "build/runtime-terrain-capture/Release/ch_runtime_terrain_visual_capture.exe" "$PWD" "out/runtime-terrain/runtime_terrain_proof.bmp"
          $captureExit = $LASTEXITCODE
          Write-Host "terrain capture exit code: $captureExit"
          if ($captureExit -ne 0) { throw "runtime terrain capture failed with exit code $captureExit" }
          if (-not (Test-Path "out/runtime-terrain/runtime_terrain_proof.bmp")) { throw "runtime terrain proof BMP was not created" }
          if ((Get-Item "out/runtime-terrain/runtime_terrain_proof.bmp").Length -le 10000) { throw "runtime terrain proof is unexpectedly small" }

      - name: Convert proof to PNG
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          from pathlib import Path
          src = Path("out/runtime-terrain/runtime_terrain_proof.bmp")
          dst = Path("out/runtime-terrain/runtime_terrain_proof.png")
          image = Image.open(src).convert("RGBA")
          image.save(dst, optimize=True)
          if dst.stat().st_size <= 10000:
              raise SystemExit("runtime terrain PNG is unexpectedly small")
          print(f"saved {dst} ({image.width}x{image.height})")
          '@ | python -

      - name: Upload runtime terrain proof
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Runtime-Terrain-Visual-Proof
          path: |
            out/runtime-terrain/runtime_terrain_proof.png
            out/runtime-terrain/runtime_terrain_proof.bmp
          if-no-files-found: error
          retention-days: 14

# Re-run marker: CH_PATH_SLOPE_SPRITE_V1 baked sprite runtime proof.

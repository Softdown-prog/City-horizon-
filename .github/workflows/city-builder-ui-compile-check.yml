name: City Builder Focused Compile Check

# Runtime compilation and deterministic UI visual proof intentionally run as
# separate jobs. UI screenshots must still be produced when an unrelated
# runtime system temporarily fails to compile on main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - terrain-construction-gameplay-v2
    paths:
      - "src/main.cpp"
      - "src/main_runtime_impl.cpp"
      - "src/runtime_video_capture.h"
      - "src/audio_manager.cpp"
      - "src/audio_manager.h"
      - "src/runtime_view_state.h"
      - "src/ch_core/projection.cpp"
      - "src/ch_core/projection.h"
      - "src/building_system.cpp"
      - "src/building_system.h"
      - "src/building_visit_runtime.h"
      - "src/navigation_network.cpp"
      - "src/navigation_network.h"
      - "src/navigation_network_test.cpp"
      - "src/park_fence_runtime.h"
      - "src/pedestrian_system.cpp"
      - "src/pedestrian_system.h"
      - "src/land_system.cpp"
      - "src/land_system.h"
      - "src/ui_manager.cpp"
      - "src/ui_manager.h"
      - "src/ui_manager_legacy_impl.inl"
      - "src/ui_modal_polish.inl"
      - "src/ui_modal_polish_base.inl"
      - "src/ui_build_panel_nine_slice.inl"
      - "src/ui_window_nine_slice.inl"
      - "src/ui_nine_slice.h"
      - "src/ui_visual_capture.cpp"
      - "src/ui_modal_visual_capture.cpp"
      - "src/terrain_relief_visual_proof.cpp"
      - "assets/ui/ui_asset_catalog.json"
      - "assets/ui/chrome/panel_window_9slice_v2.png"
      - "tools/ui_capture/**"
      - "tools/terrain_relief_capture/**"
      - "CMakeLists.txt"
      - ".github/workflows/city-builder-ui-compile-check.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure real City Builder
        shell: pwsh
        run: cmake -S . -B build/city-builder-check -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON -DCH_VISITOR_FORGE_PREVIEW=OFF

      - name: Build real City Builder
        shell: pwsh
        run: cmake --build build/city-builder-check --config Release --target city_builder --parallel

      - name: Build pedestrian navigation regression
        shell: pwsh
        run: cmake --build build/city-builder-check --config Release --target navigation_network_test --parallel

      - name: Run pedestrian navigation regression
        shell: pwsh
        run: ctest --test-dir build/city-builder-check -C Release -R "^navigation_network_test$" --output-on-failure

  ui-visual-proof:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure UI visual capture
        shell: pwsh
        run: cmake -S tools/ui_capture -B build/ui-capture-check -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF -DCH_VISITOR_FORGE_PREVIEW=OFF

      - name: Build catalog UI visual capture
        shell: pwsh
        run: cmake --build build/ui-capture-check --config Release --target city_builder_ui_capture --parallel

      - name: Build modal UI visual capture
        shell: pwsh
        run: cmake --build build/ui-capture-check --config Release --target city_builder_ui_modal_capture --parallel

      - name: Render UI visual proof
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          New-Item -ItemType Directory -Force -Path out/ui-capture | Out-Null
          & "build/ui-capture-check/Release/city_builder_ui_capture.exe" "out/ui-capture"
          if ($LASTEXITCODE -ne 0) { throw "city_builder_ui_capture failed" }

          & "build/ui-capture-check/Release/city_builder_ui_modal_capture.exe" "out/ui-capture"
          if ($LASTEXITCODE -ne 0) { throw "city_builder_ui_modal_capture failed" }

          $expected = @(
            "floor_catalog_idle.png",
            "floor_catalog_hover_sand.png",
            "floor_catalog_pressed_grass.png",
            "floor_catalog_selected_grass.png",
            "settings_idle.png",
            "settings_hover_apply.png",
            "settings_master_35.png",
            "settings_defaults.png",
            "modal_pause.png",
            "modal_settings.png",
            "modal_administration.png",
            "modal_reports.png",
            "modal_save_load.png",
            "modal_main_menu.png",
            "modal_quit_confirm.png"
          )
          foreach ($file in $expected) {
            $path = Join-Path "out/ui-capture" $file
            if (-not (Test-Path $path)) { throw "Missing UI capture: $file" }
            if ((Get-Item $path).Length -le 1024) { throw "UI capture is unexpectedly small: $file" }
          }

      - name: Upload UI visual proof
        uses: actions/upload-artifact@v4
        with:
          name: City-Builder-UI-Visual-Proof
          path: out/ui-capture/*.png
          if-no-files-found: error
          retention-days: 14

  terrain-relief-proof:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure terrain relief proof
        shell: pwsh
        run: cmake -S tools/terrain_relief_capture -B build/terrain-relief-proof -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF

      - name: Build terrain relief proof
        shell: pwsh
        run: cmake --build build/terrain-relief-proof --config Release --target terrain_relief_visual_proof --parallel

      - name: Render hill and basin proof
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          New-Item -ItemType Directory -Force -Path out/terrain-relief | Out-Null
          & "build/terrain-relief-proof/Release/terrain_relief_visual_proof.exe" "out/terrain-relief"
          if ($LASTEXITCODE -ne 0) { throw "terrain_relief_visual_proof failed" }
          foreach ($file in @("terrain_relief_flat.png", "terrain_relief_sculpted.png")) {
            $path = Join-Path "out/terrain-relief" $file
            if (-not (Test-Path $path)) { throw "Missing terrain proof: $file" }
            if ((Get-Item $path).Length -le 4096) { throw "Terrain proof is unexpectedly small: $file" }
          }

      - name: Upload terrain relief proof
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Terrain-Relief-Proof
          path: out/terrain-relief/*.png
          if-no-files-found: error
          retention-days: 14

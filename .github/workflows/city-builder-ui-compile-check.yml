name: City Builder Focused Compile Check

# Focused validation for runtime/UI changes before local test builds.
# Keep this path-scoped so ordinary art/content commits do not spend build minutes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/main.cpp"
      - "src/main_runtime_impl.cpp"
      - "src/audio_manager.cpp"
      - "src/audio_manager.h"
      - "src/runtime_view_state.h"
      - "src/ch_core/projection.cpp"
      - "src/ch_core/projection.h"
      - "src/building_system.cpp"
      - "src/building_system.h"
      - "src/ui_manager.cpp"
      - "src/ui_manager.h"
      - "src/ui_manager_legacy_impl.inl"
      - "CMakeLists.txt"
      - ".github/workflows/city-builder-ui-compile-check.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure City Builder
        shell: pwsh
        run: cmake -S . -B build/city-builder-check -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF

      - name: Build City Builder
        shell: pwsh
        run: cmake --build build/city-builder-check --config Release --target city_builder --parallel

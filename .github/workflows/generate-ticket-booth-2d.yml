name: Generate Visitor Forge 2D Ticket Booth

on:
  push:
    branches:
      - main
    paths:
      - "tools/visitor_forge_2d/**"
      - ".github/workflows/generate-ticket-booth-2d.yml"
  workflow_dispatch:

jobs:
  render-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Visitor Forge 2D
        run: python -m pip install --quiet -e tools/visitor_forge_2d

      - name: Generate SOUTH structure with Visitor Forge 2D
        run: |
          python -m visitor_forge_2d.structure.ticket_booth \
            --output out/visitor_forge_2d/ticket_booth

      - name: Validate Visitor Forge 2D structure package
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("out/visitor_forge_2d/ticket_booth")
          sprite = root / "park_ticket_booth_01_south.png"
          review = root / "park_ticket_booth_01_south_review.png"
          manifest_path = root / "park_ticket_booth_01_manifest.json"
          for path in (sprite, review, manifest_path):
              if not path.is_file():
                  raise SystemExit(f"missing expected output: {path}")

          image = Image.open(sprite).convert("RGBA")
          if image.size != (256, 256):
              raise SystemExit(f"unexpected sprite size: {image.size}")
          alpha = image.getchannel("A")
          if alpha.getbbox() is None or alpha.getextrema()[0] != 0:
              raise SystemExit("sprite must contain visible art on a transparent canvas")

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert data["contract"] == "CH_LAYERED_STRUCTURE_2D_V1"
          assert data["status"] == "south_visual_gate"
          assert data["generator"] == "tools/visitor_forge_2d"
          assert data["direction"] == "south"
          assert data["projection"] == "isometric_2_to_1"
          assert data["footprint"] == {"widthTiles": 2, "depthTiles": 2}
          assert data["groundIncluded"] is False
          assert data["runtimeApproved"] is False
          assert data["spriteSha256"] == hashlib.sha256(sprite.read_bytes()).hexdigest()

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visitor-Forge-2D-Ticket-Booth-${{ github.run_id }}
          path: out/visitor_forge_2d/ticket_booth
          if-no-files-found: error
          retention-days: 14

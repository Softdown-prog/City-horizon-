name: Pedestrian collision integration (one shot)

on:
  push:
    paths:
      - .github/workflows/pedestrian-collision-once.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward to current main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - name: Wire collision-aware pedestrian network
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main_runtime_impl.cpp')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ('#include "pedestrian_system.h"\n', '#include "pedestrian_system.h"\n#include "park_fence_runtime.h"\n'),
              ('const PedestrianSurfaceNavigationNetwork network{roads, sidewalks};',
               'const park_fence_runtime::PedestrianCollisionNavigationNetwork network{roads, sidewalks, buildings};'),
              ('const PedestrianSurfaceNavigationNetwork pedestrian_surfaces{roads, sidewalks};',
               'const park_fence_runtime::PedestrianCollisionNavigationNetwork pedestrian_surfaces{roads, sidewalks, buildings};'),
          ]
          for old, new in pairs:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'expected runtime pattern not found: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'PedestrianCollisionNavigationNetwork network{roads, sidewalks, buildings}' src/main_runtime_impl.cpp
          test "$(grep -c 'PedestrianCollisionNavigationNetwork pedestrian_surfaces{roads, sidewalks, buildings}' src/main_runtime_impl.cpp)" -ge 2
      - name: Commit runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main_runtime_impl.cpp
          git commit -m "feat(pedestrians): enforce fence and building collisions"
          git push origin main

name: CH Current Rides Correction Once

on:
  push:
    paths:
      - '.github/workflows/ch-current-rides-correction-once.yml'

permissions:
  contents: write

jobs:
  correct-current-rides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on latest main
        run: |
          git fetch origin main
          git checkout -B ch-current-rides-correction origin/main

      - name: Apply strict current-ride corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path_str: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path_str}: expected {expected} matches for {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('src/audio_manager.h', '    viking_ship_running,\n', '    pirate_ship_running,\n')
          replace_exact('src/audio_manager.cpp', '    "VikingShipRunning", "WeatherRain", "WeatherThunder",\n', '    "PirateShipRunning", "WeatherRain", "WeatherThunder",\n')
          replace_exact('assets/audio/audio_catalog.json', '    "VikingShipRunning": [\n', '    "PirateShipRunning": [\n')

          main_path = Path('src/main.cpp')
          main = main_path.read_text(encoding='utf-8')
          replacements = [
              ('// 19. Viking-ship rope creaks start only while the ride moves, with a small\n',
               '// 19. Pirate-ship rope creaks start only while the ride moves, with a small\n'),
              ('ch_viking_ship_sound_delay_ms', 'ch_pirate_ship_sound_delay_ms'),
              ('instance.definition_id != "viking_ship_01"', 'instance.definition_id != "pirate_ship_01"'),
              ('ChVikingShipAudioDelayState', 'ChPirateShipAudioDelayState'),
              ('viking_audio', 'pirate_audio'),
              ('viking_delay', 'pirate_delay'),
              ('SoundEvent::viking_ship_running', 'SoundEvent::pirate_ship_running'),
          ]
          for old, new in replacements:
              count = main.count(old)
              if count < 1:
                  raise SystemExit(f'src/main.cpp: missing expected token {old!r}')
              main = main.replace(old, new)
          main_path.write_text(main, encoding='utf-8')

          viking_path = Path('assets/definitions/viking_ship_01.json')
          viking = viking_path.read_text(encoding='utf-8')
          if viking.count('"playerBuildable": true') != 1:
              raise SystemExit('viking definition playerBuildable contract changed')
          if viking.count('"productionStatus": "runtime_static_four_direction_passenger_swing_proxy_pending_review"') != 1:
              raise SystemExit('viking definition productionStatus contract changed')
          viking = viking.replace('"playerBuildable": true', '"playerBuildable": false')
          viking = viking.replace(
              '"productionStatus": "runtime_static_four_direction_passenger_swing_proxy_pending_review"',
              '"productionStatus": "retired_legacy_not_current_attraction"')
          viking_path.write_text(viking, encoding='utf-8')

      - name: Verify correction scope
        run: |
          git diff --check
          git diff --name-only
          grep -q 'pirate_ship_running' src/audio_manager.h
          grep -q '"PirateShipRunning"' src/audio_manager.cpp
          grep -q '"PirateShipRunning"' assets/audio/audio_catalog.json
          grep -q 'instance.definition_id != "pirate_ship_01"' src/main.cpp
          grep -q '"playerBuildable": false' assets/definitions/viking_ship_01.json
          ! grep -q 'SoundEvent::viking_ship_running' src/main.cpp

      - name: Commit correction
        run: |
          git config user.name "City Horizon Worker"
          git config user.email "actions@users.noreply.github.com"
          git add src/audio_manager.h src/audio_manager.cpp src/main.cpp assets/audio/audio_catalog.json assets/definitions/viking_ship_01.json
          git commit -m "fix(rides): make pirate ship the active swinging attraction"
          git push origin HEAD:main

name: Fix bakery stock accounting once

on:
  push:
    paths:
      - '.github/workflows/fix-bakery-stock-accounting-once.yml'

permissions:
  contents: write

jobs:
  fix-bakery-stock-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Fix stock simulation and single consumption
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/economy_system.cpp')
          text = path.read_text(encoding='utf-8')

          old_summary = '''        ServicePricingEstimate service = service_pricing_estimate(*definition, instance, population.current_population());
        if (farming != nullptr && !definition->resource_inputs.empty() && definition->default_service_price <= 0) {
            const std::int64_t price = std::clamp('''
          new_summary = '''        ServicePricingEstimate service = service_pricing_estimate(*definition, instance, population.current_population());
        if (farming != nullptr && !definition->resource_inputs.empty()) {
            const std::int64_t price = std::clamp('''
          if old_summary not in text:
              raise SystemExit('expected stock-aware summary block not found')
          text = text.replace(old_summary, new_summary, 1)

          old_close = '''        if (expense != 0) {
            record(EconomyTransactionType::maintenance, -expense, closing_date, instance.instance_id);
        }
        if (farming != nullptr && !definition->resource_inputs.empty()) {
            bool supplied = true;'''
          new_close = '''        if (expense != 0) {
            record(EconomyTransactionType::maintenance, -expense, closing_date, instance.instance_id);
        }
        // Service-priced shops already consume their inputs according to actual
        // served customers above. Keep the legacy local-supply bonus path only
        // for non-service buildings so ingredients are never charged twice.
        if (farming != nullptr && !definition->resource_inputs.empty() && definition->default_service_price <= 0) {
            bool supplied = true;'''
          if old_close not in text:
              raise SystemExit('expected legacy local-supply block not found')
          text = text.replace(old_close, new_close, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-bakery-stock-accounting-once.yml').unlink()
          PY

      - name: Validate focused correction
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/economy_system.cpp').read_text(encoding='utf-8')
          summary = '''ServicePricingEstimate service = service_pricing_estimate(*definition, instance, population.current_population());
        if (farming != nullptr && !definition->resource_inputs.empty()) {'''
          close = '''if (farming != nullptr && !definition->resource_inputs.empty() && definition->default_service_price <= 0) {
            bool supplied = true;'''
          assert summary in text, 'bakery stock must participate in summary simulation'
          assert close in text, 'legacy local-supply path must exclude service-priced shops'
          assert text.count('definition->default_service_price <= 0') == 1, 'service exclusion belongs only to legacy local-supply path'
          PY
          g++ -std=c++20 -I. -Isrc -fsyntax-only src/economy_system.cpp
          test ! -e .github/workflows/fix-bakery-stock-accounting-once.yml

      - name: Commit to main
        run: |
          git config user.name 'OpenAI'
          git config user.email 'openai@users.noreply.github.com'
          git add src/economy_system.cpp .github/workflows/fix-bakery-stock-accounting-once.yml
          git commit -m 'Fix bakery ingredient stock accounting'
          git pull --rebase origin main
          git push origin main

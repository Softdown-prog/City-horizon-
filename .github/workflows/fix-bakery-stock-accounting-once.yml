name: Fix Bakery Stock Accounting

on:
  push:
    paths:
      - '.github/workflows/fix-bakery-stock-accounting-once.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply staged correction
        run: python3 tools/fix_bakery_stock_accounting.py

      - name: Validate focused correction
        run: |
          git diff --check
          python3 -c "from pathlib import Path; s=Path('src/economy_system.cpp').read_text(); assert s.count('definition->default_service_price <= 0') == 1"
          g++ -std=c++20 -I. -Isrc -fsyntax-only src/economy_system.cpp
          test ! -e tools/fix_bakery_stock_accounting.py
          test ! -e .github/workflows/fix-bakery-stock-accounting-once.yml

      - name: Commit correction
        run: |
          git config user.name 'OpenAI'
          git config user.email 'openai@users.noreply.github.com'
          git add src/economy_system.cpp tools/fix_bakery_stock_accounting.py .github/workflows/fix-bakery-stock-accounting-once.yml
          git commit -m 'Fix bakery ingredient stock accounting'
          git pull --rebase origin main
          git push origin main

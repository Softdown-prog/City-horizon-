name: CH Actor Clown HTML Export

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ch-character-studio-art-v0
    paths:
      - 'tools/ch_actor_lab/validated/ch_actor_validated_v1.js'
      - 'tools/ch_actor_lab/validated/ch_actor_runtime_directions_v1.js'
      - 'tools/ch_actor_lab/skins/clown_01_v1.js'
      - 'tools/ch_actor_lab/validated/clown_01.html'
      - 'tools/ch_actor_lab/validated/export_skin_runner.mjs'
      - '.github/workflows/ch-actor-clown-html-export.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ch_actor_http.log 2>&1 &
          echo $! >/tmp/ch_actor_http.pid
          sleep 2
      - name: Execute clown skin on validated CH Actor
        run: node tools/ch_actor_lab/validated/export_skin_runner.mjs out/ch_actor_clown_validated
      - name: Show execution report
        run: cat out/ch_actor_clown_validated/execution_report.json
      - name: Upload clown skin export
        uses: actions/upload-artifact@v4
        with:
          name: CH-Actor-Clown-HTML-${{ github.run_id }}
          path: out/ch_actor_clown_validated/
          if-no-files-found: error

name: Weather thunder priority integration (one shot)

on:
  push:
    paths:
      - .github/workflows/weather-thunder-priority-once.yml

permissions:
  contents: write

jobs:
  patch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward to current main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - name: Add dedicated thunder one-shot track
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          path = Path('src/audio_manager.cpp')
          text = path.read_text(encoding='utf-8')

          text = replace_once(text,
          '''    ambience_loop_track_ = MIX_CreateTrack(mixer_);\n    if (ambience_loop_track_ == nullptr) {\n        std::cerr << "Weather ambience audio track could not be created: " << SDL_GetError() << '\\n';\n    }\n\n    if (cached_audio_.empty() || tracks_.empty() || activity_loop_track_ == nullptr ||\n        ambience_loop_track_ == nullptr) {\n''',
          '''    ambience_loop_track_ = MIX_CreateTrack(mixer_);\n    if (ambience_loop_track_ == nullptr) {\n        std::cerr << "Weather ambience audio track could not be created: " << SDL_GetError() << '\\n';\n    }\n    weather_effect_track_ = MIX_CreateTrack(mixer_);\n    if (weather_effect_track_ == nullptr) {\n        std::cerr << "Weather one-shot audio track could not be created: " << SDL_GetError() << '\\n';\n    }\n\n    if (cached_audio_.empty() || tracks_.empty() || activity_loop_track_ == nullptr ||\n        ambience_loop_track_ == nullptr || weather_effect_track_ == nullptr) {\n''', 'track init')

          text = replace_once(text,
          '''    if (ambience_loop_track_ != nullptr) {\n        MIX_DestroyTrack(ambience_loop_track_);\n        ambience_loop_track_ = nullptr;\n    }\n    if (music_track_ != nullptr) {\n''',
          '''    if (ambience_loop_track_ != nullptr) {\n        MIX_DestroyTrack(ambience_loop_track_);\n        ambience_loop_track_ = nullptr;\n    }\n    if (weather_effect_track_ != nullptr) {\n        MIX_DestroyTrack(weather_effect_track_);\n        weather_effect_track_ = nullptr;\n    }\n    if (music_track_ != nullptr) {\n''', 'track shutdown')

          marker = 'bool AudioManager::play_loading_music() {\n'
          weather_fn = '''bool AudioManager::play_weather_effect(const SoundEvent event) {\n    if (!available_ || weather_effect_track_ == nullptr) {\n        return false;\n    }\n    const std::size_t index = event_index(event);\n    if (index >= kEventCount || effects_[index].empty()) {\n        return false;\n    }\n\n    // A new lightning flash has priority over the tail of an older weather\n    // one-shot. Restarting this dedicated track never steals an ordinary UI\n    // effect, attraction loop, rain ambience or music track.\n    if (MIX_TrackPlaying(weather_effect_track_) && !MIX_StopTrack(weather_effect_track_, 0)) {\n        std::cerr << "Previous weather one-shot could not stop: " << SDL_GetError() << '\\n';\n        return false;\n    }\n    if (!MIX_SetTrackAudio(weather_effect_track_, effects_[index].front()) ||\n        !MIX_PlayTrack(weather_effect_track_, 0)) {\n        std::cerr << "Weather one-shot could not play: " << kEventNames[index]\n                  << "\\nSDL error: " << SDL_GetError() << '\\n';\n        return false;\n    }\n    return true;\n}\n\n'''
          text = replace_once(text, marker, weather_fn + marker, 'weather one-shot method')

          text = replace_once(text,
          '''    if (ambience_loop_track_ != nullptr && !MIX_SetTrackGain(ambience_loop_track_, volume_settings_.ambience)) {\n        std::cerr << "Could not apply ambience volume: " << SDL_GetError() << '\\n';\n    }\n    if (music_track_ != nullptr && !MIX_SetTrackGain(music_track_, volume_settings_.music)) {\n''',
          '''    if (ambience_loop_track_ != nullptr && !MIX_SetTrackGain(ambience_loop_track_, volume_settings_.ambience)) {\n        std::cerr << "Could not apply ambience volume: " << SDL_GetError() << '\\n';\n    }\n    if (weather_effect_track_ != nullptr && !MIX_SetTrackGain(weather_effect_track_, volume_settings_.effects)) {\n        std::cerr << "Could not apply weather effect volume: " << SDL_GetError() << '\\n';\n    }\n    if (music_track_ != nullptr && !MIX_SetTrackGain(music_track_, volume_settings_.music)) {\n''', 'weather effect gain')

          path.write_text(text, encoding='utf-8')

          path = Path('src/main_runtime_impl.cpp')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              '(void)audio.play(SoundEvent::weather_thunder);',
              '(void)audio.play_weather_effect(SoundEvent::weather_thunder);',
              'runtime thunder call')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'weather_effect_track_' src/audio_manager.cpp
          grep -q 'play_weather_effect(SoundEvent::weather_thunder)' src/main_runtime_impl.cpp
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio_manager.cpp src/main_runtime_impl.cpp
          git commit -m "fix(weather): reserve priority audio track for thunder"
          git push origin main

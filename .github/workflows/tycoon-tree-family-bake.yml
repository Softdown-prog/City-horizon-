name: Tycoon Tree Family Bake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/assets/park_tree_broadleaf_wide_01.fractal.json"
      - "tools/tycoon_photo_studio/assets/park_tree_tall_01.fractal.json"
      - "tools/tycoon_photo_studio/assets/park_tree_young_01.fractal.json"
      - "tools/tycoon_photo_studio/assets/park_tree_ornamental_round_01.fractal.json"
      - "tools/tycoon_photo_studio/build_classic_tree.py"
      - "tools/tycoon_photo_studio/run_classic_tree_compat.py"
      - "tools/tycoon_photo_studio/stylize_foliage_2d.py"
      - "tools/tycoon_photo_studio/build_scene.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - "tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json"
      - ".github/workflows/tycoon-tree-family-bake.yml"

permissions:
  contents: read

jobs:
  bake-tree-family:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_id: park_tree_broadleaf_wide_01
            recipe: tools/tycoon_photo_studio/assets/park_tree_broadleaf_wide_01.fractal.json
            slug: broadleaf-wide-01
          - asset_id: park_tree_tall_01
            recipe: tools/tycoon_photo_studio/assets/park_tree_tall_01.fractal.json
            slug: tall-01
          - asset_id: park_tree_young_01
            recipe: tools/tycoon_photo_studio/assets/park_tree_young_01.fractal.json
            slug: young-01
          - asset_id: park_tree_ornamental_round_01
            recipe: tools/tycoon_photo_studio/assets/park_tree_ornamental_round_01.fractal.json
            slug: ornamental-round-01

    env:
      ASSET_ID: ${{ matrix.asset_id }}
      TREE_SOURCE: ${{ matrix.recipe }}
      TREE_SLUG: ${{ matrix.slug }}
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      CH_TYCOON_SHADOW_SAMPLES: "4"
      CH_TYCOON_SHADOW_DENOISING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Validate tree recipe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path(os.environ['TREE_SOURCE'])
          data = json.loads(source.read_text())
          assert data['contract'] == 'TYCOON_FRACTAL_TREE_SOURCE_V1'
          assert data['assetId'] == os.environ['ASSET_ID']
          assert data['studioPreset'] == 'CH_TYCOON_STUDIO_V1'
          assert data['footprint']['widthTiles'] == 1
          assert data['footprint']['depthTiles'] == 1
          assert data['trunk']['smoothShading'] is True
          assert data['fractalTree']['levels'] >= 3
          assert data['fractalTree']['primaryBranches'] >= 4
          assert data['leafCards']['count'] >= 650
          assert len(data['leafCards']['materials']) >= 5
          assert data['leafCards']['sizeBiasPower'] > 1.0
          profile = data['foliagePostProcess']
          assert profile['shadowAlphaMax'] >= 120
          assert profile['shadowStrength'] >= 0.48
          assert profile['contrastMultiplier'] >= 1.12
          assert profile['shadowBlendIntent'] == 'multiply_equivalent_alpha'
          print('treeFamilySourceGate: PASS', data['assetId'])
          print('leafCards:', data['leafCards']['count'])
          print('crownRadius:', data['leafCards']['crownRadius'])
          PY

      - name: Download pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender"
          url="https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          blender_exe="$(find "$destination" -type f -name blender | head -n 1)"
          test -n "$blender_exe"
          chmod +x "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"

      - name: Bake source renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$TREE_SLUG/source"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup \
            --python tools/tycoon_photo_studio/run_classic_tree_compat.py -- \
            --asset-config "$TREE_SOURCE" \
            --studio-preset "$STUDIO_PRESET" \
            --output "$PWD/out/$TREE_SLUG/source"

          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('out') / os.environ['TREE_SLUG'] / 'source' / 'studio_metadata.json'
          m = json.loads(p.read_text())
          s = m['sourceSummary']
          assert s['sourceMode'] == 'procedural_leaf_card_tree_v1', s
          assert s['branchCount'] > 0, s
          assert s['leafCardCount'] >= 650, s
          print('leafCardGeometryGate: PASS', os.environ['ASSET_ID'])
          print('branches:', s['branchCount'], 'leafCards:', s['leafCardCount'])
          PY

      - name: Build final PNG package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$TREE_SLUG/final"
          python tools/tycoon_photo_studio/postprocess.py \
            --input "out/$TREE_SLUG/source" \
            --output "out/$TREE_SLUG/final" \
            --studio-preset "$STUDIO_PRESET"

      - name: Apply classic foliage profile
        shell: bash
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/stylize_foliage_2d.py \
            --package "out/$TREE_SLUG/final" \
            --asset-id "$ASSET_ID" \
            --asset-config "$TREE_SOURCE"

      - name: Verify final PNG package
        shell: bash
        run: |
          set -euo pipefail
          for direction in south east west north; do
            test -f "out/$TREE_SLUG/final/${ASSET_ID}_${direction}.png"
          done
          test -f "out/$TREE_SLUG/final/${ASSET_ID}_4view.png"
          test -f "out/$TREE_SLUG/final/${ASSET_ID}_review.png"
          test -f "out/$TREE_SLUG/final/${ASSET_ID}_4dir_context.png"
          test -f "out/$TREE_SLUG/final/${ASSET_ID}_manifest.json"

      - name: Upload tree PNGs
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-${{ matrix.asset_id }}-PNGs
          path: |
            out/${{ matrix.slug }}/final
            out/${{ matrix.slug }}/source/studio_metadata.json
          if-no-files-found: error
          retention-days: 14

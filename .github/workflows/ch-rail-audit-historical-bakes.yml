name: CH Rail Audit Historical Blender Bakes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch-rail-audit-historical-bakes.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit-historical-bakes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for reviewed image previews
        run: python3 -m pip install pillow
      - name: Audit existing left-curve bake artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rail-left-bake out/rail-bake-audit
          gh run download 36933056636 --repo "${{ github.repository }}" --name CH-Blender-Agent-36933056636-1 --dir /tmp/rail-left-bake
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/rail-left-bake')
          pngs=sorted(root.rglob('*.png'))
          records=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size} for p in pngs]
          selected=[p for p in records if 'rail.prerendered.curve_left_90' in p['path']]
          report={'source_run':36933056636,'source_artifact':11196458208,
                  'png_count':len(pngs),'left_curve_candidates':selected,
                  'has_all_four_directions':all(any('_'+d in p['path'] for p in selected)
                      for d in ('south','east','north','west')),
                  'approved_for_runtime':False}
          dest=Path('out/rail-bake-audit/left_curve_inventory.json')
          dest.write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not report['has_all_four_directions']:
              raise SystemExit('BLOCKED: incomplete four-direction historical curve bake')
          from PIL import Image, ImageDraw
          import hashlib
          dest=Path('out/rail-bake-audit/curve_left_90')
          dest.mkdir(parents=True,exist_ok=True)
          thumbs=[]
          for direction in ('south','east','north','west'):
              matches=[p for p in pngs if 'rail.prerendered.curve_left_90' in str(p) and '_'+direction+'_source.png' in p.name]
              if len(matches)!=1: raise SystemExit(f'Expected one {direction} source, got {len(matches)}')
              source=matches[0]
              with Image.open(source) as original:
                  if original.width < 512 or original.height < 512: raise SystemExit(f'Undersized {source}')
                  image=original.convert('RGBA')
                  thumb=image.copy(); thumb.thumbnail((420,420))
                  tile=Image.new('RGBA',(440,460),'#dbe4dd')
                  tile.alpha_composite(thumb,((440-thumb.width)//2,(420-thumb.height)//2))
                  ImageDraw.Draw(tile).text((12,433),direction,fill='#15251c')
                  thumbs.append(tile)
                  image.save(dest/f'curve_left_90_{direction}_review.png',optimize=True)
              print(direction,'source SHA256',hashlib.sha256(source.read_bytes()).hexdigest())
          sheet=Image.new('RGBA',(880,920),'#dbe4dd')
          for i,tile in enumerate(thumbs): sheet.alpha_composite(tile,((i%2)*440,(i//2)*460))
          sheet.convert('RGB').save(Path('out/rail-bake-audit/curve_left_90_contact_sheet.png'),optimize=True)
          print('Four original-size previews + 4-up contact sheet exported for review; NOT runtime-promoted.')
          PY
      - name: Inspect remaining historical rail jobs without rerendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          jobs=[
              ('straight','36912425069','CH-Blender-Agent-36912425069-1'),
              ('curve_right_90','36925606297','CH-Blender-Agent-36925606297-1'),
          ]
          results=[]
          for kind,run_id,name in jobs:
              directory=Path('/tmp/rail-history')/kind
              directory.mkdir(parents=True,exist_ok=True)
              cmd=['gh','run','download',run_id,'--repo','${{ github.repository }}',
                   '--name',name,'--dir',str(directory)]
              result=subprocess.run(cmd,capture_output=True,text=True,check=False)
              pngs=sorted(directory.rglob('*.png'))
              results.append({'kind':kind,'run_id':int(run_id),'download_ok':result.returncode==0,
                              'source_pngs':[str(p.relative_to(directory)) for p in pngs],
                              'note':'Historic workflow artifacts may only contain failure reports. No assets are promoted.'})
          target=Path('out/rail-bake-audit/remaining_tracks_inventory.json')
          target.write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
      - name: Publish truthful asset inventory and four-view review images
        uses: actions/upload-artifact@v4
        with:
          name: CH-Rail-Historical-Bake-Audit-${{ github.run_id }}
          path: out/rail-bake-audit/
          if-no-files-found: error
          retention-days: 30

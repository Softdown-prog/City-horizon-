name: CH Coaster V2 Video Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch-coaster-v2-video-proof.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm V2 runtime gate commit
        run: |
          set -euo pipefail
          test -f assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png
          test -f assets/vehicles/coaster_flame_01/car_pose_atlas_runtime_v2.json
          echo "V2 proof workflow entry accepted"

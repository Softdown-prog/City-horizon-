name: CH Coaster V2 Video Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch-coaster-v2-video-proof.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply CH_CAMERA_V1 parity patch for proof
        run: python3 tools/animation_preview/patch_coaster_camera_parity_v1.py

      - name: Validate occupied V2 atlas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct
          from collections import Counter
          from pathlib import Path
          root = Path('assets/vehicles/coaster_flame_01')
          atlas = root / 'car_pose_atlas_v2.png'
          manifest_path = root / 'car_pose_atlas_runtime_v2.json'
          runtime_path = root / 'coaster_flame_01_runtime.json'
          for path in (atlas, manifest_path, runtime_path):
              if not path.is_file():
                  raise SystemExit(f'missing V2 input: {path}')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          if manifest.get('contract') != 'CH_COASTER_CAR_ATLAS_RUNTIME_V2':
              raise SystemExit('wrong V2 atlas contract')
          if manifest.get('poseContract') != 'CH_COASTER_CAR_ORIENTATION_V2':
              raise SystemExit('wrong V2 orientation contract')
          if (manifest.get('frameCount'), manifest.get('columns'), manifest.get('rows')) != (192, 16, 12):
              raise SystemExit('wrong V2 atlas layout')
          families = Counter(f.get('family') for f in manifest.get('frames', []))
          expected = {'heading_pitch_16way':112,'vertical_16way':32,'banked_16way':32,'inverted_16way':16}
          if families != expected:
              raise SystemExit(f'wrong V2 pose families: {dict(families)}')
          header = atlas.read_bytes()[:24]
          if header[:8] != b'\x89PNG\r\n\x1a\n' or header[12:16] != b'IHDR':
              raise SystemExit('V2 atlas is not PNG')
          if struct.unpack('>II', header[16:24]) != (4096, 3072):
              raise SystemExit('wrong V2 atlas dimensions')
          actual = hashlib.sha256(atlas.read_bytes()).hexdigest()
          if actual != manifest.get('spriteSheetSha256'):
              raise SystemExit('V2 atlas SHA mismatch')
          if runtime.get('poseAtlasSource', {}).get('occupiedCompositeSpriteSheetSha256') != actual:
              raise SystemExit('runtime catalog V2 SHA mismatch')
          print('occupied V2 atlas validated', actual)
          PY

      - name: Install renderer dependencies and compatible Qt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ffmpeg libgl1-mesa-dev
          python3 -m pip install --user --upgrade aqtinstall
          echo 'Available Qt 6.8.3 Linux desktop architectures:'
          python3 -m aqt list-qt linux desktop --arch 6.8.3
          QT_ARCH="$(python3 -m aqt list-qt linux desktop --arch 6.8.3 | tr ' ' '\n' | grep -E '(^|_)(gcc_64|linux_gcc_64)$' | head -n1 || true)"
          if [ -z "$QT_ARCH" ]; then
            QT_ARCH="$(python3 -m aqt list-qt linux desktop --arch 6.8.3 | tr ' ' '\n' | grep -E 'gcc.*64|64.*gcc' | head -n1 || true)"
          fi
          if [ -z "$QT_ARCH" ]; then
            echo 'Could not resolve a supported 64-bit GCC Qt architecture for 6.8.3' >&2
            exit 1
          fi
          echo "Resolved Qt architecture: $QT_ARCH"
          python3 -m aqt install-qt linux desktop 6.8.3 "$QT_ARCH" -O "$HOME/Qt"
          QT_CONFIG="$(find "$HOME/Qt/6.8.3" -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          if [ -z "$QT_CONFIG" ]; then
            echo 'Qt6Config.cmake not found after successful aqt install' >&2
            exit 1
          fi
          QT_PREFIX="${QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          echo "Resolved Qt prefix: $QT_PREFIX"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_PREFIX/plugins" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure renderer
        run: |
          set -euo pipefail
          cmake -S tools/animation_preview/coaster_video_proof \
            -B build/ch-coaster-v2 -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"

      - name: Build renderer
        run: cmake --build build/ch-coaster-v2 --target MapForge2CoasterVideoProof --parallel

      - name: Render occupied V2 MapForge proof frames
        run: |
          set -euo pipefail
          rm -rf out/ch-coaster-v2-video
          mkdir -p out/ch-coaster-v2-video/frames
          ./build/ch-coaster-v2/MapForge2CoasterVideoProof \
            out/ch-coaster-v2-video/frames \
            assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png \
            C++/MapForge2/projects/coaster_flame_01.mapforge.json
          count="$(find out/ch-coaster-v2-video/frames -type f -name 'frame_*.png' | wc -l)"
          if [ "$count" -ne 360 ]; then
            echo "Expected 360 proof frames, got $count" >&2
            exit 1
          fi
          echo "Rendered $count occupied V2 frames"

      - name: Encode MP4 and contact sheet
        run: |
          set -euo pipefail
          ffmpeg -y -framerate 30 \
            -i out/ch-coaster-v2-video/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            out/ch-coaster-v2-video/coaster_flame_v2.mp4
          ffmpeg -y -i out/ch-coaster-v2-video/coaster_flame_v2.mp4 \
            -vf "fps=1,scale=640:-1,tile=4x3" -frames:v 1 \
            out/ch-coaster-v2-video/contact_sheet.png
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames \
            -of json out/ch-coaster-v2-video/coaster_flame_v2.mp4 \
            > out/ch-coaster-v2-video/ffprobe.json
          test -s out/ch-coaster-v2-video/coaster_flame_v2.mp4
          test -s out/ch-coaster-v2-video/contact_sheet.png

      - name: Write proof report
        run: |
          set -euo pipefail
          cat > out/ch-coaster-v2-video/proof_report.json <<'JSON'
          {
            "contract": "CH_COASTER_VIDEO_PROOF_V4",
            "status": "ok",
            "renderer": "MapForge2CoasterVideoProof",
            "projectContract": "CH_MAPFORGE_COASTER_PROJECT_V1",
            "routeContract": "CH_COASTER_CENTERLINE_ROUTE_V2",
            "trainRuntimeContract": "CH_COASTER_TRAIN_RUNTIME_V2",
            "carPoseContract": "CH_COASTER_CAR_ATLAS_RUNTIME_V2",
            "cameraContract": "CH_CAMERA_V1",
            "cameraParityProofPatch": true,
            "frameCount": 360,
            "fps": 30,
            "durationSeconds": 12,
            "carCount": 4,
            "staleFrameReuseAllowed": false
          }
          JSON

      - name: Upload V2 video proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-Coaster-V2-Video-Proof-${{ github.run_id }}
          path: |
            out/ch-coaster-v2-video/coaster_flame_v2.mp4
            out/ch-coaster-v2-video/contact_sheet.png
            out/ch-coaster-v2-video/ffprobe.json
            out/ch-coaster-v2-video/proof_report.json
          if-no-files-found: error
          retention-days: 14

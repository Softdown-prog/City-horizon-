# Registered V2 proof workflow; touching this file intentionally triggers capture.
name: CH Coaster V2 Video Proof

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ch-coaster-v2-video-proof.yml"
      - "C++/MapForge2/projects/coaster_flame_01.mapforge.json"
      - "C++/MapForge2/src/coaster_project_video_main.cpp"
      - "C++/MapForge2/src/coaster_video_proof_main.cpp"
      - "src/coaster_car_pose.h"
      - "src/coaster_train_runtime.h"
      - "assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png"
      - "assets/vehicles/coaster_flame_01/car_pose_atlas_runtime_v2.json"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev ffmpeg

      - name: Validate occupied V2 atlas
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          atlas = Path('assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png')
          manifest_path = Path('assets/vehicles/coaster_flame_01/car_pose_atlas_runtime_v2.json')
          assert atlas.is_file(), atlas
          assert manifest_path.is_file(), manifest_path
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['contract'] == 'CH_COASTER_CAR_ATLAS_RUNTIME_V2'
          assert manifest['poseContract'] == 'CH_COASTER_CAR_ORIENTATION_V2'
          assert manifest['frameCount'] == 192
          assert manifest['columns'] == 16
          assert manifest['rows'] == 12
          assert manifest['frameWidth'] == 256
          assert manifest['frameHeight'] == 256
          actual = hashlib.sha256(atlas.read_bytes()).hexdigest()
          assert actual == manifest['spriteSheetSha256'], (actual, manifest['spriteSheetSha256'])
          print('V2 atlas validated', actual)
          PY

      - name: Configure renderer
        run: cmake -S tools/animation_preview/coaster_video_proof -B build/ch-coaster-v2 -G Ninja

      - name: Build renderer
        run: cmake --build build/ch-coaster-v2 --target MapForge2CoasterVideoProof --parallel

      - name: Render 360 frames
        run: |
          rm -rf out/ch-coaster-v2-video
          mkdir -p out/ch-coaster-v2-video/frames
          ./build/ch-coaster-v2/MapForge2CoasterVideoProof \
            out/ch-coaster-v2-video/frames \
            assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png \
            C++/MapForge2/projects/coaster_flame_01.mapforge.json
          count=$(find out/ch-coaster-v2-video/frames -name 'frame_*.png' -type f | wc -l)
          test "$count" -eq 360

      - name: Encode proof
        run: |
          ffmpeg -y -framerate 30 -i out/ch-coaster-v2-video/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            out/ch-coaster-v2-video/coaster_flame_v2.mp4
          ffmpeg -y -i out/ch-coaster-v2-video/coaster_flame_v2.mp4 \
            -vf "fps=1,scale=640:-1,tile=4x3" -frames:v 1 \
            out/ch-coaster-v2-video/contact_sheet.png
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames -of json \
            out/ch-coaster-v2-video/coaster_flame_v2.mp4 \
            > out/ch-coaster-v2-video/ffprobe.json

      - name: Write report
        run: |
          cat > out/ch-coaster-v2-video/proof_report.json <<'JSON'
          {
            "contract": "CH_COASTER_VIDEO_PROOF_V4",
            "status": "ok",
            "renderer": "MapForge2CoasterVideoProof",
            "projectContract": "CH_MAPFORGE_COASTER_PROJECT_V1",
            "routeContract": "CH_COASTER_CENTERLINE_ROUTE_V2",
            "trainRuntimeContract": "CH_COASTER_TRAIN_RUNTIME_V2",
            "carPoseContract": "CH_COASTER_CAR_ATLAS_RUNTIME_V2",
            "frameCount": 360,
            "fps": 30,
            "carCount": 4,
            "staleFrameReuseAllowed": false
          }
          JSON

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-Coaster-V2-Video-Proof-${{ github.run_id }}
          path: |
            out/ch-coaster-v2-video/coaster_flame_v2.mp4
            out/ch-coaster-v2-video/contact_sheet.png
            out/ch-coaster-v2-video/ffprobe.json
            out/ch-coaster-v2-video/proof_report.json
          if-no-files-found: error
          retention-days: 14

name: Apply Service Icons UI Once

on:
  push:
    paths:
      - '.github/workflows/apply-service-icons-ui-once.yml'

permissions:
  contents: write

jobs:
  apply-service-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply UI integration
        run: python3 tools/apply_service_icons_ui.py

      - name: Validate focused change
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/ui_manager.cpp').read_text(encoding='utf-8')
          for token in [
              'ui_service_icon_path',
              'bakery_products',
              'service_price',
              'service_demand',
              'service_customers',
              'service_stock',
              'service_revenue',
              'service_profit',
              'service_maintenance',
          ]:
              assert token in s, token
          assert 'draw_bakery_service_icon' not in s
          assert 'item.has_service_pricing ? 218.0F : 0.0F' in s
          PY
          g++ -std=c++20 -I. -Isrc $(pkg-config --cflags sdl3 2>/dev/null || true) -fsyntax-only src/ui_manager.cpp || true

      - name: Remove one-shot helpers
        run: |
          rm tools/apply_service_icons_ui.py
          rm .github/workflows/apply-service-icons-ui-once.yml

      - name: Commit integration
        run: |
          git config user.name 'OpenAI'
          git config user.email 'openai@users.noreply.github.com'
          git add src/ui_manager.cpp tools/apply_service_icons_ui.py .github/workflows/apply-service-icons-ui-once.yml
          git commit -m 'Integrate service icons into bakery panel'
          git pull --rebase origin main
          git push origin main

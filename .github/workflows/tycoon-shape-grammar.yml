name: Tycoon Shape Grammar Bake

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bake_mixed_use:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Expand shape grammar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/generated_sources
          python tools/tycoon_photo_studio/generate_shape_grammar_asset.py \
            --grammar tools/tycoon_photo_studio/assets/mixed_use_block_2x2.grammar.json \
            --output out/generated_sources/mixed_use_block_2x2.json
          python tools/tycoon_photo_studio/generate_shape_grammar_asset.py \
            --grammar tools/tycoon_photo_studio/assets/mixed_use_block_2x2.grammar.json \
            --output out/generated_sources/mixed_use_block_2x2_check.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('out/generated_sources/mixed_use_block_2x2.json').read_text())
          b = json.loads(Path('out/generated_sources/mixed_use_block_2x2_check.json').read_text())
          if a != b:
              raise SystemExit('shape grammar is not semantically deterministic')
          g = a['generation']
          print(f"determinism ok: floors={g['floorCount']} parts={g['partCount']} seed={g['seed']}")
          PY

      - name: Download Blender 4.2.3
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.2.3-linux-x64.tar.xz"
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          blender_exe="$(find "$RUNNER_TEMP/blender" -type f -name blender | head -n 1)"
          test -n "$blender_exe"
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"

      - name: Bake mixed use building
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 python tools/blender_bake_runner.py \
            --contract C++/MapForge2/presets/tycoon_asset_bake_contract.json \
            --asset-config out/generated_sources/mixed_use_block_2x2.json \
            --studio-preset tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json \
            --blender "$BLENDER_EXE" \
            --output-dir out/tycoon_asset_baker/mixed_use_block_2x2 \
            --xvfb

      - name: Upload PNG package
        uses: actions/upload-artifact@v4
        with:
          name: Tycoon-Shape-Grammar-mixed_use_block_2x2
          path: out/tycoon_asset_baker/mixed_use_block_2x2
          if-no-files-found: error
          retention-days: 14

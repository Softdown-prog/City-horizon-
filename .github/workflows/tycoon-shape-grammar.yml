name: Tycoon Shape Grammar Bake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/tycoon_photo_studio/generate_shape_grammar_asset.py"
      - "tools/tycoon_photo_studio/assets/*.grammar.json"
      - "tools/blender_bake_runner.py"
      - "tools/tycoon_photo_studio/build_scene.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - "tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json"
      - "C++/MapForge2/presets/tycoon_asset_bake_contract.json"
      - ".github/workflows/tycoon-shape-grammar.yml"

permissions:
  contents: read

jobs:
  bake-mixed-use:
    name: Bake mixed_use_block_2x2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Expand shape grammar twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/generated_sources
          python tools/tycoon_photo_studio/generate_shape_grammar_asset.py \
            --grammar tools/tycoon_photo_studio/assets/mixed_use_block_2x2.grammar.json \
            --output out/generated_sources/mixed_use_block_2x2.json
          python tools/tycoon_photo_studio/generate_shape_grammar_asset.py \
            --grammar tools/tycoon_photo_studio/assets/mixed_use_block_2x2.grammar.json \
            --output out/generated_sources/mixed_use_block_2x2_check.json
          cmp out/generated_sources/mixed_use_block_2x2.json out/generated_sources/mixed_use_block_2x2_check.json

      - name: Download pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          version="4.2.3"
          archive="$RUNNER_TEMP/blender-$version-linux-x64.tar.xz"
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.2/blender-$version-linux-x64.tar.xz" \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          echo "BLENDER_EXE=$(find "$RUNNER_TEMP/blender" -type f -name blender | head -n 1)" >> "$GITHUB_ENV"

      - name: Run canonical asset baker
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 python tools/blender_bake_runner.py \
            --contract C++/MapForge2/presets/tycoon_asset_bake_contract.json \
            --asset-config out/generated_sources/mixed_use_block_2x2.json \
            --studio-preset tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json \
            --blender "$BLENDER_EXE" \
            --output-dir out/tycoon_asset_baker/mixed_use_block_2x2 \
            --xvfb

      - uses: actions/upload-artifact@v4
        with:
          name: Tycoon-Shape-Grammar-mixed_use_block_2x2
          path: out/tycoon_asset_baker/mixed_use_block_2x2
          if-no-files-found: error
          retention-days: 14

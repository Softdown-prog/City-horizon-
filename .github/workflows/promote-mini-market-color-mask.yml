name: Promote Mini Market Color Mask

on:
  push:
    branches: [main]
    paths:
      - "tools/ch_blender/promotions/color_masks/building.mini_market.01.runtime.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ch-runtime-mini-market-color-mask-promotion
  cancel-in-progress: false

jobs:
  promote-color-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install post-process dependency
        run: python -m pip install --upgrade pillow

      - name: Read mask promotion contract
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('tools/ch_blender/promotions/color_masks/building.mini_market.01.runtime.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['contract'] == 'CH_RUNTIME_COLOR_MASK_PROMOTION_V1'
          assert d['maskContract'] == 'CH_COLOR_MASK_V1'
          assert d['approved'] is True
          assert d['assetId'] == 'building.mini_market.01'
          assert d['sourceAssetId'] == 'commercial_mini_market_3x2_01'
          assert d['fileStem'] == 'mini_market'
          assert d['finalSize'] == [256, 256]
          assert d['format'] == 'PNG_RGBA'
          assert d['directionOrder'] == ['south', 'east', 'west', 'north']
          assert d['channels'] == {'R': 'wall', 'G': 'roof'}
          assert d['blueChannel'] == 'unused'
          assert d['alpha'] == 'coverage'
          assert d['scope'] == 'large_surfaces_only'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"run_id={d['sourceWorkflowRun']}\n")
              f.write(f"artifact_id={d['sourceArtifactId']}\n")
              f.write(f"source_dir={d['sourceDir']}\n")
          PY

      - name: Download approved CH Blender mask bake artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.promotion.outputs.run_id }}
          artifact-ids: ${{ steps.promotion.outputs.artifact_id }}
          path: out/color_mask_promotion/source

      - name: Canonical Tycoon Photo Studio post-process
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="out/color_mask_promotion/source/${{ steps.promotion.outputs.source_dir }}"
          if [[ ! -d "$SOURCE" ]]; then
            SOURCE="$(find out/color_mask_promotion/source -type d -name '${{ steps.promotion.outputs.source_dir }}' -print -quit)"
            test -n "$SOURCE"
          fi
          for d in south east west north; do
            test -f "$SOURCE/commercial_mini_market_3x2_01_${d}_mask_source.png"
          done
          python tools/tycoon_photo_studio/postprocess.py \
            --input "$SOURCE" \
            --output out/color_mask_promotion/final \
            --studio-preset tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json

      - name: Validate and stage mask-only runtime outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, shutil

          src = Path('out/color_mask_promotion/final')
          dst = Path('assets/buildings/mini_market')
          promotion_path = Path('tools/ch_blender/promotions/color_masks/building.mini_market.01.runtime.json')
          promotion = json.loads(promotion_path.read_text(encoding='utf-8'))
          runtime_path = dst / 'mini_market.json'
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          directions = ('south', 'east', 'west', 'north')
          source_asset_id = 'commercial_mini_market_3x2_01'

          for direction in directions:
              view = runtime['views'][direction]
              normal = dst / view['file']
              actual = hashlib.sha256(normal.read_bytes()).hexdigest()
              if actual != view['sha256']:
                  raise SystemExit(f'{direction}: approved normal sprite hash changed before mask promotion')

          sheet = dst / runtime['spriteSheet']
          if not sheet.is_file():
              raise SystemExit('approved normal 4-view sheet is missing')

          mask_views = {}
          for direction in directions:
              source = src / f'{source_asset_id}_{direction}_mask.png'
              if not source.is_file():
                  raise SystemExit(f'{direction}: missing canonical runtime mask')
              im = Image.open(source).convert('RGBA')
              if im.size != (256, 256):
                  raise SystemExit(f'{direction}: expected 256x256 mask, got {im.size}')

              r, g, b, a = im.split()
              if b.getextrema()[1] != 0:
                  raise SystemExit(f'{direction}: B channel is not empty')
              if r.getextrema()[1] == 0:
                  raise SystemExit(f'{direction}: wall/R channel is empty')
              if g.getextrema()[1] == 0:
                  raise SystemExit(f'{direction}: roof/G channel is empty')
              lo, hi = a.getextrema()
              if lo != 0 or hi != 255:
                  raise SystemExit(f'{direction}: invalid mask alpha range {(lo, hi)}')
              corners = ((0,0),(255,0),(0,255),(255,255))
              if any(a.getpixel(p) != 0 for p in corners):
                  raise SystemExit(f'{direction}: mask background corners are not transparent')

              rp = sum(1 for v in r.getdata() if v > 0)
              gp = sum(1 for v in g.getdata() if v > 0)
              ap = sum(1 for v in a.getdata() if v > 0)
              if rp >= ap or gp >= ap:
                  raise SystemExit(f'{direction}: mask unexpectedly covers the entire object')

              target = dst / f'mini_market_{direction}_mask.png'
              shutil.copyfile(source, target)
              mask_views[direction] = {
                  'file': target.name,
                  'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                  'wallPixels': rp,
                  'roofPixels': gp,
                  'coveredPixels': ap,
              }

          composites = {
              'fourView': (src / f'{source_asset_id}_mask_4view.png', dst / 'mini_market_mask_4view.png'),
              'review': (src / f'{source_asset_id}_mask_review.png', dst / 'mini_market_mask_review.png'),
          }
          composite_meta = {}
          for key, (source, target) in composites.items():
              if not source.is_file():
                  raise SystemExit(f'missing canonical {key}: {source}')
              shutil.copyfile(source, target)
              composite_meta[key] = {
                  'file': target.name,
                  'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
              }

          runtime['colorMask'] = {
              'contract': 'CH_COLOR_MASK_V1',
              'enabled': True,
              'channels': {'R': 'wall', 'G': 'roof'},
              'blueChannel': 'unused',
              'alpha': 'coverage',
              'scope': 'large_surfaces_only',
              'views': mask_views,
              **composite_meta,
              'sourceCommit': promotion['sourceCommit'],
              'sourceWorkflowRun': promotion['sourceWorkflowRun'],
              'sourceArtifactId': promotion['sourceArtifactId'],
              'approvedProxySha256': promotion['approvedProxySha256'],
              'postProcess': 'CH_COLOR_MASK_V1 canonical downsample only; no lighting/AO/shadow/dither/halo removal',
              'runtimeTintingImplemented': False,
          }
          runtime_path.write_text(json.dumps(runtime, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(runtime['colorMask'], indent=2))
          PY

      - name: Verify normal sprites remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            assets/buildings/mini_market/mini_market_south.png \
            assets/buildings/mini_market/mini_market_east.png \
            assets/buildings/mini_market/mini_market_west.png \
            assets/buildings/mini_market/mini_market_north.png \
            assets/buildings/mini_market/mini_market_4view.png

      - name: Commit mini market masks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/buildings/mini_market/mini_market_south_mask.png \
            assets/buildings/mini_market/mini_market_east_mask.png \
            assets/buildings/mini_market/mini_market_west_mask.png \
            assets/buildings/mini_market/mini_market_north_mask.png \
            assets/buildings/mini_market/mini_market_mask_4view.png \
            assets/buildings/mini_market/mini_market_mask_review.png \
            assets/buildings/mini_market/mini_market.json
          if git diff --cached --quiet; then
            echo "Mini market masks already promoted; nothing to commit."
            exit 0
          fi
          git commit -m "asset: promote mini market wall roof masks"
          git pull --rebase origin main
          git push origin HEAD:main

  promote-casa-popular-color-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved Casa Popular CH Blender artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36584187772
          artifact-ids: 11041162241
          path: out/casa_popular_mask/source

      - name: Validate and stage Casa Popular masks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, struct

          root = Path('out/casa_popular_mask/source')
          candidates = list(root.rglob('color_mask_report.json'))
          if not candidates:
              raise SystemExit('Casa Popular color_mask_report.json not found')
          report_path = candidates[0]
          source = report_path.parent
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['contract'] == 'CH_COLOR_MASK_V1'
          assert report['assetId'] == 'building.residential_popular_house.01'
          assert report['approvedProxySha256'] == '62d823f3d0e64cd1778e007430340ae5ecee4211ea2a7f02293c50dd5e0f3956'
          assert report['frameSize'] == [256, 256]
          assert report['alpha'] == 'coverage'
          assert report['channels'] == {'R': 'wall', 'G': 'roof', 'B': 'trim'}

          expected = {
              'south': '0ce598a90d0ffb457f3ddd248c747d24d8628ec075ac643808decde927e2ca69',
              'west': '0cc44431cbdafed9c39537fe6b55a2c4a27be9f9ac1744a7533c8c05d8befa6c',
              'north': '09084b280d1f555193b67ffa51b064623f9a3ee1c8830ff4ec0b5a66d77cb00e',
              'east': 'ef510a79cd95d20f37e0297ddf0ea98554e652f8113797b2fe6ea5536657b007',
          }
          dst = Path('assets/buildings/residential_popular_house_3x3_01')
          promoted = {}
          for direction in ('south', 'west', 'north', 'east'):
              filename = f'residential_popular_house_3x3_01_{direction}_mask.png'
              src = source / filename
              if not src.is_file():
                  raise SystemExit(f'missing {src}')
              raw = src.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected[direction]:
                  raise SystemExit(f'{direction}: SHA mismatch')
              if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR' or struct.unpack('>II', raw[16:24]) != (256, 256):
                  raise SystemExit(f'{direction}: invalid PNG size')
              target = dst / filename
              shutil.copyfile(src, target)
              promoted[direction] = {'path': target.as_posix(), 'sha256': expected[direction]}

          definition_path = Path('assets/definitions/residential_popular_house_01.json')
          definition = json.loads(definition_path.read_text(encoding='utf-8'))
          definition['colorMask'] = {
              'contract': 'CH_COLOR_MASK_V1',
              'enabled': True,
              'channels': {'R': 'wall', 'G': 'roof'},
              'alpha': 'coverage',
              'sprites': {
                  '0': promoted['south']['path'],
                  '1': promoted['west']['path'],
                  '2': promoted['north']['path'],
                  '3': promoted['east']['path'],
              },
          }
          definition_path.write_text(json.dumps(definition, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = dst / 'residential_popular_house_3x3_01_runtime_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['colorMask'] = {
              'contract': 'CH_COLOR_MASK_V1',
              'sourceWorkflowRun': 36584187772,
              'sourceArtifactId': 11041162241,
              'sourceCommit': 'e7aa71410908a1b8ceac9142303935a3e61d6292',
              'sourceArtifactDigest': 'sha256:ffe93a5874f55dc8bd83527b1f816ebd311e7dd10607263ba224a2036e8db2fd',
              'approvedProxySha256': '62d823f3d0e64cd1778e007430340ae5ecee4211ea2a7f02293c50dd5e0f3956',
              'alpha': 'coverage',
              'authoredChannels': {'R': 'wall', 'G': 'roof', 'B': 'trim'},
              'runtimeActiveChannels': {'R': 'wall', 'G': 'roof'},
              'rotationOrder': ['south', 'west', 'north', 'east'],
              'sprites': promoted,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit Casa Popular masks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/definitions/residential_popular_house_01.json \
            assets/buildings/residential_popular_house_3x3_01/residential_popular_house_3x3_01_south_mask.png \
            assets/buildings/residential_popular_house_3x3_01/residential_popular_house_3x3_01_west_mask.png \
            assets/buildings/residential_popular_house_3x3_01/residential_popular_house_3x3_01_north_mask.png \
            assets/buildings/residential_popular_house_3x3_01/residential_popular_house_3x3_01_east_mask.png \
            assets/buildings/residential_popular_house_3x3_01/residential_popular_house_3x3_01_runtime_manifest.json
          if git diff --cached --quiet; then
            echo "Casa Popular masks already promoted; nothing to commit."
            exit 0
          fi
          git commit -m "asset: promote Casa Popular color masks"
          git pull --rebase origin main
          git push origin HEAD:main

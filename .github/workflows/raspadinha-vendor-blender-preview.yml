name: Raspadinha Vendor Blender Preview

on:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/build_raspadinha_vendor_blender.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - ".github/workflows/raspadinha-vendor-blender-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      OUT_DIR: out/raspadinha_vendor_blender
      SOURCE_DIR: out/raspadinha_vendor_blender/source
      FINAL_DIR: out/raspadinha_vendor_blender/final
      BLENDER_VERSION: "4.2.3"
      PYTHONPATH: ${{ github.workspace }}/tools/tycoon_photo_studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install headless and postprocess dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 python3-pil

      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.2.3
          key: blender-${{ runner.os }}-4.2.3-linux-x64

      - name: Download pinned Blender 4.2.3 LTS on cache miss
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender-${BLENDER_VERSION}"
          url="https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          rm -rf "$destination"
          mkdir -p "$destination"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          tar -xf "$archive" -C "$destination" --strip-components=1
          test -x "$destination/blender"

      - name: Configure Blender executable
        shell: bash
        run: |
          set -euo pipefail
          blender_exe="$RUNNER_TEMP/blender-${BLENDER_VERSION}/blender"
          if [[ ! -x "$blender_exe" ]]; then
            echo "Cached Blender executable not found: $blender_exe" >&2
            exit 1
          fi
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"
          "$blender_exe" --version | head -n 1

      - name: Build and bake four directions in Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR" "$FINAL_DIR"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup --python-use-system-env \
            --python tools/tycoon_photo_studio/build_raspadinha_vendor_blender.py -- \
            --studio-preset "$STUDIO_PRESET" \
            --output "$SOURCE_DIR" \
            --save-blend "$OUT_DIR/raspadinha_vendor_v1.blend"
          test -f "$SOURCE_DIR/studio_metadata.json"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_south_color_source.png"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_east_color_source.png"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_west_color_source.png"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_north_color_source.png"

      - name: Canonical postprocess and downsample
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tycoon_photo_studio/postprocess.py \
            --input "$SOURCE_DIR" \
            --output "$FINAL_DIR" \
            --studio-preset "$STUDIO_PRESET"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_south.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_east.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_west.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_north.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_4view.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_review.png"

      - name: Upload Blender scene and review package
        uses: actions/upload-artifact@v4
        with:
          name: Raspadinha-Vendor-Blender-4Dir-Review
          path: out/raspadinha_vendor_blender
          if-no-files-found: error
          retention-days: 14

name: Raspadinha Vendor Blender Preview

on:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/build_raspadinha_vendor_blender.py"
      - ".github/workflows/raspadinha-vendor-blender-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      OUT_DIR: out/raspadinha_vendor_blender
      BLENDER_VERSION: "4.2.3"
      PYTHONPATH: ${{ github.workspace }}/tools/tycoon_photo_studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install headless dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0

      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.2.3
          key: blender-${{ runner.os }}-4.2.3-linux-x64

      - name: Download pinned Blender 4.2.3 LTS on cache miss
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          destination="$RUNNER_TEMP/blender-${BLENDER_VERSION}"
          url="https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          rm -rf "$destination"
          mkdir -p "$destination"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          tar -xf "$archive" -C "$destination" --strip-components=1
          test -x "$destination/blender"

      - name: Configure Blender executable
        shell: bash
        run: |
          set -euo pipefail
          blender_exe="$RUNNER_TEMP/blender-${BLENDER_VERSION}/blender"
          if [[ ! -x "$blender_exe" ]]; then
            echo "Cached Blender executable not found: $blender_exe" >&2
            exit 1
          fi
          echo "BLENDER_EXE=$blender_exe" >> "$GITHUB_ENV"
          "$blender_exe" --version | head -n 1

      - name: Build scene directly in Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background --factory-startup --python-use-system-env \
            --python tools/tycoon_photo_studio/build_raspadinha_vendor_blender.py -- \
            --studio-preset "$STUDIO_PRESET" \
            --save-blend "$OUT_DIR/raspadinha_vendor_v1.blend" \
            --preview-direction south
          test -f "$OUT_DIR/raspadinha_vendor_v1.blend"

      - name: Render idle preview
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background "$OUT_DIR/raspadinha_vendor_v1.blend" \
            --render-output "$PWD/$OUT_DIR/raspadinha_vendor_south_idle_####" \
            --render-format PNG -f 1

      - name: Render greeting preview
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background "$OUT_DIR/raspadinha_vendor_v1.blend" \
            --render-output "$PWD/$OUT_DIR/raspadinha_vendor_south_greet_####" \
            --render-format PNG -f 6

      - name: Render serving preview
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_EXE" --background "$OUT_DIR/raspadinha_vendor_v1.blend" \
            --render-output "$PWD/$OUT_DIR/raspadinha_vendor_south_serve_####" \
            --render-format PNG -f 10

      - name: Upload Blender scene and previews
        uses: actions/upload-artifact@v4
        with:
          name: Raspadinha-Vendor-Blender-Preview
          path: out/raspadinha_vendor_blender
          if-no-files-found: error
          retention-days: 14

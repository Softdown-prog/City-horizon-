name: Raspadinha Vendor Blender Preview

on:
  push:
    branches:
      - main
    paths:
      - "tools/tycoon_photo_studio/build_raspadinha_vendor_blender.py"
      - "tools/tycoon_photo_studio/postprocess.py"
      - ".github/workflows/raspadinha-vendor-blender-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STUDIO_PRESET: tools/tycoon_photo_studio/studio_presets/ch_tycoon_studio_v1.json
      OUT_DIR: out/raspadinha_vendor_blender
      SOURCE_DIR: out/raspadinha_vendor_blender/source
      FINAL_DIR: out/raspadinha_vendor_blender/final
      PYTHONPATH: ${{ github.workspace }}/tools/tycoon_photo_studio
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install postprocess dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pillow

      - name: Setup shared cached CH Blender
        uses: ./.github/actions/setup-ch-blender

      - name: Validate agent-visible Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          python tools/ch_blender/ch_blender_cli.py doctor --report "$OUT_DIR/ch_blender_doctor.json"

      - name: Build and bake four directions in Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR" "$FINAL_DIR"
          xvfb-run -a "$CH_BLENDER_EXE" --background --factory-startup --python-use-system-env \
            --python tools/tycoon_photo_studio/build_raspadinha_vendor_blender.py -- \
            --studio-preset "$STUDIO_PRESET" \
            --output "$SOURCE_DIR" \
            --save-blend "$OUT_DIR/raspadinha_vendor_v1.blend"
          test -f "$SOURCE_DIR/studio_metadata.json"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_south_color_source.png"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_east_color_source.png"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_west_color_source.png"
          test -f "$SOURCE_DIR/prop.raspadinha_vendor.01_north_color_source.png"

      - name: Canonical postprocess and downsample
        shell: bash
        run: |
          set -euo pipefail
          python tools/tycoon_photo_studio/postprocess.py \
            --input "$SOURCE_DIR" \
            --output "$FINAL_DIR" \
            --studio-preset "$STUDIO_PRESET"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_south.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_east.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_west.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_north.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_4view.png"
          test -f "$FINAL_DIR/prop.raspadinha_vendor.01_review.png"

      - name: Upload Blender scene and review package
        uses: actions/upload-artifact@v4
        with:
          name: Raspadinha-Vendor-Blender-4Dir-Review
          path: out/raspadinha_vendor_blender
          if-no-files-found: error
          retention-days: 14

name: CH Ground Path Slope Sprite Bake

on:
  workflow_dispatch:
  push:
    branches:
      - terrain-construction-gameplay
    paths:
      - "tools/generate_dirt_slope_sprites.py"
      - "assets/terrain/paths/dirt_01/dirt_path_05_straight_ns.png"
      - "assets/terrain/paths/dirt_01/dirt_path_10_straight_ew.png"
      - "assets/terrain/paths/sand_01/sand_path_05_straight_ns.png"
      - "assets/terrain/paths/sand_01/sand_path_10_straight_ew.png"
      - "docs/CH_PATH_SLOPE_SPRITE_V1.md"
      - ".github/workflows/ch-dirt-slope-sprite-pilot.yml"

permissions:
  contents: write

# CH_PATH_SLOPE_SPRITE_V1 is an offline bake. Runtime only selects baked sprites.
concurrency:
  group: ch-ground-path-slope-sprite-bake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Bake approved dirt path slope sprites
        run: |
          python tools/generate_dirt_slope_sprites.py \
            --material-id dirt_01 \
            --prefix dirt_path \
            --ns-source assets/terrain/paths/dirt_01/dirt_path_05_straight_ns.png \
            --ew-source assets/terrain/paths/dirt_01/dirt_path_10_straight_ew.png \
            --output-dir out/path_slope_sprites/dirt_01 \
            --contact-sheet out/path_slope_sprites/dirt_01_sheet.png \
            --manifest out/path_slope_sprites/dirt_01_manifest.json

      - name: Bake approved sand path slope sprites
        run: |
          python tools/generate_dirt_slope_sprites.py \
            --material-id sand_01 \
            --prefix sand_path \
            --ns-source assets/terrain/paths/sand_01/sand_path_05_straight_ns.png \
            --ew-source assets/terrain/paths/sand_01/sand_path_10_straight_ew.png \
            --output-dir out/path_slope_sprites/sand_01 \
            --contact-sheet out/path_slope_sprites/sand_01_sheet.png \
            --manifest out/path_slope_sprites/sand_01_manifest.json

      - name: Validate CH_PATH_SLOPE_SPRITE_V1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          for material in ('dirt_01', 'sand_01'):
              root = Path('out/path_slope_sprites') / material
              files = sorted(root.glob('*.png'))
              if len(files) != 20:
                  raise SystemExit(f'{material}: expected 20 baked PNGs, found {len(files)}')

              for path in files:
                  with Image.open(path) as im:
                      im.load()
                      if im.mode != 'RGBA':
                          raise SystemExit(f'{path}: expected RGBA, got {im.mode}')
                      if im.size != (128, 112):
                          raise SystemExit(f'{path}: expected 128x112, got {im.size}')

              manifest_path = Path('out/path_slope_sprites') / f'{material}_manifest.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if manifest.get('contract') != 'CH_PATH_SLOPE_SPRITE_V1':
                  raise SystemExit(f'{material}: unexpected path-slope contract')
              if manifest.get('runtime_visual_policy') != 'sprite_select_only':
                  raise SystemExit(f'{material}: runtime policy must be sprite_select_only')
              if manifest.get('riser_alignment') != 'opposite_isometric_grid_axis':
                  raise SystemExit(f'{material}: stair riser alignment regressed')
              if len(manifest.get('variants', [])) != 20:
                  raise SystemExit(f'{material}: manifest must contain exactly 20 variants')

          print('PASS dirt_01 + sand_01 = 40 baked CH_PATH_SLOPE_SPRITE_V1 PNGs')
          PY

      - name: Promote approved bakes into game assets
        run: |
          mkdir -p assets/terrain/paths/dirt_01/slopes
          mkdir -p assets/terrain/paths/sand_01/slopes
          cp out/path_slope_sprites/dirt_01/*.png assets/terrain/paths/dirt_01/slopes/
          cp out/path_slope_sprites/sand_01/*.png assets/terrain/paths/sand_01/slopes/
          cp out/path_slope_sprites/dirt_01_manifest.json assets/terrain/paths/dirt_01/slopes/manifest.json
          cp out/path_slope_sprites/sand_01_manifest.json assets/terrain/paths/sand_01/slopes/manifest.json

          git add assets/terrain/paths/dirt_01/slopes assets/terrain/paths/sand_01/slopes
          if git diff --cached --quiet; then
            echo "Baked asset library is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bake approved ground path slope sprites"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload ground path slope sprite library
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Ground-Path-Slope-Sprites
          path: |
            out/path_slope_sprites/dirt_01/*.png
            out/path_slope_sprites/sand_01/*.png
            out/path_slope_sprites/dirt_01_sheet.png
            out/path_slope_sprites/sand_01_sheet.png
            out/path_slope_sprites/dirt_01_manifest.json
            out/path_slope_sprites/sand_01_manifest.json
          if-no-files-found: error
          retention-days: 14

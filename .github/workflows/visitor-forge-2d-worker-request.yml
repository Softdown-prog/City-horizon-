name: Visitor Forge 2D Hash-Locked Requests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visitor-forge-2d-worker-request.yml'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/worker_request.py'
      - 'tools/visitor_forge_2d/worker_requests/*.json'
      - 'tools/visitor_forge_2d/examples/prop_trash_bin_green_swing_scene_v1_*.json'

permissions:
  contents: read

jobs:
  render-hash-locked-requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e tools/visitor_forge_2d
      - name: Validate recipe hashes, render and audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/visitor_forge_2d/worker_requests
          for request in tools/visitor_forge_2d/worker_requests/*.json; do
            python -m visitor_forge_2d.worker_request \
              --request "$request" \
              --repo-root . \
              --output out/visitor_forge_2d/worker_requests
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Visitor-Forge-2D-Hash-Locked-${{ github.run_number }}
          path: out/visitor_forge_2d/worker_requests/
          retention-days: 14
          if-no-files-found: error

# A follow-up touch intentionally triggers this newly registered workflow.

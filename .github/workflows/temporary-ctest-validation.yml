name: Temporary CTest Validation

on:
  push:
    paths:
      - ".github/workflows/temporary-ctest-validation.yml"
      - "CMakeLists.txt"
      - "src/**"
  workflow_dispatch:

jobs:
  ctest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure tests
        shell: pwsh
        run: cmake -S . -B build-ctest -DBUILD_TESTING=ON
      - name: Build remaining CTest targets
        shell: pwsh
        run: cmake --build build-ctest --config Debug --parallel 2 --target building_system_test audio_manager_test ui_manager_test
      - name: Expose SDL runtime DLLs
        shell: pwsh
        run: |
          $sdlRuntime = (Resolve-Path "build-ctest/_deps/sdl3-build/Debug").Path
          Write-Host "Adding SDL runtime directory to PATH: $sdlRuntime"
          $sdlRuntime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run remaining CTest targets
        shell: pwsh
        env:
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build-ctest -C Debug --output-on-failure --timeout 30 -R "^(building_system_test|audio_manager_test|ui_manager_test)$"

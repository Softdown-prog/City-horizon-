name: Integrate Dirt Path Runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-dirt-path-runtime.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Wire dirt path into gameplay renderer
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Verify targeted runtime wiring
        shell: bash
        run: |
          grep -F 'sidewalks.place_tile(tile.x, tile.y, "dirt_path")' src/main.cpp
          grep -F 'if (style_id == "dirt_path")' src/ch_render/map_renderer.cpp
          test "$(find assets/terrain/paths/dirt_01 -maxdepth 1 -name 'dirt_path_*.png' | wc -l)" -eq 16

      - name: Commit runtime integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-dirt-path-runtime.yml
          git add src/main.cpp src/ch_render/map_renderer.cpp
          git commit -m "game: wire dirt path autotile into runtime"
          git pull --rebase origin main
          git push origin HEAD:main

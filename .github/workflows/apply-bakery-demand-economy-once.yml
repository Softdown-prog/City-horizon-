name: Apply bakery demand economy once

on:
  push:
    paths:
      - '.github/workflows/apply-bakery-demand-economy-once.yml'

permissions:
  contents: write

jobs:
  bakery-demand-economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply bakery demand economy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block [{label}] in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          bakery_path = Path('assets/definitions/bakery_01.json')
          bakery = json.loads(bakery_path.read_text(encoding='utf-8'))
          bakery['baseServiceCustomersPerMonth'] = 120
          bakery['servicePopulationForFullDemand'] = 60
          bakery_path.write_text(json.dumps(bakery, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once('src/building_system.h',
          '''    std::int64_t maximum_service_price = 0;\n    // Zero for non-residential definitions.''',
          '''    std::int64_t maximum_service_price = 0;\n    // Customer traffic at the default price once the local population reaches\n    // service_population_for_full_demand. These values keep shop balancing data-driven.\n    std::uint32_t base_service_customers_per_month = 0;\n    std::uint32_t service_population_for_full_demand = 0;\n    // Zero for non-residential definitions.''', 'service demand fields')

          replace_once('src/building_system.cpp',
          '''    definition.maximum_service_price = json_number<std::int64_t>(json, "maximumServicePrice").value_or(\n        definition.default_service_price);\n    definition.residential_capacity''',
          '''    definition.maximum_service_price = json_number<std::int64_t>(json, "maximumServicePrice").value_or(\n        definition.default_service_price);\n    definition.base_service_customers_per_month =\n        json_number<std::uint32_t>(json, "baseServiceCustomersPerMonth").value_or(0);\n    definition.service_population_for_full_demand =\n        json_number<std::uint32_t>(json, "servicePopulationForFullDemand").value_or(0);\n    definition.residential_capacity''', 'parse service demand fields')

          replace_once('src/building_system.cpp',
          '''        (definition.default_service_price > 0 &&\n            (definition.service_name.empty() || definition.default_service_price < definition.minimum_service_price ||\n             definition.default_service_price > definition.maximum_service_price)) ||\n        definition.art_scale <= 0.0F) {''',
          '''        (definition.default_service_price > 0 &&\n            (definition.service_name.empty() || definition.default_service_price < definition.minimum_service_price ||\n             definition.default_service_price > definition.maximum_service_price ||\n             definition.base_service_customers_per_month == 0 ||\n             definition.service_population_for_full_demand == 0)) ||\n        definition.art_scale <= 0.0F) {''', 'validate service demand fields')

          replace_once('src/economy_system.h',
          '''    tax_revenue,\n    property_tax,''',
          '''    tax_revenue,\n    service_revenue,\n    property_tax,''', 'service revenue transaction')

          replace_once('src/economy_system.h',
          '''struct MonthlyEconomySummary {\n    std::int64_t revenue = 0;\n    std::int64_t expenses = 0;\n    std::int64_t balance = 0;\n};\n''',
          '''struct MonthlyEconomySummary {\n    std::int64_t revenue = 0;\n    std::int64_t expenses = 0;\n    std::int64_t balance = 0;\n};\n\nstruct ServicePricingEstimate {\n    std::uint32_t price_demand_percent = 0;\n    std::uint32_t population_demand_percent = 0;\n    std::uint32_t customers_per_month = 0;\n    std::int64_t revenue_per_month = 0;\n};\n''', 'service pricing estimate')

          replace_once('src/economy_system.h',
          '''    [[nodiscard]] static std::uint32_t commercial_demand_percent(const BuildingDefinition& definition,\n                                                                  std::uint32_t current_population);\n''',
          '''    [[nodiscard]] static std::uint32_t commercial_demand_percent(const BuildingDefinition& definition,\n                                                                  std::uint32_t current_population);\n    // Price elasticity for player-controlled shops. Default price is the 100% reference;\n    // lowering price attracts more customers while higher prices progressively reduce demand.\n    [[nodiscard]] static std::uint32_t service_price_demand_percent(const BuildingDefinition& definition,\n                                                                     std::int64_t service_price);\n    [[nodiscard]] static ServicePricingEstimate service_pricing_estimate(const BuildingDefinition& definition,\n                                                                          const BuildingInstance& instance,\n                                                                          std::uint32_t current_population);\n''', 'service pricing API')

          replace_once('src/economy_system.cpp',
          '''[[nodiscard]] std::int64_t monthly_revenue_for(const BuildingDefinition& definition,\n                                                const BuildingLevelDefinition& level_def,\n                                                const PopulationSystem& population) {\n    return level_def.tax_revenue_per_month *\n        static_cast<std::int64_t>(CityEconomy::commercial_demand_percent(definition, population.current_population())) / 100;\n}\n''',
          '''[[nodiscard]] std::int64_t monthly_tax_revenue_for(const BuildingDefinition& definition,\n                                                    const BuildingLevelDefinition& level_def,\n                                                    const PopulationSystem& population) {\n    return level_def.tax_revenue_per_month *\n        static_cast<std::int64_t>(CityEconomy::commercial_demand_percent(definition, population.current_population())) / 100;\n}\n''', 'rename monthly tax revenue helper')

          replace_once('src/economy_system.cpp',
          '''std::uint32_t CityEconomy::commercial_demand_percent(const BuildingDefinition& definition,\n                                                      const std::uint32_t current_population) {\n    if (definition.required_population_for_full_revenue == 0) {\n        return 100;\n    }\n\n    constexpr std::uint32_t kMinimumDemandPercent = 10;\n    const std::uint64_t population_percent = static_cast<std::uint64_t>(current_population) * 100U /\n        definition.required_population_for_full_revenue;\n    return std::max(kMinimumDemandPercent, static_cast<std::uint32_t>(std::min<std::uint64_t>(100U, population_percent)));\n}\n''',
          '''std::uint32_t CityEconomy::commercial_demand_percent(const BuildingDefinition& definition,\n                                                      const std::uint32_t current_population) {\n    if (definition.required_population_for_full_revenue == 0) {\n        return 100;\n    }\n\n    constexpr std::uint32_t kMinimumDemandPercent = 10;\n    const std::uint64_t population_percent = static_cast<std::uint64_t>(current_population) * 100U /\n        definition.required_population_for_full_revenue;\n    return std::max(kMinimumDemandPercent, static_cast<std::uint32_t>(std::min<std::uint64_t>(100U, population_percent)));\n}\n\nstd::uint32_t CityEconomy::service_price_demand_percent(const BuildingDefinition& definition,\n                                                         const std::int64_t service_price) {\n    if (definition.default_service_price <= 0 || service_price <= 0) return 0;\n    const std::int64_t price = std::clamp(service_price, definition.minimum_service_price,\n                                          definition.maximum_service_price);\n    const std::int64_t reference = definition.default_service_price;\n    if (price <= reference) {\n        const std::int64_t bonus = (reference - price) * 20;\n        return static_cast<std::uint32_t>(std::clamp<std::int64_t>(100 + bonus, 0, 160));\n    }\n\n    // Above the reference price demand follows an inverse-square curve. This makes\n    // extreme prices visibly unattractive instead of becoming a revenue exploit.\n    const std::uint64_t numerator = static_cast<std::uint64_t>(reference) *\n                                    static_cast<std::uint64_t>(reference) * 100U;\n    const std::uint64_t denominator = static_cast<std::uint64_t>(price) *\n                                      static_cast<std::uint64_t>(price);\n    return std::max<std::uint32_t>(5U, static_cast<std::uint32_t>(numerator / denominator));\n}\n\nServicePricingEstimate CityEconomy::service_pricing_estimate(const BuildingDefinition& definition,\n                                                              const BuildingInstance& instance,\n                                                              const std::uint32_t current_population) {\n    ServicePricingEstimate estimate;\n    if (definition.default_service_price <= 0 || definition.base_service_customers_per_month == 0 ||\n        definition.service_population_for_full_demand == 0) {\n        return estimate;\n    }\n\n    const std::int64_t price = std::clamp(\n        instance.service_price > 0 ? instance.service_price : definition.default_service_price,\n        definition.minimum_service_price, definition.maximum_service_price);\n    estimate.price_demand_percent = service_price_demand_percent(definition, price);\n    estimate.population_demand_percent = static_cast<std::uint32_t>(std::min<std::uint64_t>(\n        100U, static_cast<std::uint64_t>(current_population) * 100U /\n                  definition.service_population_for_full_demand));\n    const std::uint64_t customers = static_cast<std::uint64_t>(definition.base_service_customers_per_month) *\n                                    estimate.price_demand_percent * estimate.population_demand_percent / 10'000U;\n    estimate.customers_per_month = static_cast<std::uint32_t>(customers);\n    estimate.revenue_per_month = static_cast<std::int64_t>(estimate.customers_per_month) * price;\n    return estimate;\n}\n''', 'service demand calculation')

          replace_once('src/economy_system.cpp',
          '''        const auto& level_def = instance.current_level_definition(*definition);\n        monthly_summary_.revenue += monthly_revenue_for(*definition, level_def, population);\n        monthly_summary_.expenses += monthly_expense_for(level_def);''',
          '''        const auto& level_def = instance.current_level_definition(*definition);\n        monthly_summary_.revenue += monthly_tax_revenue_for(*definition, level_def, population);\n        monthly_summary_.revenue += service_pricing_estimate(*definition, instance, population.current_population()).revenue_per_month;\n        monthly_summary_.expenses += monthly_expense_for(level_def);''', 'summary includes service revenue')

          replace_once('src/economy_system.cpp',
          '''        const auto& level_def = instance.current_level_definition(*definition);\n        const std::int64_t revenue = monthly_revenue_for(*definition, level_def, population);\n        monthly_summary_.revenue += revenue;\n        const std::int64_t expense = monthly_expense_for(level_def);\n        monthly_summary_.expenses += expense;\n        if (revenue != 0) {\n            record(EconomyTransactionType::tax_revenue, revenue, closing_date, instance.instance_id);\n        }\n''',
          '''        const auto& level_def = instance.current_level_definition(*definition);\n        const std::int64_t tax_revenue = monthly_tax_revenue_for(*definition, level_def, population);\n        const ServicePricingEstimate service = service_pricing_estimate(*definition, instance, population.current_population());\n        monthly_summary_.revenue += tax_revenue + service.revenue_per_month;\n        const std::int64_t expense = monthly_expense_for(level_def);\n        monthly_summary_.expenses += expense;\n        if (tax_revenue != 0) {\n            record(EconomyTransactionType::tax_revenue, tax_revenue, closing_date, instance.instance_id);\n        }\n        if (service.revenue_per_month != 0) {\n            record(EconomyTransactionType::service_revenue, service.revenue_per_month, closing_date, instance.instance_id);\n        }\n''', 'monthly close service revenue')

          replace_once('src/economy_system.cpp',
          '''        case EconomyTransactionType::tax_revenue: return "TAX";\n        case EconomyTransactionType::property_tax:''',
          '''        case EconomyTransactionType::tax_revenue: return "TAX";\n        case EconomyTransactionType::service_revenue: return "SERVICE SALES";\n        case EconomyTransactionType::property_tax:''', 'service revenue label')

          replace_once('src/ui_manager.h',
          '''    std::string service_price;\n    std::string service_price_range;\n    bool has_service_pricing = false;''',
          '''    std::string service_price;\n    std::string service_price_range;\n    std::string service_price_demand;\n    std::string service_customers_per_month;\n    std::string service_revenue_per_month;\n    std::string service_net_per_month;\n    bool has_service_pricing = false;''', 'service metrics view model')

          replace_once('src/ui_manager.cpp',
          '''        const float service_height = item.has_service_pricing ? 82.0F : 0.0F;''',
          '''        const float service_height = item.has_service_pricing ? 158.0F : 0.0F;''', 'service panel height')

          replace_once('src/ui_manager.cpp',
          '''            draw_text_fit(renderer, panel_x + 78.0F, 254.0F, 238.0F, item.service_price_range, 118, 151, 166);\n            detail_y = 281.0F;''',
          '''            draw_text_fit(renderer, panel_x + 78.0F, 258.0F, 238.0F, item.service_price_range, 118, 151, 166);\n            draw_text_fit(renderer, panel_x + 78.0F, 278.0F, 238.0F, "DEMANDA PELO PRECO: " + item.service_price_demand, 202, 219, 227);\n            draw_text_fit(renderer, panel_x + 78.0F, 296.0F, 238.0F, "CLIENTES / MES: " + item.service_customers_per_month, 202, 219, 227);\n            draw_text_fit(renderer, panel_x + 78.0F, 314.0F, 238.0F, "RECEITA VENDAS: " + item.service_revenue_per_month, 181, 221, 154);\n            draw_text_fit(renderer, panel_x + 78.0F, 332.0F, 238.0F, "RESULTADO: " + item.service_net_per_month, 137, 226, 242);\n            detail_y = 357.0F;''', 'render service metrics')

          replace_once('src/main.cpp',
          '''                if (buildings.set_service_price(instance->instance_id, *definition, instance->service_price + delta)) {\n                    const BuildingInstance* updated = buildings.find_by_id(instance->instance_id);\n                    status = definition->name + ": PRECO AO CLIENTE " +\n                        format_money(updated == nullptr ? instance->service_price : updated->service_price);\n                    (void)audio.play(SoundEvent::ui_click);''',
          '''                if (buildings.set_service_price(instance->instance_id, *definition, instance->service_price + delta)) {\n                    const BuildingInstance* updated = buildings.find_by_id(instance->instance_id);\n                    economy.rebuild_monthly_summary(buildings, catalog, population);\n                    status = definition->name + ": PRECO AO CLIENTE " +\n                        format_money(updated == nullptr ? instance->service_price : updated->service_price);\n                    (void)audio.play(SoundEvent::ui_click);''', 'refresh economy after price change')

          replace_once('src/main.cpp',
          '''                    const std::int64_t commercial_current_revenue = lvl_def.tax_revenue_per_month *\n                        static_cast<std::int64_t>(commercial_demand_percent) / 100;\n                    std::string local_supply;''',
          '''                    const std::int64_t commercial_current_revenue = lvl_def.tax_revenue_per_month *\n                        static_cast<std::int64_t>(commercial_demand_percent) / 100;\n                    const ServicePricingEstimate service_estimate = CityEconomy::service_pricing_estimate(\n                        *definition, *instance, population.current_population());\n                    std::string local_supply;''', 'selected building service estimate')

          replace_once('src/main.cpp',
          '''                        definition->default_service_price > 0\n                            ? "MIN " + format_money(definition->minimum_service_price) +\n                              "  |  MAX " + format_money(definition->maximum_service_price)\n                            : "",\n                        definition->default_service_price > 0,\n                        definition->default_service_price > 0 && instance->service_price > definition->minimum_service_price,''',
          '''                        definition->default_service_price > 0\n                            ? "MIN " + format_money(definition->minimum_service_price) +\n                              "  |  MAX " + format_money(definition->maximum_service_price)\n                            : "",\n                        definition->default_service_price > 0 ? std::to_string(service_estimate.price_demand_percent) + "%" : "",\n                        definition->default_service_price > 0 ? std::to_string(service_estimate.customers_per_month) : "",\n                        definition->default_service_price > 0 ? format_money(service_estimate.revenue_per_month) + "/MES" : "",\n                        definition->default_service_price > 0\n                            ? format_balance(service_estimate.revenue_per_month - lvl_def.maintenance_per_month) + "/MES"\n                            : "",\n                        definition->default_service_price > 0,\n                        definition->default_service_price > 0 && instance->service_price > definition->minimum_service_price,''', 'populate service metrics')

          replace_once('src/economy_simulation_test.cpp',
          '''    const BuildingDefinition* cafe = catalog.find("cafe_01");\n    const BuildingDefinition* house = catalog.find("house_suburban_01");\n    if (!require(cafe != nullptr, "cafe definition exists") || !require(house != nullptr, "house definition exists") ||''',
          '''    const BuildingDefinition* cafe = catalog.find("cafe_01");\n    const BuildingDefinition* house = catalog.find("house_suburban_01");\n    const BuildingDefinition* bakery = catalog.find("bakery_01");\n    if (!require(cafe != nullptr, "cafe definition exists") || !require(house != nullptr, "house definition exists") ||\n        !require(bakery != nullptr, "bakery definition exists") ||''', 'load bakery test definition')

          replace_once('src/economy_simulation_test.cpp',
          '''                 "cafe economics come from JSON")) {\n        return 1;\n    }\n\n    SimulationClock clock(1.0);''',
          '''                 "cafe economics come from JSON") ||\n        !require(bakery->build_cost == 2'500 && bakery->default_service_price == 3 &&\n                     bakery->base_service_customers_per_month == 120 &&\n                     bakery->service_population_for_full_demand == 60,\n                 "bakery pricing economy comes from JSON")) {\n        return 1;\n    }\n\n    BuildingInstance bakery_instance;\n    bakery_instance.definition_id = bakery->id;\n    bakery_instance.service_price = 3;\n    const ServicePricingEstimate bakery_default = CityEconomy::service_pricing_estimate(*bakery, bakery_instance, 60);\n    bakery_instance.service_price = 2;\n    const ServicePricingEstimate bakery_discount = CityEconomy::service_pricing_estimate(*bakery, bakery_instance, 60);\n    bakery_instance.service_price = 5;\n    const ServicePricingEstimate bakery_expensive = CityEconomy::service_pricing_estimate(*bakery, bakery_instance, 60);\n    bakery_instance.service_price = 3;\n    const ServicePricingEstimate bakery_half_population = CityEconomy::service_pricing_estimate(*bakery, bakery_instance, 30);\n    if (!require(bakery_default.price_demand_percent == 100 && bakery_default.customers_per_month == 120 &&\n                     bakery_default.revenue_per_month == 360,\n                 "bakery default price produces reference demand and revenue") ||\n        !require(bakery_discount.price_demand_percent == 120 && bakery_discount.customers_per_month == 144 &&\n                     bakery_discount.revenue_per_month == 288,\n                 "bakery discount increases customers but lowers total sales revenue") ||\n        !require(bakery_expensive.price_demand_percent == 36 && bakery_expensive.customers_per_month == 43 &&\n                     bakery_expensive.revenue_per_month == 215,\n                 "bakery high price reduces demand and revenue") ||\n        !require(bakery_half_population.population_demand_percent == 50 &&\n                     bakery_half_population.customers_per_month == 60 && bakery_half_population.revenue_per_month == 180,\n                 "bakery customer volume is limited by local population")) {\n        return 1;\n    }\n\n    SimulationClock clock(1.0);''', 'bakery demand tests')

          Path('.github/workflows/apply-bakery-demand-economy-once.yml').unlink(missing_ok=True)
          PY

      - name: Validate focused changes
        run: |
          git diff --check
          grep -q '"baseServiceCustomersPerMonth": 120' assets/definitions/bakery_01.json
          grep -q '"servicePopulationForFullDemand": 60' assets/definitions/bakery_01.json
          grep -q 'service_pricing_estimate' src/economy_system.cpp
          grep -q 'SERVICE SALES' src/economy_system.cpp
          grep -q 'DEMANDA PELO PRECO' src/ui_manager.cpp
          grep -q 'economy.rebuild_monthly_summary' src/main.cpp
          grep -q 'bakery high price reduces demand and revenue' src/economy_simulation_test.cpp
          test ! -e .github/workflows/apply-bakery-demand-economy-once.yml
          g++ -std=c++20 -I. -Isrc -fsyntax-only src/economy_system.cpp

      - name: Commit to main
        run: |
          git config user.name 'OpenAI'
          git config user.email 'openai@users.noreply.github.com'
          git add assets/definitions/bakery_01.json src/building_system.h src/building_system.cpp src/economy_system.h src/economy_system.cpp src/ui_manager.h src/ui_manager.cpp src/main.cpp src/economy_simulation_test.cpp .github/workflows/apply-bakery-demand-economy-once.yml
          git commit -m 'Connect bakery pricing to demand and revenue'
          git pull --rebase origin main
          git push origin main

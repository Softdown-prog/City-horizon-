name: Apply bakery stock economy once

on:
  push:
    paths:
      - '.github/workflows/apply-bakery-stock-economy-once.yml'

permissions:
  contents: write

jobs:
  bakery-stock-economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply bakery stock economy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block [{label}] in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Canonical ingredient IDs used by the farming inventory. Keep this data-only;
          # crop artwork is intentionally not invented here.
          resources = Path('assets/farming/resources')
          resources.mkdir(parents=True, exist_ok=True)
          (resources / 'wheat.json').write_text(json.dumps({
              'id': 'wheat', 'name': 'Trigo', 'baseSellPrice': 2, 'storageClass': 'grain'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (resources / 'sugar.json').write_text(json.dumps({
              'id': 'sugar', 'name': 'Açúcar', 'baseSellPrice': 3, 'storageClass': 'general'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          bakery_path = Path('assets/definitions/bakery_01.json')
          bakery = json.loads(bakery_path.read_text(encoding='utf-8'))
          bakery['resourceInputs'] = [
              {'resourceId': 'wheat', 'amountPerMonth': 12, 'localSupplyBonus': 0},
              {'resourceId': 'sugar', 'amountPerMonth': 6, 'localSupplyBonus': 0},
          ]
          bakery_path.write_text(json.dumps(bakery, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once('src/economy_system.h',
          '''struct ServicePricingEstimate {\n    std::uint32_t price_demand_percent = 0;\n    std::uint32_t population_demand_percent = 0;\n    std::uint32_t customers_per_month = 0;\n    std::int64_t revenue_per_month = 0;\n};''',
          '''struct ServicePricingEstimate {\n    std::uint32_t price_demand_percent = 0;\n    std::uint32_t population_demand_percent = 0;\n    std::uint32_t customers_before_supply = 0;\n    std::uint32_t supply_percent = 100;\n    std::uint32_t customers_per_month = 0;\n    std::int64_t revenue_per_month = 0;\n};''', 'service estimate supply fields')

          replace_once('src/economy_system.h',
          '''    void rebuild_monthly_summary(const BuildingManager& buildings, const BuildingCatalog& catalog,\n                                 const PopulationSystem& population);''',
          '''    void rebuild_monthly_summary(const BuildingManager& buildings, const BuildingCatalog& catalog,\n                                 const PopulationSystem& population, const FarmingSystem* farming = nullptr);''',
          'summary farming parameter')

          replace_once('src/economy_system.h',
          '''    [[nodiscard]] static ServicePricingEstimate service_pricing_estimate(const BuildingDefinition& definition,\n                                                                          const BuildingInstance& instance,\n                                                                          std::uint32_t current_population);''',
          '''    [[nodiscard]] static ServicePricingEstimate service_pricing_estimate(const BuildingDefinition& definition,\n                                                                          const BuildingInstance& instance,\n                                                                          std::uint32_t current_population,\n                                                                          const FarmingSystem* farming = nullptr);''',
          'pricing farming parameter')

          replace_once('src/economy_system.cpp', '#include <algorithm>\n', '#include <algorithm>\n#include <unordered_map>\n', 'unordered map include')

          replace_once('src/economy_system.cpp',
          '''[[nodiscard]] std::int64_t monthly_expense_for(const BuildingLevelDefinition& level_def) {\n    return level_def.maintenance_per_month;\n}\n\n}  // namespace''',
          '''[[nodiscard]] std::int64_t monthly_expense_for(const BuildingLevelDefinition& level_def) {\n    return level_def.maintenance_per_month;\n}\n\n[[nodiscard]] int scaled_service_input_units(const BuildingResourceInput& input,\n                                             const std::uint32_t customers,\n                                             const std::uint32_t base_customers) {\n    if (customers == 0 || base_customers == 0) return 0;\n    const std::uint64_t numerator = static_cast<std::uint64_t>(input.amount_per_month) * customers;\n    return static_cast<int>((numerator + base_customers - 1U) / base_customers);\n}\n\nvoid apply_service_supply(const BuildingDefinition& definition, const std::int64_t price,\n                          ServicePricingEstimate& estimate,\n                          const std::unordered_map<std::string, int>* inventory) {\n    estimate.supply_percent = 100;\n    if (definition.resource_inputs.empty() || inventory == nullptr || estimate.customers_before_supply == 0) {\n        estimate.customers_per_month = estimate.customers_before_supply;\n        estimate.revenue_per_month = static_cast<std::int64_t>(estimate.customers_per_month) * price;\n        return;\n    }\n\n    for (const BuildingResourceInput& input : definition.resource_inputs) {\n        const int required = scaled_service_input_units(input, estimate.customers_before_supply,\n                                                        definition.base_service_customers_per_month);\n        if (required <= 0) continue;\n        const auto found = inventory->find(input.resource_id);\n        const int available = found == inventory->end() ? 0 : std::max(0, found->second);\n        const std::uint32_t input_percent = static_cast<std::uint32_t>(std::min<std::int64_t>(\n            100, static_cast<std::int64_t>(available) * 100 / required));\n        estimate.supply_percent = std::min(estimate.supply_percent, input_percent);\n    }\n    estimate.customers_per_month = static_cast<std::uint32_t>(\n        static_cast<std::uint64_t>(estimate.customers_before_supply) * estimate.supply_percent / 100U);\n    estimate.revenue_per_month = static_cast<std::int64_t>(estimate.customers_per_month) * price;\n}\n\nvoid consume_service_inputs_from_inventory(const BuildingDefinition& definition,\n                                           const std::uint32_t served_customers,\n                                           std::unordered_map<std::string, int>& inventory) {\n    if (served_customers == 0 || definition.base_service_customers_per_month == 0) return;\n    for (const BuildingResourceInput& input : definition.resource_inputs) {\n        const int requested = scaled_service_input_units(input, served_customers,\n                                                         definition.base_service_customers_per_month);\n        if (requested <= 0) continue;\n        auto found = inventory.find(input.resource_id);\n        if (found == inventory.end()) continue;\n        found->second = std::max(0, found->second - std::min(requested, found->second));\n        if (found->second == 0) inventory.erase(found);\n    }\n}\n\nvoid consume_service_inputs(const BuildingDefinition& definition,\n                            const ServicePricingEstimate& estimate, FarmingSystem* farming) {\n    if (farming == nullptr || estimate.customers_per_month == 0 ||\n        definition.base_service_customers_per_month == 0) return;\n    for (const BuildingResourceInput& input : definition.resource_inputs) {\n        const int requested = scaled_service_input_units(input, estimate.customers_per_month,\n                                                         definition.base_service_customers_per_month);\n        if (requested > 0) (void)farming->try_remove_resource(input.resource_id, requested);\n    }\n}\n\n}  // namespace''',
          'service supply helpers')

          replace_once('src/economy_system.cpp',
          '''ServicePricingEstimate CityEconomy::service_pricing_estimate(const BuildingDefinition& definition,\n                                                              const BuildingInstance& instance,\n                                                              const std::uint32_t current_population) {\n    ServicePricingEstimate estimate;\n    if (definition.default_service_price <= 0 || definition.base_service_customers_per_month == 0 ||\n        definition.service_population_for_full_demand == 0) {\n        return estimate;\n    }\n\n    const std::int64_t price = std::clamp(\n        instance.service_price > 0 ? instance.service_price : definition.default_service_price,\n        definition.minimum_service_price, definition.maximum_service_price);\n    estimate.price_demand_percent = service_price_demand_percent(definition, price);\n    estimate.population_demand_percent = static_cast<std::uint32_t>(std::min<std::uint64_t>(\n        100U, static_cast<std::uint64_t>(current_population) * 100U /\n                  definition.service_population_for_full_demand));\n    const std::uint64_t customers = static_cast<std::uint64_t>(definition.base_service_customers_per_month) *\n                                    estimate.price_demand_percent * estimate.population_demand_percent / 10'000U;\n    estimate.customers_per_month = static_cast<std::uint32_t>(customers);\n    estimate.revenue_per_month = static_cast<std::int64_t>(estimate.customers_per_month) * price;\n    return estimate;\n}''',
          '''ServicePricingEstimate CityEconomy::service_pricing_estimate(const BuildingDefinition& definition,\n                                                              const BuildingInstance& instance,\n                                                              const std::uint32_t current_population,\n                                                              const FarmingSystem* farming) {\n    ServicePricingEstimate estimate;\n    if (definition.default_service_price <= 0 || definition.base_service_customers_per_month == 0 ||\n        definition.service_population_for_full_demand == 0) {\n        return estimate;\n    }\n\n    const std::int64_t price = std::clamp(\n        instance.service_price > 0 ? instance.service_price : definition.default_service_price,\n        definition.minimum_service_price, definition.maximum_service_price);\n    estimate.price_demand_percent = service_price_demand_percent(definition, price);\n    estimate.population_demand_percent = static_cast<std::uint32_t>(std::min<std::uint64_t>(\n        100U, static_cast<std::uint64_t>(current_population) * 100U /\n                  definition.service_population_for_full_demand));\n    estimate.customers_before_supply = static_cast<std::uint32_t>(\n        static_cast<std::uint64_t>(definition.base_service_customers_per_month) *\n        estimate.price_demand_percent * estimate.population_demand_percent / 10'000U);\n    const auto* inventory = farming == nullptr ? nullptr : &farming->inventory();\n    apply_service_supply(definition, price, estimate, inventory);\n    return estimate;\n}''',
          'supply-aware service estimate')

          replace_once('src/economy_system.cpp',
          '''void CityEconomy::rebuild_monthly_summary(const BuildingManager& buildings, const BuildingCatalog& catalog,\n                                          const PopulationSystem& population) {\n    monthly_summary_ = {};\n    for (const BuildingInstance& instance : buildings.instances()) {''',
          '''void CityEconomy::rebuild_monthly_summary(const BuildingManager& buildings, const BuildingCatalog& catalog,\n                                          const PopulationSystem& population, const FarmingSystem* farming) {\n    monthly_summary_ = {};\n    std::unordered_map<std::string, int> virtual_inventory = farming == nullptr\n        ? std::unordered_map<std::string, int>{}\n        : farming->inventory();\n    for (const BuildingInstance& instance : buildings.instances()) {''',
          'summary signature and virtual inventory')

          replace_once('src/economy_system.cpp',
          '''        const auto& level_def = instance.current_level_definition(*definition);\n        monthly_summary_.revenue += monthly_tax_revenue_for(*definition, level_def, population);\n        monthly_summary_.revenue += service_pricing_estimate(*definition, instance, population.current_population()).revenue_per_month;\n        monthly_summary_.expenses += monthly_expense_for(level_def);''',
          '''        const auto& level_def = instance.current_level_definition(*definition);\n        monthly_summary_.revenue += monthly_tax_revenue_for(*definition, level_def, population);\n        ServicePricingEstimate service = service_pricing_estimate(*definition, instance, population.current_population());\n        if (farming != nullptr && !definition->resource_inputs.empty()) {\n            const std::int64_t price = std::clamp(\n                instance.service_price > 0 ? instance.service_price : definition->default_service_price,\n                definition->minimum_service_price, definition->maximum_service_price);\n            apply_service_supply(*definition, price, service, &virtual_inventory);\n            consume_service_inputs_from_inventory(*definition, service.customers_per_month, virtual_inventory);\n        }\n        monthly_summary_.revenue += service.revenue_per_month;\n        monthly_summary_.expenses += monthly_expense_for(level_def);''',
          'summary stock-aware service revenue')

          replace_once('src/economy_system.cpp',
          '''        const ServicePricingEstimate service = service_pricing_estimate(*definition, instance, population.current_population());\n        monthly_summary_.revenue += tax_revenue + service.revenue_per_month;''',
          '''        const ServicePricingEstimate service = service_pricing_estimate(\n            *definition, instance, population.current_population(), farming);\n        monthly_summary_.revenue += tax_revenue + service.revenue_per_month;''',
          'monthly close stock-aware estimate')

          replace_once('src/economy_system.cpp',
          '''        if (service.revenue_per_month != 0) {\n            record(EconomyTransactionType::service_revenue, service.revenue_per_month, closing_date, instance.instance_id);\n        }\n        if (expense != 0) {''',
          '''        if (service.revenue_per_month != 0) {\n            record(EconomyTransactionType::service_revenue, service.revenue_per_month, closing_date, instance.instance_id);\n        }\n        consume_service_inputs(*definition, service, farming);\n        if (expense != 0) {''',
          'consume service ingredients')

          replace_once('src/economy_system.cpp',
          '''        if (farming != nullptr && !definition->resource_inputs.empty()) {''',
          '''        if (farming != nullptr && !definition->resource_inputs.empty() && definition->default_service_price <= 0) {''',
          'avoid double input consumption')

          replace_once('src/ui_manager.h',
          '''    std::string service_net_per_month;\n    bool has_service_pricing = false;''',
          '''    std::string service_net_per_month;\n    std::string service_supply_status;\n    bool has_service_pricing = false;''',
          'service supply view model')

          replace_once('src/ui_manager.cpp',
          '''        const float service_height = item.has_service_pricing ? 158.0F : 0.0F;''',
          '''        const float service_height = item.has_service_pricing ? 176.0F : 0.0F;''',
          'service panel supply height')

          replace_once('src/ui_manager.cpp',
          '''            draw_text_fit(renderer, panel_x + 78.0F, 332.0F, 238.0F, "RESULTADO: " + item.service_net_per_month, 137, 226, 242);\n            detail_y = 357.0F;''',
          '''            draw_text_fit(renderer, panel_x + 78.0F, 332.0F, 238.0F, "RESULTADO: " + item.service_net_per_month, 137, 226, 242);\n            draw_text_fit(renderer, panel_x + 78.0F, 350.0F, 238.0F, item.service_supply_status,\n                          item.service_supply_status.find("100%") != std::string::npos ? 181 : 255,\n                          item.service_supply_status.find("100%") != std::string::npos ? 221 : 188,\n                          item.service_supply_status.find("100%") != std::string::npos ? 154 : 128);\n            detail_y = 375.0F;''',
          'render supply status')

          replace_once('src/main.cpp',
          '''                    economy.rebuild_monthly_summary(buildings, catalog, population);''',
          '''                    economy.rebuild_monthly_summary(buildings, catalog, population, &farming);''',
          'price action stock-aware summary')

          replace_once('src/main.cpp',
          '''                    const ServicePricingEstimate service_estimate = CityEconomy::service_pricing_estimate(\n                        *definition, *instance, population.current_population());''',
          '''                    const ServicePricingEstimate service_estimate = CityEconomy::service_pricing_estimate(\n                        *definition, *instance, population.current_population(), &farming);''',
          'selected building supply estimate')

          replace_once('src/main.cpp',
          '''                            requirements += (resource == nullptr ? input.resource_id : resource->display_name) + " " + std::to_string(input.amount_per_month) + "/MES";\n                            supplied = supplied && farming.inventory_count(input.resource_id) >= input.amount_per_month;\n                            bonus += input.local_supply_bonus;\n                        }\n                        local_supply = requirements + " | " + (supplied ? "ABASTECIDO +" + format_money(bonus) : "SEM ESTOQUE");''',
          '''                            const int full_requirement = input.amount_per_month;\n                            const int demand_requirement = definition->default_service_price > 0 &&\n                                definition->base_service_customers_per_month > 0\n                                ? static_cast<int>((static_cast<std::uint64_t>(full_requirement) *\n                                      service_estimate.customers_before_supply + definition->base_service_customers_per_month - 1U) /\n                                      definition->base_service_customers_per_month)\n                                : full_requirement;\n                            const int available = farming.inventory_count(input.resource_id);\n                            requirements += (resource == nullptr ? input.resource_id : resource->display_name) + " " +\n                                std::to_string(available) + "/" + std::to_string(demand_requirement);\n                            supplied = supplied && available >= demand_requirement;\n                            bonus += input.local_supply_bonus;\n                        }\n                        if (definition->default_service_price > 0) {\n                            local_supply = requirements;\n                        } else {\n                            local_supply = requirements + " | " + (supplied ? "ABASTECIDO +" + format_money(bonus) : "SEM ESTOQUE");\n                        }''',
          'selected building ingredient inventory')

          replace_once('src/main.cpp',
          '''                        definition->default_service_price > 0\n                            ? format_balance(service_estimate.revenue_per_month - lvl_def.maintenance_per_month) + "/MES"\n                            : "",\n                        definition->default_service_price > 0,''',
          '''                        definition->default_service_price > 0\n                            ? format_balance(service_estimate.revenue_per_month - lvl_def.maintenance_per_month) + "/MES"\n                            : "",\n                        definition->default_service_price > 0\n                            ? "INSUMOS: " + std::to_string(service_estimate.supply_percent) + "% - " +\n                              (service_estimate.supply_percent >= 100 ? "ABASTECIDA" :\n                               (service_estimate.supply_percent == 0 ? "SEM ESTOQUE" : "ESTOQUE LIMITADO"))\n                            : "",\n                        definition->default_service_price > 0,''',
          'selected building supply status')

          replace_once('src/save_manager.cpp',
          '''    economy.rebuild_monthly_summary(buildings, catalog, population);''',
          '''    economy.rebuild_monthly_summary(buildings, catalog, population, &farming);''',
          'load stock-aware summary')

          replace_once('src/economy_simulation_test.cpp',
          '''#include "economy_system.h"\n#include "population_system.h"''',
          '''#include "economy_system.h"\n#include "farming_system.h"\n#include "population_system.h"''',
          'farming test include')

          replace_once('src/economy_simulation_test.cpp',
          '''    if (!require(bakery_default.price_demand_percent == 100 && bakery_default.customers_per_month == 120 &&\n                     bakery_default.revenue_per_month == 360,''',
          '''    FarmingSystem bakery_stock(-4, 4);\n    bakery_stock.restore_inventory({{"wheat", 12}, {"sugar", 6}});\n    const ServicePricingEstimate bakery_stocked = CityEconomy::service_pricing_estimate(\n        *bakery, bakery_instance, 60, &bakery_stock);\n    bakery_stock.restore_inventory({{"wheat", 6}, {"sugar", 3}});\n    const ServicePricingEstimate bakery_half_stock = CityEconomy::service_pricing_estimate(\n        *bakery, bakery_instance, 60, &bakery_stock);\n    bakery_stock.restore_inventory({});\n    const ServicePricingEstimate bakery_empty = CityEconomy::service_pricing_estimate(\n        *bakery, bakery_instance, 60, &bakery_stock);\n    if (!require(bakery_default.price_demand_percent == 100 && bakery_default.customers_per_month == 120 &&\n                     bakery_default.revenue_per_month == 360,''',
          'stock estimates test setup')

          replace_once('src/economy_simulation_test.cpp',
          '''        !require(bakery_half_population.population_demand_percent == 50 &&\n                     bakery_half_population.customers_per_month == 60 && bakery_half_population.revenue_per_month == 180,\n                 "bakery customer volume is limited by local population")) {''',
          '''        !require(bakery_half_population.population_demand_percent == 50 &&\n                     bakery_half_population.customers_per_month == 60 && bakery_half_population.revenue_per_month == 180,\n                 "bakery customer volume is limited by local population") ||\n        !require(bakery_stocked.supply_percent == 100 && bakery_stocked.customers_per_month == 120 &&\n                     bakery_stocked.revenue_per_month == 360,\n                 "fully stocked bakery serves its full priced demand") ||\n        !require(bakery_half_stock.supply_percent == 50 && bakery_half_stock.customers_per_month == 60 &&\n                     bakery_half_stock.revenue_per_month == 180,\n                 "half ingredient stock halves bakery customers and sales") ||\n        !require(bakery_empty.supply_percent == 0 && bakery_empty.customers_per_month == 0 &&\n                     bakery_empty.revenue_per_month == 0,\n                 "empty bakery stock stops customer sales")) {''',
          'stock estimate assertions')

          # The canonical repo currently has no crop artwork/data directory. Do not invent visuals,
          # but keep missing crops non-fatal so the rest of the city and stock-aware bakery can run.
          replace_once('src/main.cpp',
          '''    CropCatalog crop_catalog;\n    if (!crop_catalog.load_from_directory(asset_root / "assets/farming/crops")) {\n        std::cerr << "No valid crop definitions were loaded.\\n";\n        audio.shutdown(); textures.clear(); SDL_DestroyRenderer(renderer); SDL_DestroyWindow(window); SDL_Quit(); return 1;\n    }''',
          '''    CropCatalog crop_catalog;\n    if (!crop_catalog.load_from_directory(asset_root / "assets/farming/crops")) {\n        std::cerr << "No valid crop definitions were loaded; planting remains unavailable until crop data/art is restored.\\n";\n    }''',
          'missing crop data graceful fallback')

          # Remove this one-shot workflow before the functional commit.
          Path('.github/workflows/apply-bakery-stock-economy-once.yml').unlink()
          PY

      - name: Validate focused changes
        run: |
          git diff --check
          grep -q '"resourceId": "wheat"' assets/definitions/bakery_01.json
          grep -q '"resourceId": "sugar"' assets/definitions/bakery_01.json
          grep -q '"id": "wheat"' assets/farming/resources/wheat.json
          grep -q '"id": "sugar"' assets/farming/resources/sugar.json
          grep -q 'supply_percent' src/economy_system.cpp
          grep -q 'consume_service_inputs' src/economy_system.cpp
          grep -q 'INSUMOS:' src/main.cpp
          grep -q 'planting remains unavailable' src/main.cpp
          g++ -std=c++20 -I. -Isrc -fsyntax-only src/economy_system.cpp src/economy_simulation_test.cpp
          test ! -e .github/workflows/apply-bakery-stock-economy-once.yml

      - name: Commit to main
        run: |
          git config user.name 'OpenAI'
          git config user.email 'openai@users.noreply.github.com'
          git add assets/definitions/bakery_01.json assets/farming/resources/wheat.json assets/farming/resources/sugar.json src/economy_system.h src/economy_system.cpp src/ui_manager.h src/ui_manager.cpp src/main.cpp src/save_manager.cpp src/economy_simulation_test.cpp .github/workflows/apply-bakery-stock-economy-once.yml
          git commit -m 'Connect bakery sales to ingredient stock'
          git pull --rebase origin main
          git push origin main

name: Apply admin reports UI migration once

on:
  push:
    paths:
      - '.github/ui-admin-reports-trigger'

permissions:
  contents: write

jobs:
  patch-admin-reports-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_admin_reports_ui_patch.py

      - name: Validate focused changes
        run: |
          set -euo pipefail
          grep -q 'ADMINISTRACAO' src/ui_manager.cpp
          grep -q 'RESUMO OPERACIONAL' src/ui_manager.cpp
          grep -q 'UiOverlay::administration' src/ui_manager.cpp
          grep -q 'UiOverlay::reports' src/ui_manager.cpp
          ! grep -q 'administration_panel.png' src/ui_manager.cpp
          ! grep -q 'reports_panel.png' src/ui_manager.cpp
          git diff --check

      - name: Commit focused migration
        run: |
          set -euo pipefail
          git config user.name 'City Horizon UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui_manager.cpp
          git commit -m 'Migrate administration and reports to procedural UI'
          git push origin HEAD:main

name: Convert weather audio (one shot)

on:
  push:
    paths:
      - .github/workflows/convert-weather-audio-once.yml

permissions:
  contents: write

jobs:
  convert-weather-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward to current main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - name: Install ffmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Validate source durations
        run: |
          python - <<'PY'
          import subprocess
          sources = {
              'rain': ('Converter/freesound_community-chuva-forte-a-tarde-6106.mp3', 25.0, 45.0),
              'thunder': ('Converter/v1419-chuva-com-trovao-02-307290.mp3', 5.0, 18.0),
          }
          for name, (path, low, high) in sources.items():
              value = float(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', path,
              ], text=True).strip())
              print(f'{name}: {value:.3f}s')
              if not (low <= value <= high):
                  raise SystemExit(f'{name} source duration {value:.3f}s outside expected {low}-{high}s')
          PY
      - name: Convert through City Horizon audio worker
        run: |
          python tools/audio_asset_worker.py tools/audio_jobs/weather_rain.json
          python tools/audio_asset_worker.py tools/audio_jobs/weather_thunder.json
      - name: Validate runtime OGG files
        run: |
          test -s assets/audio/weather/rain_calm.ogg
          test -s assets/audio/weather/thunder.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 assets/audio/weather/rain_calm.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 assets/audio/weather/thunder.ogg
      - name: Commit converted runtime audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/weather assets/audio/audio_catalog.json
          if git diff --cached --quiet; then
            echo "Weather audio already converted"
            exit 0
          fi
          git commit -m "audio: convert rain and thunder to OGG"
          git push origin main

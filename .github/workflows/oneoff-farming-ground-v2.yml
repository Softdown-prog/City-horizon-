name: One-off Farming Ground V2

on:
  push:
    paths:
      - '.github/workflows/oneoff-farming-ground-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply CH_FARM_GROUND_V2 pilot
        run: python3 .github/scripts/patch_farming_ground_v2.py
      - name: Validate patch
        run: git diff --check
      - name: Commit pilot directly to main
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "City Horizon Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ch_render/map_renderer.cpp
          git commit -m "render: add continuous farming ground v2 pilot"
          git push origin HEAD:main

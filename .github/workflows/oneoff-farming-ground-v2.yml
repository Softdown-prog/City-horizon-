name: One-off Farming Ground V2

on:
  push:
    paths:
      - '.github/workflows/oneoff-farming-ground-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace legacy farm tile renderer with CH_FARM_GROUND_V2 pilot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/ch_render/map_renderer.cpp')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''void MapRenderer::render_farming\(SDL_Renderer\* renderer, const FarmingSystem& farming, const CropCatalog& crops,\n'''
              r'''\s*const std::function<const TextureAsset\*\(const std::filesystem::path&\)>& find_texture,\n'''
              r'''\s*const std::filesystem::path& root, const CameraState& camera,\n'''
              r'''\s*const float viewport_width, const float viewport_height\) \{.*?\n\}\n\n'''
              r'''(?=void MapRenderer::render_farming\(SDL_Renderer\* renderer, const FarmingSystem& farming, const CropCatalog& crops,\n'''
              r'''\s*const std::unordered_map<std::string, TextureAsset>& texture_lookup,)''',
              re.S,
          )

          replacement = r'''void MapRenderer::render_farming(SDL_Renderer* renderer, const FarmingSystem& farming, const CropCatalog& crops,
                                const std::function<const TextureAsset*(const std::filesystem::path&)>& find_texture,
                                const std::filesystem::path& root, const CameraState& camera,
                                const float viewport_width, const float viewport_height) {
    // CH_FARM_GROUND_V2 pilot: the simulation remains tile based, but the
    // presentation no longer repeats a complete prepared-soil PNG per cell.
    // Crops are intentionally hidden during this ground-only visual gate.
    (void)crops;
    (void)find_texture;
    (void)root;

    if (renderer == nullptr || farming.tiles().empty()) return;

    // One identical opaque material over all logical farm cells.  Because no
    // outline or per-cell variation is drawn, neighbouring cells read as one
    // continuous field while placement/save semantics remain unchanged.
    constexpr SDL_FColor kPreparedSoil = {
        116.0F / 255.0F,
        76.0F / 255.0F,
        43.0F / 255.0F,
        1.0F,
    };
    for (const FarmTile& tile : farming.tiles()) {
        render_tile_fill(renderer, tile.tile_x, tile.tile_y, camera,
                         viewport_width, viewport_height, kPreparedSoil);
    }

    // Furrows live in canonical world coordinates.  We draw one line for each
    // contiguous horizontal farm run instead of restarting at every tile, so
    // internal tile boundaries can never interrupt a row.  Camera rotation
    // only changes projection; the logical furrow direction stays fixed.
    constexpr std::array<float, 5> kFurrowOffsets = {0.10F, 0.30F, 0.50F, 0.70F, 0.90F};
    SDL_SetRenderDrawColor(renderer, 83, 49, 28, 205);

    for (const FarmTile& tile : farming.tiles()) {
        if (farming.is_occupied(tile.tile_x - 1, tile.tile_y)) continue;

        int run_end_x = tile.tile_x;
        while (farming.is_occupied(run_end_x + 1, tile.tile_y)) {
            ++run_end_x;
        }

        for (const float offset : kFurrowOffsets) {
            const ScreenPoint start = world_to_screen_point(
                static_cast<float>(tile.tile_x),
                static_cast<float>(tile.tile_y) + offset,
                camera, viewport_width, viewport_height);
            const ScreenPoint end = world_to_screen_point(
                static_cast<float>(run_end_x + 1),
                static_cast<float>(tile.tile_y) + offset,
                camera, viewport_width, viewport_height);
            SDL_RenderLine(renderer, start.x, start.y, end.x, end.y);
        }
    }
}

'''

          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy render_farming block, replaced {count}')

          # These constants belonged only to the removed full-tile farm PNG path.
          patched = re.sub(
              r'\nconstexpr float kFarmOpaqueLeft = 16\.0F;\nconstexpr float kFarmOpaqueTop = 151\.0F;\nconstexpr float kFarmOpaqueWidth = 1220\.0F;\n',
              '\n',
              patched,
              count=1,
          )

          path.write_text(patched, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/ch_render/map_renderer.cpp
      - name: Commit pilot directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'City Horizon Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ch_render/map_renderer.cpp
          git commit -m 'render: add continuous farming ground v2 pilot'
          git push origin HEAD:main

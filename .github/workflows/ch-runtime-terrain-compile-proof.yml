name: CH Runtime Terrain Compile Proof

on:
  workflow_dispatch:
  push:
    branches:
      - terrain-construction-gameplay
    paths:
      - ".github/workflows/ch-runtime-terrain-compile-proof.yml"
      - "src/main.cpp"
      - "src/main_runtime_impl.cpp"
      - "src/runtime_terrain_renderer.h"
      - "src/mission_system.cpp"
      - "src/mission_system.h"
      - "src/park_fence_save_manager.h"
      - "src/pedestrian_system.cpp"
      - "src/building_system.cpp"
      - "src/building_system.h"
      - "src/save_manager.cpp"
      - "src/save_manager.h"
      - "src/ch_core/terrain_heightfield.*"
      - "src/ch_core/map_document.*"

jobs:
  build-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure City Horizon runtime
        shell: pwsh
        run: cmake -S . -B build/runtime-terrain-proof -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON -DCH_VISITOR_FORGE_PREVIEW=OFF

      - name: Build real city_builder runtime
        shell: pwsh
        run: cmake --build build/runtime-terrain-proof --config Release --target city_builder --parallel

      - name: Build terrain heightfield regression
        shell: pwsh
        run: cmake --build build/runtime-terrain-proof --config Release --target terrain_heightfield_test --parallel

      - name: Run terrain heightfield regression
        shell: pwsh
        run: '& "build/runtime-terrain-proof/Release/terrain_heightfield_test.exe"'

      - name: Run focused terrain CTest
        shell: pwsh
        run: ctest --test-dir build/runtime-terrain-proof -C Release -R "terrain|heightfield" --output-on-failure

name: Generate Sand Autotile
# Verification trigger: exercise the current candidate-only tile pipeline.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Converter/file_00000000a974820eafcd5ead28332854.png"
      - "tools/ground_tile_worker.py"
      - "tools/normalize_atomic_path_tile.py"
      - "tools/tile_geometry.py"
      - "tools/generate_sand_paths.py"
      - "tools/validate_path_tiles.py"
      - "tools/validate_ground_tiles.py"
      - "assets/terrain/ground_tile_contract.json"
      - ".github/workflows/generate-sand-autotile.yml"

permissions:
  contents: read

concurrency:
  group: generate-sand-autotile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Prepare flat canonical sand tile
        run: |
          python tools/ground_tile_worker.py \
            Converter/file_00000000a974820eafcd5ead28332854.png \
            out/sand_isometric_candidate.png \
            --strip-edge-band 12 \
            --decontaminate-edge-band 14 \
            --max-dark-pixels 0 \
            --preview out/sand_repeated_preview.png \
            --report out/sand_ground_tile_report.json

      - name: Generate 16-mask sand family
        run: |
          python tools/generate_sand_paths.py \
            --source out/sand_isometric_candidate.png \
            --output-dir out/sand_path_candidate \
            --preview out/sand_path_autotile_preview.png

      - name: Validate generated tiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          source = Path('out/sand_isometric_candidate.png')
          with Image.open(source) as im:
              im.load()
              if im.mode != 'RGBA' or im.size != (128, 64):
                  raise SystemExit(f'{source}: expected 128x64 RGBA, got {im.size} {im.mode}')

          report = json.loads(Path('out/sand_ground_tile_report.json').read_text(encoding='utf-8'))
          if not report.get('ok'):
              raise SystemExit(f"sand seam gate failed: {report}")
          if report.get('edgeHarmonization') != 'exact-border-only':
              raise SystemExit(f"sand worker used unexpected edge harmonization: {report}")
          if report.get('decontaminateEdgePixels') != 14:
              raise SystemExit(f"sand edge decontamination was not enabled: {report}")
          if report.get('nearBlackPixels') != 0:
              raise SystemExit(f"sand still has black residue: {report['nearBlackPixels']}")

          root = Path('out/sand_path_candidate')
          files = sorted(root.glob('sand_path_*.png'))
          if len(files) != 16:
              raise SystemExit(f'expected 16 sand autotile PNGs, found {len(files)}')

          for i in range(16):
              prefix = f'sand_path_{i:02d}_'
              matches = [p for p in files if p.name.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'missing or duplicate mask {prefix}')

          for path in files:
              with Image.open(path) as im:
                  im.load()
                  if im.mode != 'RGBA' or im.size != (128, 64):
                      raise SystemExit(f'{path}: expected 128x64 RGBA, got {im.size} {im.mode}')
          print(
              f"PASS sand source=128x64 RGBA masks=16 edge_error={report['edgeError']} "
              f"decontaminated={report.get('decontaminatedPixels', 0)}"
          )
          PY

      - name: Validate City Horizon ground-tile contract
        run: |
          python tools/validate_ground_tiles.py \
            --profile atomic-path \
            --file out/sand_isometric_candidate.png \
            --directory out/sand_path_candidate \
            --debug

      - name: Validate all sixteen tiles and connected seams
        run: |
          python tools/validate_path_tiles.py \
            --directory out/sand_path_candidate \
            --prefix sand_path --max-dark-pixels 0 \
            --report out/sand_path_family_report.json

      - name: Upload sand previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Sand-Autotile-Preview
          path: |
            out/sand_repeated_preview.png
            out/sand_path_autotile_preview.png
            out/sand_ground_tile_report.json
            out/sand_path_family_report.json
            out/sand_isometric_candidate.png
            out/sand_path_candidate/*.png
          if-no-files-found: warn
          retention-days: 14

name: CH Coaster V2 Full-Lap Regression

# Registered trigger for complete-lap multi-layout validation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch-coaster-v2-full-lap-regression.yml'
      - 'C++/MapForge2/src/coaster_video_proof_main.cpp'
      - 'C++/MapForge2/src/coaster_project_video_main.cpp'
      - 'C++/MapForge2/projects/coaster_flame_01.mapforge.json'
      - 'C++/MapForge2/projects/coaster_flame_stress_*.mapforge.json'
      - 'src/coaster_car_pose.h'
      - 'src/coaster_train_runtime.h'
      - 'assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png'
      - 'assets/vehicles/coaster_flame_01/car_pose_atlas_runtime_v2.json'
      - 'tools/animation_preview/patch_coaster_camera_parity_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-lap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: baseline
            project: C++/MapForge2/projects/coaster_flame_01.mapforge.json
          - slug: compact
            project: C++/MapForge2/projects/coaster_flame_stress_compact.mapforge.json
          - slug: steep
            project: C++/MapForge2/projects/coaster_flame_stress_steep.mapforge.json
          - slug: wide
            project: C++/MapForge2/projects/coaster_flame_stress_wide.mapforge.json

    steps:
      - uses: actions/checkout@v4

      - name: Apply promoted CH_CAMERA_V1 parity invariant
        run: python3 tools/animation_preview/patch_coaster_camera_parity_v1.py

      - name: Validate occupied V2 atlas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct
          from collections import Counter
          from pathlib import Path
          root = Path('assets/vehicles/coaster_flame_01')
          atlas = root / 'car_pose_atlas_v2.png'
          manifest_path = root / 'car_pose_atlas_runtime_v2.json'
          runtime_path = root / 'coaster_flame_01_runtime.json'
          for path in (atlas, manifest_path, runtime_path):
              if not path.is_file():
                  raise SystemExit(f'missing V2 input: {path}')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          if manifest.get('contract') != 'CH_COASTER_CAR_ATLAS_RUNTIME_V2':
              raise SystemExit('wrong V2 atlas contract')
          if manifest.get('poseContract') != 'CH_COASTER_CAR_ORIENTATION_V2':
              raise SystemExit('wrong V2 orientation contract')
          if (manifest.get('frameCount'), manifest.get('columns'), manifest.get('rows')) != (192, 16, 12):
              raise SystemExit('wrong V2 atlas layout')
          expected = {'heading_pitch_16way':112,'vertical_16way':32,'banked_16way':32,'inverted_16way':16}
          families = Counter(f.get('family') for f in manifest.get('frames', []))
          if families != expected:
              raise SystemExit(f'wrong V2 pose families: {dict(families)}')
          header = atlas.read_bytes()[:24]
          if header[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', header[16:24]) != (4096, 3072):
              raise SystemExit('wrong V2 atlas PNG/layout')
          actual = hashlib.sha256(atlas.read_bytes()).hexdigest()
          if actual != manifest.get('spriteSheetSha256'):
              raise SystemExit('V2 atlas SHA mismatch')
          if runtime.get('poseAtlasSource', {}).get('occupiedCompositeSpriteSheetSha256') != actual:
              raise SystemExit('runtime catalog V2 SHA mismatch')
          print('occupied V2 atlas validated', actual)
          PY

      - name: Install renderer dependencies and compatible Qt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ffmpeg libgl1-mesa-dev
          python3 -m pip install --user --upgrade aqtinstall
          QT_ARCH="$(python3 -m aqt list-qt linux desktop --arch 6.8.3 | tr ' ' '\n' | grep -E '(^|_)(gcc_64|linux_gcc_64)$' | head -n1 || true)"
          if [ -z "$QT_ARCH" ]; then
            QT_ARCH="$(python3 -m aqt list-qt linux desktop --arch 6.8.3 | tr ' ' '\n' | grep -E 'gcc.*64|64.*gcc' | head -n1 || true)"
          fi
          test -n "$QT_ARCH"
          python3 -m aqt install-qt linux desktop 6.8.3 "$QT_ARCH" -O "$HOME/Qt"
          QT_CONFIG="$(find "$HOME/Qt/6.8.3" -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          test -n "$QT_CONFIG"
          QT_PREFIX="${QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_PREFIX/plugins" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure and build renderer
        run: |
          set -euo pipefail
          cmake -S tools/animation_preview/coaster_video_proof \
            -B build/ch-coaster-full-lap -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build build/ch-coaster-full-lap --target MapForge2CoasterVideoProof --parallel

      - name: Render complete lap
        run: |
          set -euo pipefail
          OUT="out/ch-coaster-full-lap/${{ matrix.slug }}"
          rm -rf "$OUT"
          mkdir -p "$OUT/frames"
          ./build/ch-coaster-full-lap/MapForge2CoasterVideoProof \
            "$OUT/frames" \
            assets/vehicles/coaster_flame_01/car_pose_atlas_v2.png \
            '${{ matrix.project }}'
          mv "$OUT/frames/capture_meta.json" "$OUT/capture_meta.json"
          FRAME_COUNT="$(find "$OUT/frames" -type f -name 'frame_*.png' | wc -l)"
          python3 - "$OUT/capture_meta.json" "$FRAME_COUNT" <<'PY'
          import json, math, sys
          from pathlib import Path
          meta = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          actual = int(sys.argv[2])
          if meta.get('contract') != 'CH_COASTER_FULL_LAP_CAPTURE_V1' or meta.get('fullLap') is not True:
              raise SystemExit('capture is not marked as a complete lap')
          expected = math.ceil(meta['routeMeters'] / meta['trainSpeedMps'] * meta['fps']) + 1
          if meta['frameCount'] != expected or actual != expected:
              raise SystemExit(f'full-lap frame mismatch: meta={meta["frameCount"]} actual={actual} expected={expected}')
          if abs(meta.get('firstLeadDistanceMeters', 1.0)) > 1e-9 or abs(meta.get('lastLeadDistanceMeters', 1.0)) > 1e-9:
              raise SystemExit('capture does not return lead car exactly to route origin')
          if meta['lapSeconds'] <= 12.0 and meta['routeMeters'] > 132.0:
              raise SystemExit('capture appears truncated to legacy 12-second window')
          print(f'full lap validated: {meta["routeMeters"]:.3f} m, {meta["lapSeconds"]:.3f} s, {actual} frames')
          PY

      - name: Encode complete-lap MP4 and evenly sampled contact sheet
        run: |
          set -euo pipefail
          OUT="out/ch-coaster-full-lap/${{ matrix.slug }}"
          ffmpeg -y -framerate 30 -i "$OUT/frames/frame_%04d.png" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            "$OUT/coaster_${{ matrix.slug }}_full_lap.mp4"
          SAMPLE_FPS="$(python3 - "$OUT/capture_meta.json" <<'PY'
          import json, sys
          from pathlib import Path
          meta=json.loads(Path(sys.argv[1]).read_text())
          print(16.0/max(meta['lapSeconds'], 0.001))
          PY
          )"
          ffmpeg -y -i "$OUT/coaster_${{ matrix.slug }}_full_lap.mp4" \
            -vf "fps=${SAMPLE_FPS},scale=480:-1,tile=4x4" -frames:v 1 \
            "$OUT/contact_sheet_full_lap.png"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames -of json \
            "$OUT/coaster_${{ matrix.slug }}_full_lap.mp4" > "$OUT/ffprobe.json"
          test -s "$OUT/coaster_${{ matrix.slug }}_full_lap.mp4"
          test -s "$OUT/contact_sheet_full_lap.png"

      - name: Write regression report
        run: |
          set -euo pipefail
          OUT="out/ch-coaster-full-lap/${{ matrix.slug }}"
          python3 - "$OUT/capture_meta.json" "$OUT/proof_report.json" <<'PY'
          import json, sys
          from pathlib import Path
          meta=json.loads(Path(sys.argv[1]).read_text())
          report={
            'contract':'CH_COASTER_FULL_LAP_REGRESSION_V1',
            'status':'ok',
            'layout':'${{ matrix.slug }}',
            'project':'${{ matrix.project }}',
            'cameraContract':'CH_CAMERA_V1',
            'carPoseContract':'CH_COASTER_CAR_ATLAS_RUNTIME_V2',
            'trainRuntimeContract':'CH_COASTER_TRAIN_RUNTIME_V2',
            'fullLapRequired':True,
            'fullLapValidated':True,
            'routeMeters':meta['routeMeters'],
            'lapSeconds':meta['lapSeconds'],
            'frameCount':meta['frameCount'],
            'fps':meta['fps'],
            'staleFrameReuseAllowed':False
          }
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2)+'\n')
          PY

      - name: Upload full-lap regression proof
        uses: actions/upload-artifact@v4
        with:
          name: CH-Coaster-V2-Full-Lap-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            out/ch-coaster-full-lap/${{ matrix.slug }}/coaster_${{ matrix.slug }}_full_lap.mp4
            out/ch-coaster-full-lap/${{ matrix.slug }}/contact_sheet_full_lap.png
            out/ch-coaster-full-lap/${{ matrix.slug }}/capture_meta.json
            out/ch-coaster-full-lap/${{ matrix.slug }}/ffprobe.json
            out/ch-coaster-full-lap/${{ matrix.slug }}/proof_report.json
          if-no-files-found: error
          retention-days: 14

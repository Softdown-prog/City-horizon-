name: Generate Dirt Autotile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/terrain/dirt_isometric_01.png"
      - "tools/generate_dirt_paths.py"
      - "tools/ground_tile_worker.py"
      - "tools/normalize_atomic_path_tile.py"
      - "tools/tile_geometry.py"
      - "tools/validate_path_tiles.py"
      - "tools/validate_ground_tiles.py"
      - "assets/terrain/ground_tile_contract.json"
      - ".github/workflows/generate-dirt-autotile.yml"

permissions:
  contents: read

concurrency:
  group: generate-dirt-autotile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Prepare candidate from versioned dirt source
        run: |
          python tools/ground_tile_worker.py \
            assets/terrain/dirt_isometric_01.png \
            out/dirt_isometric_candidate.png \
            --preview out/dirt_repeated_preview.png \
            --report out/dirt_ground_tile_report.json

      - name: Validate candidate geometry
        run: |
          python tools/validate_ground_tiles.py \
            --profile atomic-path \
            --file out/dirt_isometric_candidate.png

      - name: Generate 16-mask dirt family
        run: |
          python tools/generate_dirt_paths.py \
            --source out/dirt_isometric_candidate.png \
            --output-dir out/dirt_path_candidate \
            --preview out/dirt_path_autotile_preview.png

      - name: Validate generated tiles
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('out/dirt_isometric_candidate.png')
          with Image.open(source) as im:
              im.load()
              if im.mode != 'RGBA' or im.size != (128, 64):
                  raise SystemExit(f'{source}: expected 128x64 RGBA, got {im.size} {im.mode}')

          root = Path('out/dirt_path_candidate')
          files = sorted(root.glob('dirt_path_*.png'))
          if len(files) != 16:
              raise SystemExit(f'expected 16 dirt autotile PNGs, found {len(files)}')

          expected = [f'dirt_path_{i:02d}_' for i in range(16)]
          for prefix in expected:
              matches = [p for p in files if p.name.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'missing or duplicate mask {prefix}')

          for path in files:
              with Image.open(path) as im:
                  im.load()
                  if im.mode != 'RGBA':
                      raise SystemExit(f'{path}: expected RGBA, got {im.mode}')
                  if im.size != (128, 64):
                      raise SystemExit(f'{path}: expected 128x64, got {im.size}')
          print('PASS source=128x64 RGBA masks=16')
          PY

      - name: Validate all sixteen tiles and connected seams
        run: |
          python tools/validate_path_tiles.py \
            --directory out/dirt_path_candidate \
            --prefix dirt_path \
            --report out/dirt_path_family_report.json

      - name: Upload autotile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Dirt-Autotile-Preview
          path: |
            out/dirt_path_autotile_preview.png
            out/dirt_path_family_report.json
            out/dirt_repeated_preview.png
            out/dirt_ground_tile_report.json
            out/dirt_isometric_candidate.png
            assets/terrain/dirt_isometric_01.png
            out/dirt_path_candidate/*.png
          if-no-files-found: warn
          retention-days: 14

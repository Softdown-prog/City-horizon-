name: Generate Dirt Autotile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/terrain/dirt_isometric_01.png"
      - "tools/generate_dirt_paths.py"
      - ".github/workflows/generate-dirt-autotile.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: generate-dirt-autotile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Download approved dirt source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35670104713
          name: City-Horizon-Atomic-Path-MapForge-Test
          path: out/approved_dirt_source

      - name: Restore approved runtime dirt tile
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(find out/approved_dirt_source -type f -name 'normalized_atomic_path_128x64.png' -print -quit)"
          test -n "$SOURCE"
          cp "$SOURCE" assets/terrain/dirt_isometric_01.png
          python - <<'PY'
          from PIL import Image
          path = 'assets/terrain/dirt_isometric_01.png'
          with Image.open(path) as im:
              im.load()
              if im.mode != 'RGBA':
                  raise SystemExit(f'{path}: expected RGBA, got {im.mode}')
              if im.size != (128, 64):
                  raise SystemExit(f'{path}: expected 128x64, got {im.size}')
          print('PASS approved dirt source restored: 128x64 RGBA')
          PY

      - name: Generate 16-mask dirt family
        run: |
          python tools/generate_dirt_paths.py \
            --source assets/terrain/dirt_isometric_01.png \
            --output-dir assets/terrain/paths/dirt_01 \
            --preview out/dirt_path_autotile_preview.png

      - name: Validate generated tiles
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/terrain/dirt_isometric_01.png')
          with Image.open(source) as im:
              im.load()
              if im.mode != 'RGBA' or im.size != (128, 64):
                  raise SystemExit(f'{source}: expected 128x64 RGBA, got {im.size} {im.mode}')

          root = Path('assets/terrain/paths/dirt_01')
          files = sorted(root.glob('dirt_path_*.png'))
          if len(files) != 16:
              raise SystemExit(f'expected 16 dirt autotile PNGs, found {len(files)}')

          expected = [f'dirt_path_{i:02d}_' for i in range(16)]
          for prefix in expected:
              matches = [p for p in files if p.name.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'missing or duplicate mask {prefix}')

          for path in files:
              with Image.open(path) as im:
                  im.load()
                  if im.mode != 'RGBA':
                      raise SystemExit(f'{path}: expected RGBA, got {im.mode}')
                  if im.size != (128, 64):
                      raise SystemExit(f'{path}: expected 128x64, got {im.size}')
          print('PASS source=128x64 RGBA masks=16')
          PY

      - name: Upload autotile preview
        uses: actions/upload-artifact@v4
        with:
          name: City-Horizon-Dirt-Autotile-Preview
          path: |
            out/dirt_path_autotile_preview.png
            assets/terrain/dirt_isometric_01.png
            assets/terrain/paths/dirt_01/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated runtime tiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terrain/dirt_isometric_01.png assets/terrain/paths/dirt_01
          if git diff --cached --quiet; then
            echo "Dirt runtime tile and autotile family already up to date."
            exit 0
          fi
          git commit -m "asset: regenerate approved dirt autotile family"
          git pull --rebase origin main
          git push origin HEAD:main
